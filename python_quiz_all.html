    h1{font-size:1.4rem}

    .qc-icon{width:48px;height:48px;font-size:1.6rem;border-radius:14px}
    .qc-go{display:none}

  .ms-who-row{display:flex;gap:8px;flex-wrap:wrap}

  .ms-who select:focus,.ms-who input:focus{outline:3px solid #bfb4e4;outline-offset:1px}
  .ms-who .ms-btn{padding:9px 20px;font-size:1rem}
  .ms-who .ms-err{color:#b25d6c;font-size:.88rem;margin-top:6px}
  .ms-who .ms-err:empty{display:none}
  .ms-btn{font-family:var(--font);font-weight:700;font-size:1.05rem;border:none;border-radius:999px;padding:11px 22px;cursor:pointer;background:var(--ms-accent);color:#ffffff;box-shadow:0 4px 0 var(--ms-deep)}
  .ms-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ms-deep)}
  .ms-btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--ms-deep)}
  .ms-btn:focus-visible{outline:3px solid #bfb4e4;outline-offset:3px}
  .ms-wrap{display:grid;gap:14px;margin-top:18px}
  .ms-panel{background:#ffffff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 #ddd7e6;text-align:left;word-break:keep-all}
  .ms-panel h3{font-size:1.05rem;font-weight:800;margin-bottom:8px}
  .ms-rows{list-style:none;display:grid;margin-bottom:10px}
  .ms-rows li{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;padding:5px 0;border-bottom:1px solid #eeeaf2}
  .ms-rows li span{color:#686472}
  .ms-rows li.no b{color:#a8a3b0;font-weight:500}
  .ms-total{margin-bottom:12px}
  .ms-total b{font-weight:800}
  .ms-act{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .ms-left{font-size:.88rem;color:#686472}
  .ms-note,.ms-msg{font-size:.9rem;color:#686472;margin-top:8px}

  .card .ms-wrap{margin:0 0 20px}
  .card .ms-panel{box-shadow:none;background:#f7f2e6}
  .card .ms-rows li{border-bottom-color:#e6dfcd}
  a.credit{width:max-content;color:var(--ink);text-decoration:none}
  a.credit:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</head>

  .question .qn{color:var(--pink-deep);margin-right:4px}
  code{font-family:'Nanum Gothic Coding',Consolas,monospace;font-size:.95em;background:#f6f4fa;color:#5a4f7e;padding:1px 6px;border-radius:6px}
  pre.code{position:relative;background:var(--code-bg);color:#f5f3fc;border-radius:18px;padding:38px 18px 16px;margin:14px 0 4px;font-family:'Nanum Gothic Coding',Consolas,monospace;font-size:1.02rem;line-height:1.7;overflow-x:auto}
  pre.code::before{content:"";position:absolute;top:14px;left:18px;width:10px;height:10px;border-radius:50%;background:#d6557d;box-shadow:16px 0 0 #d3b981,32px 0 0 #a4cdc0}

  .t-kw{color:#e6b7cd;font-weight:700}.t-str{color:#e1d2a8}.t-num{color:#b7dbe6}.t-fn{color:#c0dcb4}.t-com{color:#9796aa;font-style:italic}

  /* 힌트 버튼 */
  .hint-row{display:flex;justify-content:flex-end;margin:12px 0 10px}
  .hint-btn{font-family:var(--font);font-weight:700;font-size:1rem;background:#f6f3e5;color:#635223;border:2px solid #ddd7e6;border-radius:999px;padding:6px 16px;cursor:pointer;box-shadow:0 3px 0 #ddd7e6}
  .hint-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ddd7e6}
  .hint-btn:disabled{opacity:.5;cursor:default}
  .hint-box{background:#faf7ef;border:2px solid #ddd7e6;border-radius:16px;padding:10px 14px;margin-bottom:12px;word-break:keep-all;animation:pop .3s ease}
  .hint-box b{font-family:var(--font);font-weight:700;color:#725d28}

  /* 보기 */
  .choices{display:grid;gap:12px}
  .choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fdfcf9;border:2.5px solid #ddd7e6;border-radius:18px;padding:13px 14px;font:inherit;font-size:1.08rem;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #ddd7e6;transition:transform .12s,box-shadow .12s,border-color .12s,background .2s,opacity .2s}
  .choice:hover:not(:disabled){border-color:#c9c2d5;transform:translateY(-2px);box-shadow:0 6px 0 #c9c2d5}
  .choice:disabled{cursor:default}
  .choice .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font);font-weight:700;font-size:1.05rem}
  .choice:nth-child(1) .num{background:#ddd7e6}.choice:nth-child(2) .num{background:#ddd7e6}.choice:nth-child(3) .num{background:#ddd7e6}
  .choice .label{flex:1;min-width:0;word-break:keep-all}
  .choice .mark{flex:none;font-size:1.3rem;font-weight:700;width:22px;text-align:center}
  .choice.correct{background:var(--good-bg);border-color:#ddd7e6;box-shadow:0 4px 0 #ddd7e6}
  .choice.correct .num{background:var(--good);color:#ffffff}.choice.correct .mark{color:var(--good)}
  .choice.wrong{background:var(--bad-bg);border-color:#ddd7e6;box-shadow:0 4px 0 #ddd7e6}

  .feedback{margin-top:18px;border-radius:18px;padding:14px 18px;border:2.5px solid;font-size:1.02rem;word-break:keep-all;animation:pop .3s ease}

  /* 결과 */

  .final-score{font-family:var(--font);font-weight:700;font-size:4rem;line-height:1.1;color:var(--pink-deep);margin:8px 0 2px}
  .final-score small{font-size:1.5rem;color:var(--ink-soft)}
  .final-msg{font-size:1.1rem;margin:6px 0 18px;word-break:keep-all}
  .stage-result{list-style:none;display:grid;gap:8px;max-width:460px;margin:0 auto 22px;text-align:left}
  .stage-result li{display:flex;align-items:center;gap:10px;background:#fbfafd;border:2px solid #ddd7e6;border-radius:14px;padding:9px 14px}
  .stage-result .nm{flex:1}
  .stage-result .meter{width:90px;height:10px;border-radius:999px;background:#f2eef7;overflow:hidden}
  .stage-result .meter span{display:block;height:100%;background:var(--good)}
  .stage-result .ct{font-family:var(--font);font-weight:700;width:44px;text-align:right}
  .wrong-list{font-size:.92rem;color:var(--ink-soft);margin:-8px 0 20px;word-break:keep-all}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  footer{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-top:22px}

  .particle{position:fixed;pointer-events:none;font-size:20px;z-index:50;animation:fly .9s ease-out forwards;color:#efb72d;font-family:var(--font)}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot));opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
  @media (max-width:560px){
    body{padding:18px 16px 36px}
    .card{padding:20px 16px;border-radius:22px}
    h1{font-size:1.4rem}
    .mascot{width:52px;height:52px;font-size:1.9rem;border-radius:16px}
    .question{font-size:1.16rem}
    pre.code{font-size:.92rem;padding:36px 14px 14px}
    .stage-list{grid-template-columns:1fr}
    .final-score{font-size:3.3rem}
  }

  /* ---------- 좌측 정렬 ---------- */
  #start,#result,footer{text-align:left}
  .stage-list,.rules,.name-form,.file-panel,.stage-result,.ranking,.review{margin-left:0;margin-right:0;max-width:none}
  .name-form label{padding-left:0}
  .review,.result-actions{justify-content:flex-start}
  .final-score,.final-msg,.final-time,.wrong-list{text-align:left}

  /* ---------- OX 버튼 ---------- */
  .choices{grid-template-columns:1fr 1fr !important;gap:14px}
  .choice{position:relative;flex-direction:column;justify-content:center;min-height:120px;padding:10px}
  .choice .num{display:none}
  .choice .label{flex:none;font-size:3.6rem;font-weight:800;line-height:1;text-align:center;font-family:var(--font)}
  .choice:nth-child(1) .label{color:#415e75}
  .choice:nth-child(2) .label{color:#a9515f}
  .choice.correct .label,.choice.wrong .label{color:inherit}
  .choice .mark{position:absolute;top:10px;right:14px}
  .question{font-size:1.3rem}
  @media (max-width:560px){ .choice{min-height:96px} .choice .label{font-size:3rem} }
  /* 힌트 항상 보이기 */
  .hint-row{display:none}
  .hint-box{margin-top:12px}
  /* 행간: 문제 112%, 힌트 130% (KoPub 기준) */
  .question{line-height:1.12 !important}
  .hint-box,.hint-box p,.hint-always{line-height:1.3 !important}
  /* ---------- 난이도 표시 (문제 맨 아래, 노란 별만) ---------- */
  .diff-row{display:flex;align-items:center;gap:8px;margin-top:22px;padding-top:12px;border-top:1px solid #ddd7e6;font-size:.85rem;color:var(--ink-soft)}
  .diff-row:empty{display:none}
  .diff-row .stars{font-size:1.15rem;letter-spacing:2px;color:#efb72d;line-height:1}
  .diff-row .stars .off{color:#cac3cf}
  .diff-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.88rem;color:var(--ink-soft);margin:0 0 18px}
  .diff-legend .it{display:inline-flex;align-items:center;gap:4px}
  .diff-legend .st{color:#efb72d;letter-spacing:1px}
  .credit{display:block;margin-top:6px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  /* PC에서 진행 표시·단계 배지·알아두기 제목 키우기 */
  @media (min-width:561px){
    .progress-text{font-size:1.25rem}
    .progress-text b{font-size:1.55rem}
    .tag{font-size:1rem;padding:4px 14px}
    .concept .ct{font-size:1.02rem;margin-bottom:4px}
  }
  .ox-hero{display:flex;gap:.18em;line-height:1}
  .ox-hero svg{width:1em;height:1em;display:block}
  /* 단계 번호: 분류 표시라서 버튼처럼 보이지 않게, 배경과 비슷한 톤의 조금 어두운 원 + 짙은 글자(가. 나. 다.) */
  .stage-list .sn{width:36px;height:36px;background:#ebe3d0;color:#5b5243;border:none;box-shadow:none;font-family:var(--font);font-weight:700;font-size:.92rem;letter-spacing:-.02em;line-height:1;padding-left:3px}
  /* ---------- 학번·이름 입력과 점수 보내기 ---------- */
  .ms-who{background:#ffffff;border-radius:28px;padding:22px 28px 24px;margin:0 0 20px;box-shadow:0 5px 0 #ddd7e6;font-family:var(--font);text-align:left;word-break:keep-all}
  .ms-who.set{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px 8px 14px;box-shadow:none;border:2px solid #ddd7e6;width:max-content;max-width:100%}
  .ms-who-me{font-size:.95rem;color:#686472}
  .ms-who-me b{color:#33303c}
  .ms-edit{font:inherit;font-size:.82rem;font-weight:700;color:#5a4f7e;background:#f6f4fa;border:none;border-radius:999px;padding:3px 12px;cursor:pointer}
  .ms-who-t{display:block;font-weight:800;font-size:1.02rem;margin-bottom:12px;color:#33303c}
  .ms-who-row{display:flex;gap:8px;flex-wrap:wrap}
  .ms-who select,.ms-who input{font:inherit;font-size:1rem;padding:9px 12px;border-radius:14px;border:2px solid #ddd7e6;background:#ffffff;color:#33303c;min-width:0}
  .ms-who select,.ms-who input{flex:1 1 0}
  @media (max-width:560px){ .ms-who{padding:18px 16px 20px;border-radius:22px} .ms-who select,.ms-who input{padding:9px 8px} .ms-who .ms-gc{flex-grow:1.5} .ms-who .ms-name{flex-grow:1.2} .ms-who .ms-btn{flex:1 0 100%} }
  .ms-who select:focus,.ms-who input:focus{outline:3px solid #bfb4e4;outline-offset:1px}
  .ms-who .ms-btn{padding:9px 20px;font-size:1rem}

  .ms-who .ms-err:empty{display:none}
  .ms-btn{font-family:var(--font);font-weight:700;font-size:1.05rem;border:none;border-radius:999px;padding:11px 22px;cursor:pointer;background:var(--ms-accent);color:#ffffff;box-shadow:0 4px 0 var(--ms-deep)}
  .ms-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ms-deep)}
  .ms-btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--ms-deep)}
  .ms-btn:focus-visible{outline:3px solid #bfb4e4;outline-offset:3px}
  .ms-wrap{display:grid;gap:14px;margin-top:18px}
  .ms-panel{background:#ffffff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 #ddd7e6;text-align:left;word-break:keep-all}
  .ms-panel h3{font-size:1.05rem;font-weight:800;margin-bottom:8px}
  .ms-rows{list-style:none;display:grid;margin-bottom:10px}
  .ms-rows li{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;padding:5px 0;border-bottom:1px solid #eeeaf2}
  .ms-rows li span{color:#686472}
  .ms-rows li.no b{color:#a8a3b0;font-weight:500}
  .ms-total{margin-bottom:12px}
  .ms-total b{font-weight:800}

  .ms-left{font-size:.88rem;color:#686472}
  .ms-note,.ms-msg{font-size:.9rem;color:#686472;margin-top:8px}
  .ms-msg:empty{display:none}
  .card .ms-wrap{margin:0 0 20px}
  .card .ms-panel{box-shadow:none;background:#f7f2e6}
  .card .ms-rows li{border-bottom-color:#e6dfcd}
  a.credit{width:max-content;color:var(--ink);text-decoration:none}
  a.credit:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mascot" aria-hidden="true">🐍</div>
    <div>
      <h1>파이썬 <span class="accent">OX</span> 퀴즈</h1>
      <p>파이썬은 어디에, 왜 쓰일까? 15문제로 워밍업!</p>
    </div>
  </header>

  <!-- 시작 -->
  <section id="start" class="card">
    <div class="hero ox-hero" aria-hidden="true"><svg viewBox="0 0 100 100"><defs><linearGradient id="gO" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f27d97"/><stop offset="1" stop-color="#c63d5d"/></linearGradient></defs><circle cx="50" cy="50" r="33" fill="none" stroke="url(#gO)" stroke-width="17"/><path d="M27 38 A28 28 0 0 1 45 22" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/></svg><svg viewBox="0 0 100 100"><defs><linearGradient id="gX" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b7896"/><stop offset="1" stop-color="#323a52"/></linearGradient></defs><path d="M24 24 L76 76 M76 24 L24 76" fill="none" stroke="url(#gX)" stroke-width="17" stroke-linecap="round"/><path d="M27 32 L37 42 M68 32 L60 40" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/></svg></div>
    <h2>맞으면 O, 틀리면 X!</h2>
    <p class="intro">파이썬이 <b>이름의 뜻과 역사, 특징, 쓰이는 분야</b>를 알아봄. 문제마다 <b>💡 힌트</b>가 함께 보임.<br>틀려도 힌트를 보고 다시 고를 수 있음.</p>
    <ul class="stage-list" id="stageList"></ul>
    <div class="diff-legend"><span>난이도</span><span class="it"><span class="st">★</span>쉬움</span><span class="it"><span class="st">★★</span>보통</span><span class="it"><span class="st">★★★</span>어려움</span></div>
    <button class="btn" id="startBtn" type="button">시작하기 ▶</button>
  </section>

  <!-- 문제 -->
  <section id="quiz" class="card hidden">
    <div class="status">
      <div class="progress-text"><b id="qNum">1</b> / <span id="qTotal">15</span> 번째 문제</div>
      <div class="score-badge" id="scoreBadge"><span class="sb-star">★</span><span id="score">0</span>개 정답</div>
    </div>
    <div class="bar"><span id="bar"></span></div>
    <span class="tag" id="qStage"></span>
    <h2 class="question" id="qText"></h2>
    <pre class="code hidden" id="qCode"></pre>
    <div class="hint-row"><button class="hint-btn" id="hintBtn" type="button">💡 힌트 보기</button></div>
    <div class="hint-box hidden" id="hintBox"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback hidden" id="feedback" aria-live="polite"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn" type="button">다음 문제 ▶</button></div>
    <div class="diff-row" id="qDiff"></div>
  </section>

  <!-- 결과 -->
  <section id="result" class="card hidden">
    <div class="trophy" id="resultEmoji" aria-hidden="true">🏆</div>
    <h2 id="resultTitle">퀴즈 끝! 수고 많았음</h2>
    <div class="final-score"><span id="finalScore">0</span><small> / <span id="finalTotal">15</span>개</small></div>
    <p class="final-msg" id="finalMsg"></p>
    <ul class="stage-result" id="stageResult"></ul>
    <p class="wrong-list" id="wrongList"></p>
    <div class="result-actions">
      <button class="btn" id="retryWrongBtn" type="button">❗ 틀린 문제만 다시 풀기</button>
      <button class="btn sub" id="retryAllBtn" type="button">🔄 처음부터 다시 풀기</button>
    </div>
  </section>

  <footer>파이썬 워밍업 · OX 15문제<a class="credit" href="https://www.instagram.com/Make.a.long.term.memory" target="_blank" rel="noopener">by Make a long term memory</a></footer>
</div>

<script>
/* 단계 정보 */
const STAGES = [
  { name: "특징과 문법",    color: ["#e8f3ee", "#2f5946"] },
  { name: "활용 분야와 환경", color: ["#f8eaf0", "#94536d"] },
  { name: "이름과 역사",    color: ["#ede4cd", "#635223"] }
];

/* 문제 30개
   s: 단계 번호(0부터), c: 보기 3개, a: 정답 위치(0부터)
   `백틱` 안의 글자는 코드 모양으로 보여요 */
const Q = [
  { s:2, q:"파이썬(Python)이라는 이름은 영국의 코미디 프로그램 <b>'몬티 파이썬'</b>에서 따왔다.", c:["O","X"], a:0,
    h:"파이썬은 '비단뱀'이라는 뜻도 있지만, 만든 사람이 즐겨 보던 TV 프로그램 이름이기도 해요.",
    e:"맞아요! 만든 사람이 좋아하던 영국 코미디 '몬티 파이썬의 날아다니는 서커스(Monty Python's Flying Circus)'에서 이름을 따왔어요. 로고의 뱀은 나중에 붙은 그림이에요." },
  { s:2, q:"파이썬은 네덜란드의 프로그래머 <b>귀도 반 로섬</b>이 만들었다.", c:["O","X"], a:0,
    h:"파이썬은 1989년 크리스마스 휴가에 네덜란드의 프로그래머 귀도 반 로섬(Guido van Rossum)이 취미로 만들기 시작한 언어예요.",
    e:"맞아요! 귀도 반 로섬(Guido van Rossum)이 1989년 말부터 만들기 시작해 1991년에 처음 공개했어요." },
  { s:2, q:"파이썬은 <b>전문 개발자만</b> 쓸 수 있도록 어렵게 만든 언어다.", c:["O","X"], a:1,

/* 문제별 난이도 (1: ★ 쉬움, 2: ★★ 보통, 3: ★★★ 어려움) — 문제 순서와 같아요 */
const DIFF = [1, 1, 1, 1, 2, 1, 2, 1, 1, 2, 1, 1, 1, 1, 1];
const DIFF_LABEL = ["", "쉬움", "보통", "어려움"];
function setDiff(d){
  const el = document.getElementById("qDiff");
  if (!el) return;
  if (!d){ el.innerHTML = ""; return; }
  el.innerHTML = `<span class="dl">난이도</span><span class="stars" aria-hidden="true">${"★".repeat(d)}<span class="off">${"☆".repeat(3 - d)}</span></span>`;
  el.setAttribute("aria-label", `난이도 별 ${d}개 (${DIFF_LABEL[d]})`);
}

/* 도우미 */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 문제 글 속 <u> 밑줄만 허용하고 나머지는 안전하게 표시
const fmt = s => esc(s).replace(/&lt;(\/?)(u|b)&gt;/g,"<$1$2>").replace(/`([^`]+)`/g,"<code>$1</code>");
function highlight(code){
  const re = /("[^"\n]*"|'[^'\n]*')|(#.*$)|\b(if|elif|else|for|in|and|or|not|True|False)\b|\b(print|input|int|range|str)\b|\b(\d+)\b/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="t-str">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-com">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="t-kw">${m[3]}</span>`;
    else if (m[4]) out += `<span class="t-fn">${m[4]}</span>`;
    else if (m[5]) out += `<span class="t-num">${m[5]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, n = 12){
  if (reduceMotion) return;
  const em = ["★","✦","★","✧","★"];
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.className = "particle"; s.textContent = em[i % em.length];
    const ang = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(ang) * d + "px");
    s.style.setProperty("--dy", Math.sin(ang) * d - 30 + "px");
    s.style.setProperty("--rot", (Math.random() * 240 - 120) + "deg");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function restartAnim(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* 시작 화면의 단계 목록 */
const ROMAN = ["가.","나.","다.","라.","마.","바.","사.","아.","자.","차."];
$("stageList").innerHTML = STAGES.map((st, i) => {
  const n = Q.filter(q => q.s === i).length;
  const first = Q.findIndex(q => q.s === i) + 1;
  return `<li><span class="sn">${ROMAN[i]}</span>` +
         `<div><b>${st.name}</b><small>${n}문제</small></div></li>`;
}).join("");

/* 상태 */
let order = [];      // 이번에 풀 문제 번호들
let pos = 0;         // order 안에서의 위치
let correct = 0;
let tries = 0;
let locked = false;
let firstTry = {};   // 문제번호 → 첫 시도에 맞혔는지

function showScreen(id){
  ["start","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function startRound(list){
  order = list; pos = 0; correct = 0; firstTry = {};
  $("score").textContent = 0;
  $("qTotal").textContent = order.length;
  showScreen("quiz");
  render();
}

function render(){
  const qi = order[pos], q = Q[qi], st = STAGES[q.s];
  tries = 0; locked = false;
  $("qNum").textContent = pos + 1;
  $("bar").style.width = (pos / order.length * 100) + "%";
  const tag = $("qStage");
  tag.textContent = `${st.name}`;
  tag.style.background = st.color[0]; tag.style.color = st.color[1];
  setDiff(DIFF[qi]);
  $("qText").innerHTML = `<span class="qn">${qi + 1}.</span>${fmt(q.q)}`;
  if (q.code){ $("qCode").innerHTML = highlight(q.code); $("qCode").classList.remove("hidden"); }
  else $("qCode").classList.add("hidden");

  $("hintBtn").disabled = false;
  $("hintBox").classList.remove("hidden");
  $("hintBox").innerHTML = `<b>💡 힌트</b><br>${fmt(q.h)}`;

  const box = $("choices"); box.innerHTML = "";
  q.c.map((_, i) => i).forEach((ci, k) => {
    const t = q.c[ci];
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice";
    b.innerHTML = `<span class="num">${"①②③"[k]}</span><span class="label">${fmt(t)}</span><span class="mark" aria-hidden="true"></span>`;
    b.addEventListener("click", () => choose(b, ci));
    box.appendChild(b);
  });

  $("feedback").className = "feedback hidden"; $("feedback").innerHTML = "";
  const next = $("nextBtn");
  next.classList.add("hidden");
  next.textContent = pos === order.length - 1 ? "결과 보기 🏁" : "다음 문제 ▶";
  restartAnim($("quiz"), "enter");
}

function showHint(){
  $("hintBox").classList.remove("hidden");
  $("hintBtn").disabled = true;
}

function choose(btn, ci){
  if (locked || btn.disabled) return;
  const qi = order[pos], q = Q[qi], fb = $("feedback");
  tries++;
  if (ci === q.a){
    locked = true;
    btn.classList.add("correct"); btn.querySelector(".mark").textContent = "✔";
    document.querySelectorAll(".choice").forEach(b => {
      b.disabled = true;
      if (b !== btn && !b.classList.contains("wrong")) b.classList.add("dim");
    });
    let title, sub = "";
    if (tries === 1){
      firstTry[qi] = true; correct++;
      $("score").textContent = correct; restartAnim($("scoreBadge"), "bump");
      title = "🎉 정답!";
    } else {
      title = "👍 정답! 힌트를 보고 찾아냄";
      sub = `<div class="fb-sub">한 번에 맞히지 못한 문제는 '틀린 문제'로 기록됨. 나중에 다시 풀어 보기!</div>`;
    }
    fb.className = "feedback good";
    fb.innerHTML = `<div class="fb-title">${title}</div>${sub}<div class="explain"><b>✏️ 해설</b><br>${fmt(q.e)}</div>`;
    const r = btn.getBoundingClientRect(); burst(r.left + 30, r.top + r.height / 2);
    $("bar").style.width = ((pos + 1) / order.length * 100) + "%";
    const next = $("nextBtn"); next.classList.remove("hidden");
    next.focus({ preventScroll: true });
    next.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  } else {
    if (tries === 1) firstTry[qi] = false;
    btn.classList.add("wrong"); btn.disabled = true; btn.querySelector(".mark").textContent = "✖";
    restartAnim(btn, "shake");
    showHint();
    fb.className = "feedback bad";
    fb.innerHTML = `<div class="fb-title">😢 아쉬움, 오답!</div>위의 <b>💡 힌트</b>를 다시 읽고 다른 보기를 골라 보기.`;
    restartAnim(fb, "feedback");
    $("hintBox").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  }
}

function next(){
  if (pos < order.length - 1){ pos++; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }
  else showResult();
}

let lastWrong = [];
function showResult(){
  const total = order.length;
  $("finalScore").textContent = correct;
  $("finalTotal").textContent = total;
  const rate = correct / total;
  let emoji, msg;
  if (rate === 1){ emoji = "🏆"; msg = "모두 한 번에 맞힘! 파이썬을 잘 이해하고 있음 🐍✨"; }
  else if (rate >= 0.8){ emoji = "🥳"; msg = "아주 잘했음! 틀린 문제만 한 번 더 보면 완벽함."; }
  else if (rate >= 0.5){ emoji = "🌱"; msg = "좋음! 힌트와 해설을 떠올리며 틀린 문제를 다시 풀어 보기."; }
  else { emoji = "💪"; msg = "처음엔 누구나 어려움. 틀린 문제를 다시 풀면 금방 익숙해짐!"; }
  $("resultEmoji").textContent = emoji;
  $("finalMsg").textContent = msg;
  $("resultTitle").textContent = total === Q.length ? "퀴즈 끝! 수고 많았음" : "다시 풀기 끝! 수고 많았음";

  // 단계별 결과
  $("stageResult").innerHTML = STAGES.map((st, i) => {
    const ids = order.filter(qi => Q[qi].s === i);
    if (!ids.length) return "";
    const ok = ids.filter(qi => firstTry[qi]).length;
    return `<li><span class="nm">${st.name}</span>` +
           `<span class="meter"><span style="width:${ok / ids.length * 100}%"></span></span>` +
           `<span class="ct">${ok}/${ids.length}</span></li>`;
  }).join("");

  lastWrong = order.filter(qi => !firstTry[qi]);
  $("wrongList").textContent = lastWrong.length
    ? `다시 볼 문제: ${lastWrong.map(qi => qi + 1 + "번").join(", ")}`
    : "틀린 문제 없음! 🎉";
  $("retryWrongBtn").classList.toggle("hidden", !lastWrong.length);

  showScreen("result");
  if (rate === 1) setTimeout(() => burst(window.innerWidth / 2, window.innerHeight / 3, 24), 400);
}

/* 이벤트 */
$("startBtn").addEventListener("click", () => startRound(Q.map((_, i) => i)));
$("retryAllBtn").addEventListener("click", () => startRound(Q.map((_, i) => i)));
$("retryWrongBtn").addEventListener("click", () => startRound(lastWrong.slice()));
$("hintBtn").addEventListener("click", showHint);
$("nextBtn").addEventListener("click", next);
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  const k = e.key.toLowerCase();
  if (k === "o" || k === "x"){ const b = document.querySelectorAll(".choice")[k === "o" ? 0 : 1]; if (b && !b.disabled) b.click(); return; }
  if (["1","2","3"].includes(e.key)){
    const b = document.querySelectorAll(".choice")[Number(e.key) - 1];
    if (b && !b.disabled) b.click();
  } else if (e.key === "h" || e.key === "H"){ if (!$("hintBtn").disabled) showHint(); }
});

<script>

  .particle{position:fixed;pointer-events:none;font-size:20px;z-index:50;animation:fly .9s ease-out forwards;color:#efb72d;font-family:var(--font)}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot));opacity:0}}

<body>
<div class="app">
  <header class="top">
    <div class="mascot" aria-hidden="true">🐍</div>
    <div>
      <h1>파이썬 <span class="accent">빈칸 채우기</span></h1>
      <p>가장 기본부터, 빈칸에 알맞은 낱말을 골라 익힘!</p>
    </div>
  </header>

  <!-- 시작 -->
  <section id="start" class="card">
    <div class="hero" aria-hidden="true">✏️</div>
    <h2>코드의 빈칸을 채워 볼까요?</h2>
    <p class="intro">파이썬을 몰라도 괜찮음. 문제마다 <b>알아두기</b> 설명과 <b>💡 힌트</b>가 함께 보임.</p>
    <ul class="how">
      <li><span>👆</span><div>아래 <b>보기 3개</b> 중에서 노란 빈칸에 알맞은 낱말을 고르면 됨</div></li>
      <li><span>💡</span><div>문제마다 <b>힌트</b>가 항상 함께 보임. 힌트를 읽고 차근차근 고르면 됨</div></li>
      <li><span>🔁</span><div>틀린 보기는 빨갛게 표시되고, 남은 보기 중에서 다시 고를 수 있음</div></li>
    </ul>
    <div class="topics" id="topics"></div>
    <div class="diff-legend"><span>난이도</span><span class="it"><span class="st">★</span>쉬움</span><span class="it"><span class="st">★★</span>보통</span><span class="it"><span class="st">★★★</span>어려움</span></div>
    <button class="btn" id="startBtn" type="button">시작하기 ▶</button>
  </section>

  <!-- 문제 -->
  <section id="quiz" class="card hidden">
    <div class="status">
      <div class="progress-text"><b id="qNum">1</b> / <span id="qTotal">10</span> 번째 문제</div>
      <div class="score-badge" id="scoreBadge"><span class="sb-star">★</span><span id="score">0</span>개 정답</div>
    </div>
    <div class="steps" id="steps" aria-hidden="true"></div>

    <span class="tag" id="qTopic"></span>
    <div class="concept"><span class="ct">📘 알아두기</span><span id="qConcept"></span></div>
    <h2 class="question" id="qText"></h2>
    <pre class="code" id="qCode"></pre>
    <div class="output" id="qOut"><span class="ol">▶ 실행 결과</span><pre id="qOutText"></pre></div>

    <div class="choices" id="choices"></div>
    <div class="row">
      <button class="hint-btn" id="hintBtn" type="button">💡 힌트 보기</button>
      <span class="spacer"></span>
      <span class="keyhint">키보드 1·2·3으로도 고를 수 있음</span>
    </div>

    <div class="hint-box hidden" id="hintBox"></div>
    <div class="feedback hidden" id="feedback" aria-live="polite"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn" type="button">다음 문제 ▶</button></div>
    <div class="diff-row" id="qDiff"></div>
  </section>

  <!-- 결과 -->
  <section id="result" class="card hidden">
    <div class="trophy" id="resultEmoji" aria-hidden="true">🏆</div>
    <h2 id="resultTitle">빈칸 채우기 끝! 수고 많았음</h2>
    <div class="final-score"><span id="finalScore">0</span><small> / <span id="finalTotal">10</span>개</small></div>
    <p class="final-msg" id="finalMsg"></p>
    <ul class="review" id="review"></ul>
    <div class="result-actions">
      <button class="btn" id="retryWrongBtn" type="button">❗ 틀린 문제만 다시 풀기</button>
      <button class="btn sub" id="retryAllBtn" type="button">🔄 처음부터 다시 풀기</button>
    </div>
  </section>

  <footer>파이썬 기초 · 빈칸 채우기 10문제 · 3지 선다<a class="credit" href="https://www.instagram.com/Make.a.long.term.memory" target="_blank" rel="noopener">by Make a long term memory</a></footer>
</div>

<script>
/* =========================================================
   문제 데이터
   - code 안의 ___ 자리가 빈칸이 됩니다
   - opts: 보기 3개 (첫 번째가 정답, 화면에서는 순서를 섞어요)
   - h   : 힌트 (1단계, 2단계)
   - `백틱` 안 글자는 코드 모양으로 보여요
   ========================================================= */
const Q = [
  { topic:"화면에 출력하기",
    concept:"컴퓨터에게 \"화면에 보여 줘!\"라고 시키는 명령어가 있어요. 괄호 `( )` 안에 보여 줄 내용을 넣어요.",
    q:"화면에 안녕하세요를 출력하려고 해요. 빈칸에 들어갈 명령어는?",
    code:'___("안녕하세요")', out:"안녕하세요", opts:["print","Print","show"],
    h:["'인쇄하다, 출력하다'라는 뜻의 영어 단어예요.","파이썬은 대문자와 소문자를 구별해요. 명령어는 모두 소문자로 써요."],
    e:"`print`는 괄호 안의 내용을 화면에 보여 줘요. 파이썬은 대소문자를 구별해서 `Print`라고 쓰면 오류가 나요." },

  { topic:"문자열",
    concept:"글자(문자열)는 반드시 따옴표 `\" \"` 또는 `' '`로 감싸야 해요. 그래야 컴퓨터가 '이건 글자구나' 하고 알아요.",
    q:"실행 결과가 파이썬이 되도록 빈칸을 채워 보세요.",
    code:"print(___)", out:"파이썬", opts:['"파이썬"',"파이썬","(파이썬)"],
    h:["글자 앞뒤를 무언가로 감싸야 해요.","괄호 `( )`는 명령어에 값을 넘기는 자리예요. 이 값이 '글자'라는 표시는 따로 해 줘야 해요."],
    e:"`\"파이썬\"`처럼 따옴표로 감싸야 글자로 인식돼요. 따옴표 없이 `파이썬`만 쓰면 컴퓨터는 이름(변수)인 줄 알고 오류를 내요." },

  { topic:"계산하기",
    concept:"파이썬은 계산기처럼 쓸 수 있어요. 더하기 `+`, 빼기 `-`, 곱하기 `*`, 나누기 `/`를 써요.",
    q:"실행 결과가 7이 되도록 계산 기호를 채워 보세요.",
    code:"print(3 ___ 4)", out:"7", opts:["+","-","*"],
    h:["3과 4로 7을 만들려면 어떤 계산을 해야 할까요?","수학의 '더하기' 기호와 똑같아요."],
    e:"`3 + 4`를 계산해서 `7`이 출력돼요. 숫자에는 따옴표를 붙이지 않아요." },

  { topic:"곱하기",
    concept:"파이썬에서 곱하기는 수학의 × 대신 별표 `*`를 써요. (키보드 숫자 8 위에 있어요)",
    q:"실행 결과가 12가 되도록 계산 기호를 채워 보세요.",
    code:"print(3 ___ 4)", out:"12", opts:["*","x","×"],
    h:["3과 4로 12를 만들려면 곱해야 해요. 그런데 ×는 키보드에 없어요.","알파벳 `x`는 컴퓨터가 글자(변수 이름)로 읽어요. 키보드로 칠 수 있는 계산 기호를 골라요."],
    e:"파이썬의 곱하기 기호는 `*`예요. `3 * 4`는 `12`가 돼요." },

  { topic:"변수에 저장하기",
    concept:"변수는 값을 담아 두는 '이름표 붙은 상자'예요. `상자이름 = 값` 모양으로 써요.",
    q:"age라는 상자에 17을 저장하려고 해요. 빈칸에 들어갈 기호는?",
    code:"age ___ 17\nprint(age)", out:"17", opts:["=","==",":"],
    h:["'오른쪽 값을 왼쪽 상자에 넣어라'라는 뜻의 기호 하나예요.","등호가 두 개인 `==`는 '같은지 비교'할 때 써요. 지금은 비교가 아니라 저장해야 해요."],
    e:"`=`는 '같다'가 아니라 '저장하라(대입)'라는 뜻이에요. age에 17이 저장되고, `print(age)`로 꺼내 보면 `17`이 나와요." },

  { topic:"변수 꺼내 쓰기",
    concept:"변수에 저장한 값을 쓰려면 변수 이름을 그대로 써요. 이때 따옴표를 붙이면 안 돼요!",
    q:"실행 결과가 민지가 되도록 빈칸을 채워 보세요.",
    code:'name = "민지"\nprint(___)', out:"민지", opts:["name",'"name"',"민지"],
    h:["첫 번째 줄에서 \"민지\"를 어떤 상자에 담았나요?","상자(변수)를 꺼낼 때는 따옴표 없이 이름만 써요."],
    e:"`print(name)`처럼 변수 이름을 쓰면 안에 든 값 `민지`가 출력돼요. `print(\"name\")`이라고 쓰면 글자 name이 그대로 나와요." },

  { topic:"주석",
    concept:"코드에 사람만 읽는 '메모'를 남길 수 있어요. 이것을 주석이라고 하고, 컴퓨터는 주석을 실행하지 않아요.",
    q:"첫 줄이 실행되지 않는 메모가 되도록 맨 앞에 기호를 채워 보세요.",
    code:'___ 인사말을 출력하는 코드\nprint("반가워요")', out:"반가워요", opts:["#","//","!"],
    h:["SNS에서 해시태그를 달 때 쓰는 기호예요.","이 기호 뒤에 쓴 내용은 그 줄 끝까지 모두 메모가 돼요. 컴퓨터는 읽지 않고 넘어가요."],
    e:"`#` 뒤에 쓴 내용은 주석이라서 실행되지 않아요. 그래서 `반가워요`만 출력돼요." },

  { topic:"입력받기",
    concept:"사용자에게 키보드로 값을 입력받을 수 있어요. 괄호 안의 글자는 입력 전에 보여 줄 안내 문구예요.",
    q:"이름을 입력받아 name에 저장하려고 해요. 빈칸에 들어갈 명령어는?",
    code:'name = ___("이름: ")\nprint(name, "님 안녕하세요")', out:"이름: 민지\n민지 님 안녕하세요", opts:["input","print","int"],
    h:["'입력'을 뜻하는 영어 단어예요.","print는 출력, int는 정수로 바꾸기예요. 남은 하나는?"],
    e:"`input()`은 키보드로 입력한 값을 받아 와요. 입력한 '민지'가 name에 저장돼서 인사말이 출력돼요." },

  { topic:"숫자로 바꾸기",
    concept:"`input()`으로 받은 값은 숫자를 입력해도 '글자'예요. 계산하려면 정수(integer)로 바꿔 줘야 해요.",
    q:"입력받은 나이에 1을 더하려고 해요. 빈칸에 들어갈 명령어는?",
    code:'age = ___(input("나이: "))\nprint(age + 1)', out:"나이: 17\n18", opts:["int","str","input"],
    h:["'정수'를 뜻하는 영어 integer를 줄인 말이에요.","str은 글자(string)로 바꾸는 명령이에요. 숫자로 바꾸려면?"],
    e:"`int()`로 감싸면 글자 \"17\"이 숫자 17로 바뀌어서 `age + 1`을 계산할 수 있어요. 바꾸지 않으면 글자와 숫자를 더할 수 없어 오류가 나요." },

  { topic:"조건 비교",
    concept:"`if`는 '만약 ~라면'이라는 뜻으로, 뒤의 조건이 참일 때만 아래 줄을 실행해요. 두 값이 같은지 비교할 때는 `==`(등호 두 개)를 써요. 등호 하나 `=`는 저장이라서 비교에 쓸 수 없어요.",
    q:"입력한 답이 7과 같으면 정답!을 출력하려고 해요. 빈칸에 들어갈 기호는?",
    code:'answer = int(input("3 + 4 = "))\nif answer ___ 7:\n    print("정답!")', out:"3 + 4 = 7\n정답!", opts:["==","=","!="],
    h:["'같은지 비교'하는 기호예요. 저장하는 기호 `=`와는 달라요.","`!=`는 '같지 않다'라는 뜻이에요. 우리는 '같으면' 정답을 출력해야 해요."],
    e:"`==`는 두 값이 같으면 True(참)가 돼요. answer가 7이면 조건이 참이라서 `정답!`이 출력돼요." }
];

/* 문제별 난이도 (1: ★ 쉬움, 2: ★★ 보통, 3: ★★★ 어려움) — 문제 순서와 같아요 */
const DIFF = [1, 2, 1, 1, 2, 2, 1, 1, 2, 2];
const DIFF_LABEL = ["", "쉬움", "보통", "어려움"];
function setDiff(d){
  const el = document.getElementById("qDiff");
  if (!el) return;
  if (!d){ el.innerHTML = ""; return; }
  el.innerHTML = `<span class="dl">난이도</span><span class="stars" aria-hidden="true">${"★".repeat(d)}<span class="off">${"☆".repeat(3 - d)}</span></span>`;
  el.setAttribute("aria-label", `난이도 별 ${d}개 (${DIFF_LABEL[d]})`);
}

/* 도우미 */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
function highlight(code){
  const re = /("[^"\n]*"|'[^'\n]*')|(#.*$)|\b(if|elif|else|for|in|and|or|not|True|False)\b|\b(print|input|int|range|str)\b|\b(\d+)\b/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="t-str">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-com">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="t-kw">${m[3]}</span>`;
    else if (m[4]) out += `<span class="t-fn">${m[4]}</span>`;
    else if (m[5]) out += `<span class="t-num">${m[5]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, n = 12){
  if (reduceMotion) return;
  const em = ["★","✦","★","✧","★"];
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.className = "particle"; s.textContent = em[i % em.length];
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(a) * d + "px");
    s.style.setProperty("--dy", Math.sin(a) * d - 30 + "px");
    s.style.setProperty("--rot", (Math.random() * 240 - 120) + "deg");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}
function restartAnim(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

$("topics").innerHTML = Q.map((q, i) => `<span>${i + 1}. ${esc(q.topic)}</span>`).join("");

/* 상태 */
let order = [], pos = 0, correct = 0, wrongCount = 0, hintLevel = 0, done = false;
let result = {};   // 문제번호 → true(한 번에 맞힘) / false

function showScreen(id){
  ["start","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}
function startRound(list){
  order = list; pos = 0; correct = 0; result = {};
  $("score").textContent = 0;
  $("qTotal").textContent = order.length;
  showScreen("quiz"); render();
}
function renderSteps(){
  $("steps").innerHTML = order.map((qi, i) => {
    let c = "dot";
    if (result[qi] === true) c += " good";
    else if (result[qi] === false) c += " bad";
    else if (i === pos) c += " current";
    return `<span class="${c}"></span>`;
  }).join("");
}
function blankEl(){ return document.querySelector("#qCode .blank"); }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function render(){
  const qi = order[pos], q = Q[qi];
  wrongCount = 0; hintLevel = 0; done = false;
  $("qNum").textContent = pos + 1;
  $("qTopic").textContent = q.topic;
  setDiff(DIFF[qi]);
  $("qConcept").innerHTML = fmt(q.concept);
  $("qText").innerHTML = `<span class="qn">${qi + 1}.</span>${fmt(q.q)}`;
  const parts = q.code.split("___");
  $("qCode").innerHTML = highlight(parts[0]) + `<span class="blank empty" aria-label="빈칸">?</span>` + highlight(parts[1] || "");
  $("qOutText").textContent = q.out;

  const box = $("choices"); box.innerHTML = "";
  shuffle(q.opts.map((_, i) => i)).forEach((oi, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice";
    b.innerHTML = `<span class="num">${k + 1}</span><span class="word">${esc(q.opts[oi])}</span><span class="mark" aria-hidden="true"></span>`;
    b.addEventListener("click", () => choose(b, oi));
    box.appendChild(b);
  });

  $("hintBox").innerHTML = q.h.map((h, i) => `<p><b>💡 힌트 ${i + 1}</b> ${fmt(h)}</p>`).join("");
  $("hintBox").classList.remove("hidden");
  hintLevel = q.h.length;
  $("hintBtn").disabled = false; $("hintBtn").textContent = "💡 힌트 보기";
  $("feedback").className = "feedback hidden"; $("feedback").innerHTML = "";
  const next = $("nextBtn");
  next.classList.add("hidden");
  next.textContent = pos === order.length - 1 ? "결과 보기 🏁" : "다음 문제 ▶";
  renderSteps();
  restartAnim($("quiz"), "enter");
}

function showHint(){
  const q = Q[order[pos]];
  if (hintLevel >= q.h.length) return;
  hintLevel++;
  const box = $("hintBox");
  box.innerHTML = q.h.slice(0, hintLevel).map((h, i) => `<p><b>💡 힌트 ${i + 1}</b> ${fmt(h)}</p>`).join("");
  box.classList.remove("hidden");
  restartAnim(box, "hint-box");
  if (hintLevel >= q.h.length){ $("hintBtn").disabled = true; $("hintBtn").textContent = "💡 힌트 모두 봄"; }
  else $("hintBtn").textContent = "💡 힌트 하나 더";
}

// 자주 하는 실수에 맞춘 한마디
function mistakeNote(q, pick){
  const ans = q.opts[0];
  if (pick.toLowerCase() === ans.toLowerCase()) return "거의 다 왔어요! 파이썬은 <b>대문자와 소문자</b>를 구별해요.";
  if (/^["']/.test(ans) && !/^["']/.test(pick)) return "글자(문자열)는 앞뒤를 무언가로 감싸야 해요.";
  if (/^["']/.test(pick) && !/^["']/.test(ans)) return "따옴표를 붙이면 변수가 아니라 글자 그대로가 돼요.";
  if (pick === "==" && ans === "=") return "<code>==</code>는 '같은지 비교'예요. 저장할 때는 다른 기호를 써요.";
  if (pick === "=" && ans === "==") return "<code>=</code>는 '저장'이에요. 같은지 비교할 때는 다른 기호를 써요.";
  if (pick === "//") return "<code>//</code>는 다른 언어(C, 자바스크립트)의 주석이에요. 파이썬은 달라요.";
  if (pick === "x" || pick === "×") return "파이썬 키보드 곱하기 기호는 따로 있어요.";
  return "힌트를 읽고 남은 보기 중에서 다시 고르기.";
}

function choose(btn, oi){
  if (done || btn.disabled) return;
  const qi = order[pos], q = Q[qi], fb = $("feedback"), blank = blankEl();
  if (oi === 0){
    btn.classList.add("correct"); btn.querySelector(".mark").textContent = "✔";
    finish(btn);
  } else {
    wrongCount++;
    if (wrongCount === 1) result[qi] = false;
    btn.classList.add("wrong"); btn.disabled = true; btn.querySelector(".mark").textContent = "✖";
    restartAnim(btn, "shake");
    blank.textContent = q.opts[oi]; blank.classList.remove("empty"); blank.classList.add("no");
    restartAnim(blank, "shake");
    setTimeout(() => { if (!done){ blank.textContent = "?"; blank.classList.remove("no"); blank.classList.add("empty"); } }, 900);
    fb.className = "feedback bad";
    fb.innerHTML = `<div class="fb-title">😢 아쉬움, 다시 골라 보기!</div><div class="fb-sub">${mistakeNote(q, q.opts[oi])}</div>`;
    restartAnim(fb, "feedback");
    if (hintLevel < wrongCount && hintLevel < q.h.length) showHint();
    renderSteps();
  }
}

function finish(btn){
  const qi = order[pos], q = Q[qi], blank = blankEl(), fb = $("feedback");
  done = true;
  blank.textContent = q.opts[0];
  blank.classList.remove("empty", "no"); blank.classList.add("ok");
  document.querySelectorAll(".choice").forEach(b => {
    b.disabled = true;
    if (b !== btn && !b.classList.contains("wrong")) b.classList.add("dim");
  });
  let title, sub = "";
  if (wrongCount === 0){
    result[qi] = true; correct++;
    $("score").textContent = correct; restartAnim($("scoreBadge"), "bump");
    title = "🎉 정답!";
    const r = blank.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
  } else {
    result[qi] = false;
    title = "👍 정답! 힌트를 보고 해냄";
    sub = `<div class="fb-sub">한 번에 맞히지 못한 문제는 나중에 '틀린 문제만 다시 풀기'로 복습할 수 있음.</div>`;
  }
  fb.className = "feedback good";
  fb.innerHTML = `<div class="fb-title">${title}</div>${sub}<div class="explain"><b>✏️ 해설</b><br>${fmt(q.e)}</div>`;
  const next = $("nextBtn"); next.classList.remove("hidden");
  next.focus({ preventScroll: true });
  next.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  renderSteps();
}

function nextQ(){
  if (pos < order.length - 1){ pos++; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }
  else showResult();
}

let lastWrong = [];
function showResult(){
  const total = order.length;
  $("finalScore").textContent = correct;
  $("finalTotal").textContent = total;
  const rate = correct / total;
  let emoji, msg;
  if (rate === 1){ emoji = "🏆"; msg = "모두 한 번에 맞힘! 파이썬 기초가 탄탄함 🐍✨"; }
  else if (rate >= 0.7){ emoji = "🥳"; msg = "잘했음! 틀린 문제만 한 번 더 써 보면 완벽함."; }
  else if (rate >= 0.4){ emoji = "🌱"; msg = "좋은 출발! 해설을 떠올리며 틀린 문제를 다시 풀어 보기."; }
  else { emoji = "💪"; msg = "처음엔 누구나 낯섦. 직접 써 보는 게 가장 빨리 느는 방법!"; }
  $("resultEmoji").textContent = emoji;
  $("finalMsg").textContent = msg;
  $("resultTitle").textContent = total === Q.length ? "빈칸 채우기 끝! 수고 많았음" : "다시 풀기 끝! 수고 많았음";
  $("review").innerHTML = order.map(qi => {
    const ok = result[qi] === true;
    return `<li><span class="rn">${qi + 1}</span><span class="rt">${esc(Q[qi].topic)} · 정답 <span class="ra">${esc(Q[qi].opts[0])}</span></span>` +
           `<span class="rr ${ok ? "ok" : "no"}">${ok ? "⭕" : "❌"}</span></li>`;
  }).join("");
  lastWrong = order.filter(qi => result[qi] !== true);
  $("retryWrongBtn").classList.toggle("hidden", !lastWrong.length);
  showScreen("result");
  if (rate === 1) setTimeout(() => burst(window.innerWidth / 2, window.innerHeight / 3, 24), 400);
}

$("startBtn").addEventListener("click", () => startRound(Q.map((_, i) => i)));
$("retryAllBtn").addEventListener("click", () => startRound(Q.map((_, i) => i)));
$("retryWrongBtn").addEventListener("click", () => startRound(lastWrong.slice()));
$("hintBtn").addEventListener("click", showHint);
$("nextBtn").addEventListener("click", nextQ);
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  if (["1","2","3"].includes(e.key)){
    const b = document.querySelectorAll(".choice")[Number(e.key) - 1];
    if (b && !b.disabled) b.click();
  }
});

<script>
/* mirim-score-v1 */

(function(){

    python: { label: "파이썬",  quizzes: [["ox", "파이썬 OX", 15], ["blank", "파이썬 빈칸 채우기", 10], ["basics", "파이썬 첫걸음", 30], ["ifq", "파이썬 선택문", 5]] }
  };

  function jget(store, k, d){ try{ var v = store.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function student(){ var s = jget(sessionStorage, "mirim-student", null); return s && s.cls ? s : null; }
  function key(st){ return st.id + "|" + st.name; }

  function setSent(id, area, n){ var s = jget(localStorage, "mirim-sent", {}); s[id] = s[id] || {}; s[id][area] = n; jset(localStorage, "mirim-sent", s); }

  function summary(id, area){
    var A = AREAS[area], r = results(id)[area] || {}, c = 0, t = 0, done = 0, parts = [], rows = [];

  }

  /* ---------- 학번·이름 입력 (제목 아래 칸) ---------- */
  var editing = false;
  var GC = ["15", "16", "25", "26", "35", "36"];
  function nums(from, to, unit){ var o = ""; for (var i = from; i <= to; i++) o += '<option value="' + i + '">' + i + unit + "</option>"; return o; }
  function whoBox(){

    if (st && st.grade){ box.querySelector(".ms-gc").value = "" + st.grade + st.cls; box.querySelector(".ms-num").value = st.num; box.querySelector(".ms-name").value = st.name; }

  function focusWho(){ var b = document.querySelector(".ms-who"); if (b){ var f = b.querySelector(".ms-gc"); if (f){ f.focus(); b.scrollIntoView({ block: "center", behavior: "smooth" }); } } }

  function renderPanels(){

    }
    var st = student();
    wrap.innerHTML = cfg.areas.map(function(area){
      var A = AREAS[area];
      if (!st) return '<section class="ms-panel" data-area="' + area + '"><h3>📊 내 점수 · ' + A.label + '</h3><p class="ms-note">학년·반, 번호, 이름을 입력하면 점수가 모임.</p><p class="ms-msg"></p></section>';
      var s = summary(key(st), area), left = Math.max(0, LIMIT - sentCount(key(st), area));

    if (!window.confirm(q)) return;

    msg.textContent = "보내는 중…";
    function say(text){ MSG[area] = text; msg.textContent = text; }
    fetch(url, { method: "POST", body: JSON.stringify({ id: st.id, grade: st.grade, cls: st.cls, num: st.num, name: st.name, area: A.label, score: s.score, correct: s.c, total: s.t, detail: s.detail }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var t = new Date(), hm = t.getHours() + ":" + String(t.getMinutes()).padStart(2, "0");
        if (d && d.ok){ setSent(key(st), area, d.count); say("✅ 보냄 (" + hm + ") · 3번 중 " + d.count + "번째"); }
        else if (d && d.error === "limit"){ setSent(key(st), area, LIMIT); say("이미 3번 모두 보냈음."); }
        else { say("⚠️ 보내지 못함: " + ((d && d.error) || "알 수 없는 오류")); }
        renderPanels();
      })
      .catch(function(){ say("⚠️ 보내지 못함. 인터넷 연결을 확인하고 다시 눌러 보기."); btn.disabled = false; });
  }

  function render(){ renderWho(); renderPanels(); }

  window.MirimScore = {
    init: function(o){
      cfg = o;
      var root = document.documentElement.style;
      root.setProperty("--ms-accent", o.accent || "#5d4dbe");
      root.setProperty("--ms-deep", o.deep || "#4a3c9e");

      if (o.guard){
        document.addEventListener("click", function(e){

          renderWho();
          var err = document.querySelector(".ms-who .ms-err");

          focusWho();
        }, true);
      }
    },
    onResult: function(){ renderPanels(); },
    openGate: openGate
  };
})();

<body>
<div class="app">
  <header class="top">
    <div class="mascot" aria-hidden="true">🐍</div>
    <div>
      <h1>파이썬 <span class="accent">첫걸음</span> 퀴즈</h1>
      <p>파이썬이 뭔지부터 반복문까지, 30문제로 차근차근!</p>
    </div>
  </header>

  <!-- 시작 -->
  <section id="start" class="card">
    <div class="hero" aria-hidden="true">🐍</div>
    <h2>파이썬, 처음이어도 괜찮음!</h2>
    <p class="intro">문제마다 <b>💡 힌트</b>가 함께 보임.<br>틀려도 힌트를 보고 다시 고를 수 있음.</p>
    <ul class="stage-list" id="stageList"></ul>
    <div class="diff-legend"><span>난이도</span><span class="it"><span class="st">★</span>쉬움</span><span class="it"><span class="st">★★</span>보통</span><span class="it"><span class="st">★★★</span>어려움</span></div>
    <button class="btn" id="startBtn" type="button">시작하기 ▶</button>
  </section>

  <!-- 문제 -->
  <section id="quiz" class="card hidden">
    <div class="status">
      <div class="progress-text"><b id="qNum">1</b> / <span id="qTotal">30</span> 번째 문제</div>
      <div class="score-badge" id="scoreBadge"><span class="sb-star">★</span><span id="score">0</span>개 정답</div>
    </div>
    <div class="bar"><span id="bar"></span></div>
    <span class="tag" id="qStage"></span>
    <h2 class="question" id="qText"></h2>
    <pre class="code hidden" id="qCode"></pre>
    <div class="hint-row"><button class="hint-btn" id="hintBtn" type="button">💡 힌트 보기</button></div>
    <div class="hint-box hidden" id="hintBox"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback hidden" id="feedback" aria-live="polite"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn" type="button">다음 문제 ▶</button></div>
    <div class="diff-row" id="qDiff"></div>
  </section>

  <!-- 결과 -->
  <section id="result" class="card hidden">
    <div class="trophy" id="resultEmoji" aria-hidden="true">🏆</div>
    <h2 id="resultTitle">퀴즈 끝! 수고 많았음</h2>
    <div class="final-score"><span id="finalScore">0</span><small> / <span id="finalTotal">30</span>개</small></div>
    <p class="final-msg" id="finalMsg"></p>
    <ul class="stage-result" id="stageResult"></ul>
    <p class="wrong-list" id="wrongList"></p>
    <div class="result-actions">
      <button class="btn" id="retryWrongBtn" type="button">❗ 틀린 문제만 다시 풀기</button>
      <button class="btn sub" id="retryAllBtn" type="button">🔄 처음부터 다시 풀기</button>
    </div>
  </section>

  <footer>처음 시작하는 파이썬 · 30문제 · 3지 선다형<a class="credit" href="https://www.instagram.com/Make.a.long.term.memory" target="_blank" rel="noopener">by Make a long term memory</a></footer>
</div>

<script>
/* 단계 정보 */
const STAGES = [
  { name: "파이썬이란?",      color: ["#f8eaf0", "#94536d"] },
  { name: "화면에 출력하기",  color: ["#ede4cd", "#635223"] },
  { name: "데이터와 계산",    color: ["#e8f3ee", "#2f5946"] },
  { name: "변수와 입력",      color: ["#ecf3f9", "#415e75"] },
  { name: "조건에 따라 실행", color: ["#f2eef9", "#66599c"] },
  { name: "반복하기",         color: ["#f7eee8", "#7a513a"] }
];

/* 문제 30개
   s: 단계 번호(0부터), c: 보기 3개, a: 정답 위치(0부터)
   `백틱` 안의 글자는 코드 모양으로 보여요 */
const Q = [
  // 1단계
  { s:0, q:"파이썬(Python)은 무엇일까요?", c:["프로그래밍 언어","운영체제","웹 브라우저"], a:0,
    h:"사람이 컴퓨터에게 일을 시킬 때 쓰는 '언어'의 한 종류예요.", e:"파이썬은 컴퓨터에게 명령을 내릴 때 쓰는 프로그래밍 언어예요." },
  { s:0, q:"프로그래밍 언어는 무엇을 하는 데 쓰일까요?", c:["사람끼리 대화할 때","컴퓨터에게 할 일을 명령할 때","그림을 그릴 때"], a:1,
    h:"'프로그램'은 컴퓨터가 따라 하는 명령의 순서예요.", e:"프로그래밍 언어로 컴퓨터가 할 일을 순서대로 적어서 명령해요." },
  { s:0, q:"파이썬의 특징이 <u>아닌</u> 것은?", c:["문법이 간단해서 읽기 쉽다","무료로 쓸 수 있다","영어를 잘해야만 쓸 수 있다"], a:2,
    h:"파이썬은 처음 배우는 사람에게 많이 추천되는 언어예요.", e:"영어를 잘 몰라도 충분히 배울 수 있어요. 파이썬은 쉽고 무료라서 인기가 많아요." },
  { s:0, q:"파이썬으로 할 수 <u>없는</u> 일은?", c:["데이터 분석","인공지능 만들기","CPU 같은 컴퓨터 부품 만들기"], a:2,
    h:"파이썬은 '소프트웨어'를 만드는 도구예요.", e:"파이썬은 프로그램(소프트웨어)을 만들어요. 부품 같은 하드웨어는 만들 수 없어요." },
  { s:0, q:"파이썬 코드를 한 줄씩 읽어서 바로 실행해 주는 프로그램은?", c:["인터프리터","스캐너","프린터"], a:0,
    h:"'통역사(interpreter)'처럼 내 코드를 컴퓨터 말로 바로바로 옮겨 줘요.", e:"인터프리터가 코드를 한 줄씩 해석해서 바로 실행해 줘요." },
  // 2단계
  { s:1, q:"화면에 글자를 보여 주는 명령어는?", c:["`print`","`show`","`write`"], a:0,
    h:"'인쇄하다'라는 뜻의 영어 단어예요.", e:"`print()` 괄호 안에 넣은 내용이 화면에 출력돼요." },
  { s:1, q:"올바르게 쓴 코드는?", c:['`print("안녕")`',"`print(안녕)`",'`Print("안녕")`'], a:0,
    h:"글자는 따옴표 안에 넣어요. 그리고 파이썬은 대문자와 소문자를 구별해요.", e:"②는 따옴표가 없고, ③은 `P`가 대문자라서 오류가 나요." },
  { s:1, q:"다음 코드의 결과는?", code:"print(3 + 4)", c:["`7`","`3 + 4`","`34`"], a:0,
    h:"따옴표가 없으면 숫자로 보고 계산해요.", e:"숫자 3과 4를 더해서 `7`이 출력돼요." },
  { s:1, q:"다음 코드의 결과는?", code:'print("3 + 4")', c:["`7`","`3 + 4`","오류 발생"], a:1,
    h:"따옴표 안에 있으면 계산하지 않고 글자 그대로 보여 줘요.", e:"따옴표 안은 글자라서 `3 + 4`가 그대로 출력돼요." },
  { s:1, q:"코드에서 `#` 뒤에 쓴 내용은 어떻게 될까요?", c:["실행되지 않는 설명(주석)이 된다","곱하기를 한다","화면에 출력된다"], a:0,
    h:"사람이 읽으라고 남기는 '메모'예요.", e:"`#` 뒤는 주석이에요. 컴퓨터는 무시하고 실행하지 않아요." },
  // 3단계
  { s:2, q:'`"hello"`처럼 따옴표로 감싼 데이터를 무엇이라 할까요?', c:["문자열","정수","실수"], a:0,
    h:"글자들이 줄줄이 이어진 것이에요.", e:"따옴표로 감싼 글자 데이터를 문자열(string)이라고 해요." },
  { s:2, q:"`3.14`는 어떤 종류의 데이터일까요?", c:["정수","실수","문자열"], a:1,
    h:"소수점이 있는 수예요.", e:"소수점이 있는 수는 실수(float), 없는 수는 정수(int)예요." },
  { s:2, q:"다음 코드의 결과는?", code:"print(10 // 3)", c:["`3`","`3.333...`","`1`"], a:0,
    h:"`//`는 나눗셈의 '몫'만 구해요.", e:"10 ÷ 3의 몫은 3이에요." },
  { s:2, q:"다음 코드의 결과는?", code:"print(10 % 3)", c:["`3`","`1`","`0`"], a:1,
    h:"`%`는 나눗셈의 '나머지'를 구해요.", e:"10 ÷ 3 = 3 … 1이라서 나머지는 1이에요." },
  { s:2, q:"다음 코드의 결과는?", code:"print(2 ** 3)", c:["`6`","`8`","`9`"], a:1,
    h:"`**`는 거듭제곱이에요. 2를 3번 곱해요.", e:"2 × 2 × 2 = 8이에요." },
  { s:2, q:"다음 코드의 결과는?", code:'print("3" + "4")', c:["`7`","`34`","오류 발생"], a:1,
    h:"글자끼리 `+`를 하면 이어 붙여요.", e:"\"3\"과 \"4\"는 글자라서 이어 붙인 `34`가 출력돼요." },
  // 4단계
  { s:3, q:"`x = 5`의 뜻은?", c:["x와 5가 같은지 비교한다","x라는 상자에 5를 저장한다","5라는 상자에 x를 저장한다"], a:1,
    h:"파이썬의 `=`는 '같다'가 아니라 '오른쪽 값을 왼쪽에 넣어라'예요.", e:"`=`는 대입(저장)이에요. x라는 변수에 5가 저장돼요." },
  { s:3, q:"변수 이름으로 쓸 수 <u>없는</u> 것은?", c:["`score`","`my_age`","`1st`"], a:2,
    h:"변수 이름은 숫자로 시작할 수 없어요.", e:"`1st`처럼 숫자로 시작하는 이름은 쓸 수 없어요." },
  { s:3, q:"다음 코드의 결과는?", code:"x = 3\nx = x + 2\nprint(x)", c:["`3`","`5`","`2`"], a:1,

  { s:3, q:"다음 코드의 결과는?", code:"a = 10\nb = a\na = 20\nprint(b)", c:["`10`","`20`","`30`"], a:0,

  { s:3, q:"`input()`으로 입력받은 값은 어떤 종류일까요?", c:["항상 문자열","항상 정수","입력한 내용에 따라 자동으로 정해진다"], a:0,
    h:"숫자를 입력해도 컴퓨터는 일단 '글자'로 받아요.", e:"`input()`은 항상 문자열로 받아요. 숫자로 쓰려면 바꿔 줘야 해요." },
  { s:3, q:"입력받은 값을 정수로 바꾸는 올바른 코드는?", c:["`int(input())`","`str(input())`","`input(int)`"], a:0,

  { s:4, q:"'같지 않다'를 나타내는 기호는?", c:["`!=`","`<>`","`=!`"], a:0,
    h:"느낌표(!)는 '아니다'라는 뜻으로 쓰여요. 느낌표가 앞에 와요.", e:"`!=`는 두 값이 다르면 True예요." },
  { s:4, q:"다음 코드의 결과는?", code:"print(5 > 3 and 2 > 4)", c:["`True`","`False`","오류 발생"], a:1,

  { s:4, q:"`if` 줄 끝에 꼭 붙여야 하는 기호는?", c:["`;`","`:`","`.`"], a:1,

  { s:4, q:"다음 코드의 결과는?", code:'n = 7\nif n % 2 == 0:\n    print("짝수")\nelse:\n    print("홀수")', c:["`짝수`","`홀수`","오류 발생"], a:1,
    h:"7을 2로 나눈 나머지가 0인지 먼저 계산해 보세요.", e:"7 % 2는 1이라 조건이 거짓이에요. 그래서 else 쪽의 `홀수`가 출력돼요." },

/* 문제별 난이도 (1: ★ 쉬움, 2: ★★ 보통, 3: ★★★ 어려움) — 문제 순서와 같아요 */
const DIFF = [1, 1, 1, 1, 1, 1, 2, 1, 2, 1, 1, 1, 2, 2, 2, 2, 1, 1, 2, 3, 1, 2, 1, 1, 2, 1, 3, 2, 2, 3];
const DIFF_LABEL = ["", "쉬움", "보통", "어려움"];
function setDiff(d){
  const el = document.getElementById("qDiff");
  if (!el) return;

  el.innerHTML = `<span class="dl">난이도</span><span class="stars" aria-hidden="true">${"★".repeat(d)}<span class="off">${"☆".repeat(3 - d)}</span></span>`;

/* 도우미 */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 문제 글 속 <u> 밑줄만 허용하고 나머지는 안전하게 표시
const fmt = s => esc(s).replace(/&lt;u&gt;/g,"<u>").replace(/&lt;\/u&gt;/g,"</u>").replace(/`([^`]+)`/g,"<code>$1</code>");
function highlight(code){
  const re = /("[^"\n]*"|'[^'\n]*')|(#.*$)|\b(if|elif|else|for|in|and|or|not|True|False)\b|\b(print|input|int|range|str)\b|\b(\d+)\b/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="t-str">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-com">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="t-kw">${m[3]}</span>`;
    else if (m[4]) out += `<span class="t-fn">${m[4]}</span>`;
    else if (m[5]) out += `<span class="t-num">${m[5]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, n = 12){
  if (reduceMotion) return;
  const em = ["★","✦","★","✧","★"];
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.className = "particle"; s.textContent = em[i % em.length];
    const ang = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(ang) * d + "px");
    s.style.setProperty("--dy", Math.sin(ang) * d - 30 + "px");
    s.style.setProperty("--rot", (Math.random() * 240 - 120) + "deg");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}
function restartAnim(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* 시작 화면의 단계 목록 */
const ROMAN = ["가.","나.","다.","라.","마.","바.","사.","아.","자.","차."];
$("stageList").innerHTML = STAGES.map((st, i) => {
  const n = Q.filter(q => q.s === i).length;
  const first = Q.findIndex(q => q.s === i) + 1;
  return `<li><span class="sn">${ROMAN[i]}</span>` +
         `<div><b>${st.name}</b><small>${first}~${first + n - 1}번 · ${n}문제</small></div></li>`;
}).join("");

/* 상태 */
let order = [];      // 이번에 풀 문제 번호들
let pos = 0;         // order 안에서의 위치
let correct = 0;
let tries = 0;
let locked = false;
let firstTry = {};   // 문제번호 → 첫 시도에 맞혔는지

function showScreen(id){
  ["start","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function startRound(list){
  order = list; pos = 0; correct = 0; firstTry = {};
  $("score").textContent = 0;
  $("qTotal").textContent = order.length;
  showScreen("quiz");
  render();
}

function render(){
  const qi = order[pos], q = Q[qi], st = STAGES[q.s];
  tries = 0; locked = false;
  $("qNum").textContent = pos + 1;
  $("bar").style.width = (pos / order.length * 100) + "%";
  const tag = $("qStage");
  tag.textContent = `${q.s + 1}단계 · ${st.name}`;
  tag.style.background = st.color[0]; tag.style.color = st.color[1];
  setDiff(DIFF[qi]);
  $("qText").innerHTML = `<span class="qn">${qi + 1}.</span>${fmt(q.q)}`;
  if (q.code){ $("qCode").innerHTML = highlight(q.code); $("qCode").classList.remove("hidden"); }
  else $("qCode").classList.add("hidden");

  $("hintBtn").disabled = false;
  $("hintBox").classList.remove("hidden");
  $("hintBox").innerHTML = `<b>💡 힌트</b><br>${fmt(q.h)}`;

  const box = $("choices"); box.innerHTML = "";

    const b = document.createElement("button");
    b.type = "button"; b.className = "choice";
    b.innerHTML = `<span class="num">${"①②③"[ci]}</span><span class="label">${fmt(t)}</span><span class="mark" aria-hidden="true"></span>`;
    b.addEventListener("click", () => choose(b, ci));

  });

  next.classList.add("hidden");
  next.textContent = pos === order.length - 1 ? "결과 보기 🏁" : "다음 문제 ▶";
  restartAnim($("quiz"), "enter");
}

function showHint(){
  $("hintBox").classList.remove("hidden");
  $("hintBtn").disabled = true;
}

function choose(btn, ci){
  if (locked || btn.disabled) return;
  const qi = order[pos], q = Q[qi], fb = $("feedback");
  tries++;
  if (ci === q.a){
    locked = true;
    btn.classList.add("correct"); btn.querySelector(".mark").textContent = "✔";
    document.querySelectorAll(".choice").forEach(b => {
      b.disabled = true;
      if (b !== btn && !b.classList.contains("wrong")) b.classList.add("dim");
    });
    let title, sub = "";
    if (tries === 1){
      firstTry[qi] = true; correct++;
      $("score").textContent = correct; restartAnim($("scoreBadge"), "bump");
      title = "🎉 정답!";
    } else {
      title = "👍 정답! 힌트를 보고 찾아냄";
      sub = `<div class="fb-sub">한 번에 맞히지 못한 문제는 '틀린 문제'로 기록됨. 나중에 다시 풀어 보기!</div>`;
    }
    fb.className = "feedback good";
    fb.innerHTML = `<div class="fb-title">${title}</div>${sub}<div class="explain"><b>✏️ 해설</b><br>${fmt(q.e)}</div>`;
    const r = btn.getBoundingClientRect(); burst(r.left + 30, r.top + r.height / 2);
    $("bar").style.width = ((pos + 1) / order.length * 100) + "%";
    const next = $("nextBtn"); next.classList.remove("hidden");
    next.focus({ preventScroll: true });
    next.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  } else {
    if (tries === 1) firstTry[qi] = false;
    btn.classList.add("wrong"); btn.disabled = true; btn.querySelector(".mark").textContent = "✖";
    restartAnim(btn, "shake");
    showHint();
    fb.className = "feedback bad";
    fb.innerHTML = `<div class="fb-title">😢 아쉬움, 오답!</div>위의 <b>💡 힌트</b>를 다시 읽고 다른 보기를 골라 보기.`;
    restartAnim(fb, "feedback");
    $("hintBox").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  }
}

function next(){
  if (pos < order.length - 1){ pos++; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }
  else showResult();
}

let lastWrong = [];
function showResult(){
  const total = order.length;
  $("finalScore").textContent = correct;
  $("finalTotal").textContent = total;
  const rate = correct / total;
  let emoji, msg;
  if (rate === 1){ emoji = "🏆"; msg = "모두 한 번에 맞힘! 파이썬 첫걸음 완벽 통과! 🐍✨"; }
  else if (rate >= 0.8){ emoji = "🥳"; msg = "아주 잘했음! 틀린 문제만 한 번 더 보면 완벽함."; }
  else if (rate >= 0.5){ emoji = "🌱"; msg = "좋음! 힌트와 해설을 떠올리며 틀린 문제를 다시 풀어 보기."; }
  else { emoji = "💪"; msg = "처음엔 누구나 어려움. 틀린 문제를 다시 풀면 금방 익숙해짐!"; }
  $("resultEmoji").textContent = emoji;
  $("finalMsg").textContent = msg;
  $("resultTitle").textContent = total === Q.length ? "퀴즈 끝! 수고 많았음" : "다시 풀기 끝! 수고 많았음";

  // 단계별 결과
  $("stageResult").innerHTML = STAGES.map((st, i) => {
    const ids = order.filter(qi => Q[qi].s === i);
    if (!ids.length) return "";
    const ok = ids.filter(qi => firstTry[qi]).length;
    return `<li><span class="nm">${i + 1}단계 · ${st.name}</span>` +
           `<span class="meter"><span style="width:${ok / ids.length * 100}%"></span></span>` +
           `<span class="ct">${ok}/${ids.length}</span></li>`;
  }).join("");

  lastWrong = order.filter(qi => !firstTry[qi]);
  $("wrongList").textContent = lastWrong.length
    ? `다시 볼 문제: ${lastWrong.map(qi => qi + 1 + "번").join(", ")}`
    : "틀린 문제 없음! 🎉";
  $("retryWrongBtn").classList.toggle("hidden", !lastWrong.length);

  showScreen("result");
  if (rate === 1) setTimeout(() => burst(window.innerWidth / 2, window.innerHeight / 3, 24), 400);
}

/* 이벤트 */
$("startBtn").addEventListener("click", () => startRound(Q.map((_, i) => i)));
$("retryAllBtn").addEventListener("click", () => startRound(Q.map((_, i) => i)));
$("retryWrongBtn").addEventListener("click", () => startRound(lastWrong.slice()));
$("hintBtn").addEventListener("click", showHint);
$("nextBtn").addEventListener("click", next);
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  if (["1","2","3"].includes(e.key)){
    const b = document.querySelectorAll(".choice")[Number(e.key) - 1];
    if (b && !b.disabled) b.click();
  } else if (e.key === "h" || e.key === "H"){ if (!$("hintBtn").disabled) showHint(); }
});

<script>

(function(){

    python: { label: "파이썬",  quizzes: [["ox", "파이썬 OX", 15], ["blank", "파이썬 빈칸 채우기", 10], ["basics", "파이썬 첫걸음", 30], ["ifq", "파이썬 선택문", 5]] }
  };
  var cfg = {}, MSG = {};

  function jget(store, k, d){ try{ var v = store.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function setSent(id, area, n){ var s = jget(localStorage, "mirim-sent", {}); s[id] = s[id] || {}; s[id][area] = n; jset(localStorage, "mirim-sent", s); }

<!-- 파일 자동 저장을 지원하지 않는 브라우저용 -->
<input type="file" id="fileInput" accept=".txt,text/plain" class="hidden">

<script>
/* =========================================================
   문제 데이터 (모두 "실행 결과 고르기" 형식)
   - answer : choices 배열에서 정답의 위치(0부터 시작)
   - 힌트/해설 속 `백틱`은 코드 모양으로 표시됩니다
   ========================================================= */
const QUESTIONS = [
  {
    type: "조건식",
    code: "a = 10\nb = 3\nprint(a % b == 1 and a < b)",
    choices: ["True", "False", "1", "오류 발생"],
    answer: 1,
    hint: "`%`는 나눈 나머지를 구해요. 그리고 `and`는 양쪽 조건이 모두 True일 때만 True가 돼요!",
    explain: "`10 % 3`은 1이라서 `a % b == 1`은 True예요. 하지만 `a < b`(10 < 3)는 False! `and`는 둘 다 참이어야 하므로 결과는 False예요."
  },
  {
    type: "조건식",
    code: "age = 19\nprint(age >= 13 and age <= 19)",
    choices: ["True", "False", "19", "오류 발생"],
    answer: 0,
    hint: "`<=`는 '작거나 같다'라는 뜻이에요. 19는 19보다 작거나 같을까요?",
    explain: "`19 >= 13`은 True, `19 <= 19`도 True예요(`<=`는 같은 값도 포함해요). 두 조건이 모두 참이니 `and`의 결과는 True!"
  },
  {
    type: "단순 선택문",
    code: 'score = 75\nif score >= 80:\n    print("합격")\nprint("끝")',
    choices: ["합격", "끝", "합격\n끝", "오류 발생"],
    answer: 1,
    hint: "먼저 `score >= 80`이 참인지 확인해 보세요. 그리고 `print(\"끝\")`은 if문 안에 있을까요, 밖에 있을까요? 들여쓰기를 살펴보세요!",
    explain: "`75 >= 80`은 False라서 들여쓰기된 `print(\"합격\")`은 건너뛰어요. 들여쓰기가 없는 `print(\"끝\")`은 if문 밖에 있어서 항상 실행돼요."
  },
  {
    type: "다중 선택문",
    code: 'score = 85\nif score >= 90:\n    print("A")\nelse if score >= 80:\n    print("B")\nelse:\n    print("C")',
    choices: ["A", "B", "C", "오류 발생"],
    answer: 3,
    hint: "파이썬에서는 '그렇지 않고 만약 ~라면'을 `elif`(else if를 줄인 말)라고 붙여 써요. 코드에 쓰인 `else if`와 비교해 보세요.",
    explain: "파이썬은 `else if`가 아니라 `elif`를 써요. `else` 뒤에는 바로 `:`가 와야 해서 문법 오류(SyntaxError)가 나요. 파이썬은 파일을 실행하기 전에 문법부터 검사하기 때문에 첫 줄을 포함해 한 줄도 실행되지 않아요."
  },
  {
    type: "다중 선택문",
    code: 'temp = 30\nif temp >= 20:\n    print("따뜻해요")\nelif temp >= 28:\n    print("더워요")\nelse:\n    print("추워요")',
    choices: ["따뜻해요", "더워요", "따뜻해요\n더워요", "추워요"],
    answer: 0,
    hint: "if-elif-else 구조에서는 참인 조건을 '처음' 만나면 그 블록만 실행하고, 나머지는 모두 건너뛰어요.",
    explain: "`30 >= 20`이 먼저 True가 되어 \"따뜻해요\"만 출력돼요. `30 >= 28`도 참이지만, 이미 앞에서 참인 조건을 만났기 때문에 검사하지 않아요."
  }
];

/* 문제별 난이도 (1: ★ 쉬움, 2: ★★ 보통, 3: ★★★ 어려움) — 문제 순서와 같아요 */
const DIFF = [3, 2, 2, 3, 3];
const DIFF_LABEL = ["", "쉬움", "보통", "어려움"];
function setDiff(d){
  const el = document.getElementById("qDiff");
  if (!el) return;
  if (!d){ el.innerHTML = ""; return; }
  el.innerHTML = `<span class="dl">난이도</span><span class="stars" aria-hidden="true">${"★".repeat(d)}<span class="off">${"☆".repeat(3 - d)}</span></span>`;
  el.setAttribute("aria-label", `난이도 별 ${d}개 (${DIFF_LABEL[d]})`);
}

const POINT = 10;
const DEFAULT_QUESTION = "다음 코드의 실행 결과는?";
const DEFAULT_FILE_NAME = "if퀴즈_순위.txt";

/* ---------- 도우미 함수 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");

function highlight(code){
  const re = /("[^"\n]*"|'[^'\n]*')|(#.*$)|\b(if|elif|else|and|or|not|True|False)\b|\b(print|input|int)\b|\b(\d+)\b/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="t-str">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-com">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="t-kw">${m[3]}</span>`;
    else if (m[4]) out += `<span class="t-fn">${m[4]}</span>`;
    else if (m[5]) out += `<span class="t-num">${m[5]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? `${m}분 ${s}초` : `${s}초`;
}

function nowText(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function burst(x, y, n = 12){
  if (reduceMotion) return;
  const emojis = ["★", "✦", "★", "✧", "★"];
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.className = "particle";
    s.textContent = emojis[i % emojis.length];
    const ang = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 90;
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist - 30 + "px");
    s.style.setProperty("--rot", (Math.random() * 240 - 120) + "deg");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function restartAnim(el, cls){
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

/* =========================================================
   순위 텍스트 파일
   형식(탭으로 구분, 한 줄에 한 명):
   순위  이름  점수  걸린시간(초)  푼 날짜
   ========================================================= */
let IN_FRAME = false;
try{ IN_FRAME = window.self !== window.top && !window.top.location.href; }catch(e){ IN_FRAME = true; }  // 다른 사이트(미리보기) 안에 있을 때만 true
// 미리보기 창(다른 페이지 안)에서는 파일 선택 창을 열 수 없어서 자동 저장을 끕니다
const FS_OK = !IN_FRAME && "showOpenFilePicker" in window && "showSaveFilePicker" in window;
let fileHandle = null;        // 연결된 순위 파일 (크롬·엣지)
let rememberedHandle = null;  // 지난번에 연결했던 파일
let fallbackText = null;      // 파일 자동 저장이 안 되는 브라우저: 불러온 내용
let fallbackName = DEFAULT_FILE_NAME;
let fileCount = null;         // 파일에 있는 기록 수

function parseRanking(text){
  const list = [];
  String(text || "").replace(/^﻿/, "").split(/\r?\n/).forEach(line => {
    if (!line.trim() || line.trim().startsWith("#")) return;
    const cols = line.split("\t");
    if (cols.length < 4) return;
    const name = cols[1].trim();
    const score = parseInt(cols[2], 10);
    const time = parseInt(cols[3], 10);
    if (!name || isNaN(score) || isNaN(time)) return;
    list.push({ name, score, time, date: (cols[4] || "").trim() });
  });
  return sortRanking(list);
}

function sortRanking(list){
  return list.sort((a, b) => b.score - a.score || a.time - b.time || a.date.localeCompare(b.date));
}

function serializeRanking(list){
  const lines = [
    "# 파이썬 선택문 퀴즈 순위 (퀴즈가 자동으로 업데이트하는 파일입니다)",
    "# 순위\t이름\t점수\t걸린시간(초)\t푼 날짜"
  ];
  sortRanking(list).forEach((r, i) => lines.push([i + 1, r.name, r.score, r.time, r.date].join("\t")));
  return "﻿" + lines.join("\r\n") + "\r\n";
}

// 이번 기록을 목록과 비교해서 반영 (같은 이름은 최고 기록만 남김)
function mergeRecord(list, rec){
  const old = list.find(r => r.name === rec.name);
  let isBest = true, prev = null;
  if (!old){
    list.push({ ...rec });
  } else if (rec.score > old.score || (rec.score === old.score && rec.time < old.time)){
    prev = { ...old };
    Object.assign(old, rec);
  } else {
    isBest = false;
    prev = { ...old };
  }
  sortRanking(list);
  return { list, isBest, prev };
}

/* 파일 핸들 기억하기 (IndexedDB) */
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("if-quiz-ranking", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("h");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(v){
  try{
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction("h", "readwrite");
      tx.objectStore("h").put(v, "file");
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }catch(e){}
}
async function idbGet(){
  try{
    const db = await idbOpen();
    return await new Promise(res => {
      const q = db.transaction("h", "readonly").objectStore("h").get("file");
      q.onsuccess = () => res(q.result || null);
      q.onerror = () => res(null);
    });
  }catch(e){ return null; }
}

async function ensurePermission(h){
  const opt = { mode: "readwrite" };
  if (h.queryPermission && await h.queryPermission(opt) === "granted") return true;
  if (h.requestPermission) return (await h.requestPermission(opt)) === "granted";
  return true;
}

async function readFileText(){
  const f = await fileHandle.getFile();
  return await f.text();
}
async function writeFileText(text){
  const w = await fileHandle.createWritable();
  await w.write(text);
  await w.close();
}

const PICK_TYPES = [{ description: "순위 텍스트 파일", accept: { "text/plain": [".txt"] } }];

async function useHandle(h){
  if (!await ensurePermission(h)) throw new Error("파일을 저장할 권한을 받지 못함.");
  fileHandle = h;
  rememberedHandle = h;
  idbSet(h);
  const text = await readFileText();
  const list = parseRanking(text);
  if (!text.trim()) await writeFileText(serializeRanking(list));  // 새 파일이면 머리글 기록
  fileCount = list.length;
}

async function fileAction(act){
  try{
    if (act === "open"){
      const [h] = await window.showOpenFilePicker({ types: PICK_TYPES, multiple: false });
      await useHandle(h);
    } else if (act === "create"){
      const h = await window.showSaveFilePicker({ suggestedName: DEFAULT_FILE_NAME, types: PICK_TYPES });
      await useHandle(h);
    } else if (act === "reconnect" && rememberedHandle){
      await useHandle(rememberedHandle);
    } else if (act === "load"){
      $("fileInput").click();
      return;
    } else if (act === "download"){
      downloadRanking();
      return;
    } else if (act === "save"){
      // 저장 다시 시도
    }
  }catch(e){
    if (e && e.name === "AbortError") return;   // 사용자가 창을 닫음
    const m = "⚠️ 순위 파일을 여는 중 문제가 생김. (" + esc(e && e.message ? e.message : e) + ")";
    if (!$("result").classList.contains("hidden")){ $("saveBox").className = "save-box warn"; $("saveBox").innerHTML = m + `<div class="fp-actions">${fileButtons(["open", "create"])}</div>`; }
    else { $("fpMsg").innerHTML = m; }
    return;
  }
  renderFilePanel();
  if (!$("result").classList.contains("hidden")) await syncRanking();
}

// 파일 자동 저장을 지원하지 않는 브라우저: 파일 불러오기
$("fileInput").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  fallbackText = await f.text();
  fallbackName = f.name || DEFAULT_FILE_NAME;
  fileCount = parseRanking(fallbackText).length;
  e.target.value = "";
  renderFilePanel();
  if (!$("result").classList.contains("hidden")) await syncRanking();
});

function downloadRanking(){
  const text = fallbackText !== null ? fallbackText : serializeRanking([]);
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fallbackName;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function fileButtons(acts){
  const label = {
    open: "📂 기존 파일 열기",
    create: "📝 새 파일 만들기",
    reconnect: rememberedHandle ? `🔗 '${esc(rememberedHandle.name)}' 다시 연결` : "",
    load: "📂 순위 파일 불러오기",
    download: "💾 순위 파일 저장(다운로드)",
    save: "💾 다시 저장하기"
  };
  return acts.filter(a => label[a]).map(a =>
    `<button type="button" class="btn small ${a === "open" || a === "load" || a === "reconnect" ? "" : "plain"}" data-file-act="${a}">${label[a]}</button>`
  ).join("");
}

function renderFilePanel(){
  const msg = $("fpMsg"), acts = $("fpActions");
  if (FS_OK){
    if (fileHandle){
      msg.innerHTML = `✅ <b>${esc(fileHandle.name)}</b> 파일에 순위를 저장하는 중` +
        (fileCount !== null ? ` (지금 ${fileCount}명 기록)` : "") + ".";
      acts.innerHTML = fileButtons(["open", "create"]);
    } else {
