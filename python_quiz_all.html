      acts.innerHTML = fileButtons(rememberedHandle ? ["reconnect", "open", "create"] : ["open", "create"]);
    }
  } else if (IN_FRAME){
    msg.innerHTML = "지금은 <b>미리보기 화면</b>이라 순위 파일을 저장할 수 없음. 퀴즈와 순위 화면은 확인할 수 있음. 실제 수업에서는 파일을 내려받아 <b>크롬이나 엣지</b>로 열어 주기.";
    acts.innerHTML = "";
    return;
  } else {
    if (fallbackText !== null){
      msg.innerHTML = `✅ <b>${esc(fallbackName)}</b> 파일을 불러옴` + (fileCount !== null ? ` (지금 ${fileCount}명 기록)` : "") +
        ". 이 브라우저는 자동 저장이 안 돼서, 끝나면 결과 화면에서 <b>다운로드</b>로 저장해 주기.";
    } else {
      msg.innerHTML = "이 브라우저는 파일 자동 저장을 지원하지 않음(크롬·엣지 권장). 기존 순위 파일이 있으면 <b>불러오기</b>를 눌러 주기.";
    }
    acts.innerHTML = fileButtons(["load"]);
  }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-file-act]");
  if (b) fileAction(b.dataset.fileAct);
});

/* ---------- 상태 ---------- */
let playerName = "";
let startTime = 0;
let current = 0;
let score = 0;
let tries = 0;
let locked = false;
let results = [];          // true: 첫 시도 정답, false: 첫 시도 오답, null: 아직 안 품
let pendingRecord = null;  // 아직 파일에 저장하지 못한 이번 기록
let lastRecord = null;     // 이번 기록 (순위에서 '나' 표시용)
let lastMerge = null;

/* ---------- 화면 전환 ---------- */
function showScreen(id){
  ["start", "quiz", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function startFromName(){
  const name = $("nameInput").value.replace(/[\t\r\n]/g, " ").replace(/\s+/g, " ").trim().slice(0, 12);
  if (!name){
    $("nameError").classList.remove("hidden");
    restartAnim($("nameInput"), "invalid");
    $("nameInput").focus();
    return;
  }
  $("nameError").classList.add("hidden");
  $("nameInput").classList.remove("invalid");
  playerName = name;
  startQuiz();
}
$("startBtn").addEventListener("click", startFromName);
$("nameInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); startFromName(); }
});

function startQuiz(){
  current = 0;
  score = 0;
  results = QUESTIONS.map(() => null);
  $("score").textContent = 0;
  $("qTotal").textContent = QUESTIONS.length;
  $("playerName").textContent = playerName;
  startTime = Date.now();
  showScreen("quiz");
  renderQuestion();
}

function renderSteps(){
  $("steps").innerHTML = QUESTIONS.map((_, i) => {
    let c = "dot";
    if (results[i] === true) c += " good";
    else if (results[i] === false) c += " bad";
    else if (i === current) c += " current";
    return `<span class="${c}"></span>`;
  }).join("");
}

function renderQuestion(){
  const q = QUESTIONS[current];
  tries = 0;
  locked = false;

  $("qNum").textContent = current + 1;
  $("qType").textContent = q.type;
  $("qType").dataset.type = q.type;
  setDiff(DIFF[current]);
  $("qText").innerHTML = fmt(q.question || DEFAULT_QUESTION);
  $("qCode").innerHTML = highlight(q.code);
  $("hintAlways").innerHTML = `<b>💡 힌트</b><br>${fmt(q.hint)}`;

  const box = $("choices");
  box.innerHTML = "";
  shuffle(q.choices.map((_, i) => i)).forEach((ci, pos) => {
    const t = q.choices[ci];
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.innerHTML =
      `<span class="num">${pos + 1}</span>` +
      `<span class="label${t === "오류 발생" ? "" : " out"}">${esc(t)}</span>` +
      `<span class="mark" aria-hidden="true"></span>`;
    b.addEventListener("click", () => choose(b, ci));
    box.appendChild(b);
  });

  const fb = $("feedback");
  fb.className = "feedback hidden";
  fb.innerHTML = "";

  const next = $("nextBtn");
  next.classList.add("hidden");
  next.textContent = current === QUESTIONS.length - 1 ? "결과 보기 🏁" : "다음 문제 ▶";

  renderSteps();
  restartAnim($("quiz"), "enter");
}

function choose(btn, ci){
  if (locked || btn.disabled) return;
  const q = QUESTIONS[current];
  const fb = $("feedback");
  tries++;

  if (ci === q.answer){
    locked = true;
    btn.classList.add("correct");
    btn.querySelector(".mark").textContent = "✔";
    document.querySelectorAll(".choice").forEach(b => {
      b.disabled = true;
      if (b !== btn && !b.classList.contains("wrong")) b.classList.add("dim");
    });

    let title, sub = "";
    if (tries === 1){
      score += POINT;
      results[current] = true;
      $("score").textContent = score;
      restartAnim($("scoreBadge"), "bump");
      title = `🎉 정답! +${POINT}점`;
    } else {
      title = "👍 정답! 힌트를 보고 찾아냄";
      sub = `<div class="fb-sub">첫 번째 시도가 아니라서 이번 문제는 0점.</div>`;
    }
    fb.className = "feedback good";
    fb.innerHTML =
      `<div class="fb-title">${title}</div>${sub}` +
      `<div class="explain"><b>✏️ 해설</b><br>${fmt(q.explain)}</div>`;

    const r = btn.getBoundingClientRect();
    burst(r.left + 30, r.top + r.height / 2);

    const next = $("nextBtn");
    next.classList.remove("hidden");
    next.focus({ preventScroll: true });
    next.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    btn.querySelector(".mark").textContent = "✖";
    restartAnim(btn, "shake");
    if (tries === 1) results[current] = false;

    fb.className = "feedback bad";
    fb.innerHTML =
      `<div class="fb-title">😢 아쉬움, 오답!</div>` +
      `<div class="retry-note">위의 💡 힌트를 다시 읽고 다른 보기를 골라 보기!</div>`;
    restartAnim(fb, "feedback");
    fb.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  }
  renderSteps();
}

function nextQuestion(){
  if (current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  } else {
    showResult();
  }
}

/* ---------- 결과 & 순위 ---------- */
function showResult(){
  const max = QUESTIONS.length * POINT;
  const sec = Math.max(1, Math.round((Date.now() - startTime) / 1000));
  $("maxScore").textContent = max;
  $("resultName").textContent = playerName;
  $("finalTime").textContent = `걸린 시간 ${fmtTime(sec)}`;

  let emoji, msg;
  if (score === max){ emoji = "🏆"; msg = "완벽함! 이제 선택문 마스터! 🐍✨"; }
  else if (score >= max * 0.6){ emoji = "🥳"; msg = "잘했음! 조금만 더 하면 만점."; }
  else if (score > 0){ emoji = "🌱"; msg = "좋은 시작! 힌트를 떠올리며 한 번 더 풀어 보기."; }
  else { emoji = "💪"; msg = "괜찮음! 다시 풀다 보면 실력이 쑥쑥 늘 것!"; }
  $("resultEmoji").textContent = emoji;
  $("finalMsg").textContent = msg;

  $("review").innerHTML = QUESTIONS.map((q, i) => {
    const ok = results[i] === true;
    return `<span class="chip ${ok ? "ok" : "no"}">${i + 1}번 ${ok ? "⭕" : "❌"}</span>`;
  }).join("");

  lastRecord = { name: playerName, score, time: sec, date: nowText() };
  pendingRecord = { ...lastRecord };
  lastMerge = null;

  showScreen("result");

  const el = $("finalScore");
  if (reduceMotion || score === 0){
    el.textContent = score;
  } else {
    let v = 0;
    el.textContent = 0;
    const step = () => {
      v = Math.min(score, v + 1);
      el.textContent = v;
      if (v < score) setTimeout(step, 28);
    };
    step();
  }

  if (score === max){
    setTimeout(() => {
      burst(window.innerWidth / 2, window.innerHeight / 3, 24);
      setTimeout(() => burst(window.innerWidth / 2, window.innerHeight / 3, 24), 350);
    }, 400);
  }

  syncRanking();
}

// 텍스트 파일에서 목록을 불러와 이번 기록과 비교 → 저장 → 순위 출력
async function syncRanking(){
  const box = $("saveBox");
  $("rankList").innerHTML = `<li class="empty">순위 파일을 불러오는 중…</li>`;

  if (FS_OK && fileHandle){
    try{
      if (!await ensurePermission(fileHandle)) throw new Error("파일 저장 권한이 없음.");
      let list = parseRanking(await readFileText());
      if (pendingRecord){
        lastMerge = mergeRecord(list, pendingRecord);
        list = lastMerge.list;
        await writeFileText(serializeRanking(list));
        pendingRecord = null;
      }
      fileCount = list.length;
      renderRanking(list);
      box.className = "save-box ok";
      box.innerHTML = `💾 <b>${esc(fileHandle.name)}</b> 파일에서 순위를 불러와 비교하고, 이번 기록까지 저장함.`;
      renderFilePanel();
    }catch(e){
      renderRanking(null);
      box.className = "save-box warn";
      box.innerHTML = `⚠️ 순위 파일을 읽거나 저장하지 못함. (${esc(e && e.message ? e.message : e)})` +
        `<div class="fp-actions">${fileButtons(["save", "open", "create"])}</div>`;
    }
    return;
  }

  if (FS_OK){
    renderRanking(null);
    box.className = "save-box warn";
    box.innerHTML = "⚠️ 순위 파일이 연결되지 않아 순위를 불러올 수 없음. 파일을 연결하면 이번 기록도 바로 저장됨." +
      `<div class="fp-actions">${fileButtons(rememberedHandle ? ["reconnect", "open", "create"] : ["open", "create"])}</div>`;
    return;
  }

  // 자동 저장을 지원하지 않는 브라우저
  let list = parseRanking(fallbackText || "");
  if (pendingRecord){
    lastMerge = mergeRecord(list, pendingRecord);
    list = lastMerge.list;
    fallbackText = serializeRanking(list);
    pendingRecord = null;
  }
  fileCount = list.length;
  renderRanking(list);
  box.className = "save-box warn";
  if (IN_FRAME){ box.innerHTML = "ℹ️ 미리보기 화면이라 순위는 이 창에만 임시로 보임. 파일을 내려받아 크롬·엣지로 열면 텍스트 파일에 저장됨."; renderFilePanel(); return; }
  box.innerHTML = "⚠️ 이 브라우저는 파일 자동 저장이 안 됨. 아래 버튼으로 순위 파일을 저장해 두고, 다음에 <b>불러오기</b>로 이어서 쓰면 됨." +
    `<div class="fp-actions">${fileButtons(["download"])}</div>`;
  renderFilePanel();
}

function renderRanking(list){
  const ul = $("rankList");
  const note = $("bestNote");
  note.classList.add("hidden");

  if (!list){
    ul.innerHTML = `<li class="empty">순위 파일을 연결하면 순위가 나타남</li>`;
    $("rankSub").textContent = "";
    return;
  }
  if (!list.length){
    ul.innerHTML = `<li class="empty">아직 기록 없음</li>`;
    $("rankSub").textContent = "";
    return;
  }

  const me = lastRecord ? lastRecord.name : null;
  const medals = ["🥇", "🥈", "🥉"];
  ul.innerHTML = list.map((r, i) => {
    const isMe = r.name === me;
    return `<li class="${isMe ? "me" : ""}">` +
      `<span class="rk ${i < 3 ? "medal" : ""}">${i < 3 ? medals[i] : i + 1}</span>` +
      `<span class="rn">${esc(r.name)}${isMe ? '<span class="me-badge">나</span>' : ""}</span>` +
      `<span class="rs">${r.score}점</span>` +
      `<span class="rt">${fmtTime(r.time)}</span></li>`;
  }).join("");

  const myIdx = list.findIndex(r => r.name === me);
  $("rankSub").textContent = myIdx >= 0 ? `전체 ${list.length}명 중 ${myIdx + 1}등!` : `전체 ${list.length}명`;

  if (lastMerge && !lastMerge.isBest && lastMerge.prev){
    note.innerHTML = `이번 기록: <b>${lastRecord.score}점 · ${fmtTime(lastRecord.time)}</b> → ` +
      `순위에는 최고 기록(${lastMerge.prev.score}점 · ${fmtTime(lastMerge.prev.time)})이 남아 있음.`;
    note.classList.remove("hidden");
  } else if (lastMerge && lastMerge.isBest && lastMerge.prev){
    note.innerHTML = `🎊 최고 기록 갱신! (이전 ${lastMerge.prev.score}점 · ${fmtTime(lastMerge.prev.time)})`;
    note.classList.remove("hidden");
  }

  const meEl = ul.querySelector("li.me");
  if (meEl) ul.scrollTop = meEl.offsetTop - ul.clientHeight / 2 + meEl.offsetHeight / 2;
}

/* ---------- 이벤트 ---------- */
$("nextBtn").addEventListener("click", nextQuestion);
$("retryBtn").addEventListener("click", startQuiz);
$("nextPlayerBtn").addEventListener("click", () => {
  $("nameInput").value = "";
  showScreen("start");

// 키보드 1~4로 보기 선택
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  if (["1", "2", "3", "4"].includes(e.key)){
    const b = document.querySelectorAll(".choice")[Number(e.key) - 1];
    if (b && !b.disabled) b.click();
  }
});

// 처음 열 때: 지난번 파일 기억해 두기
(async () => {
  try{ renderFilePanel(); }catch(e){}
  if (FS_OK){
    const h = await idbGet();
    if (h && h.getFile){
      rememberedHandle = h;
      try{
        if (h.queryPermission && await h.queryPermission({ mode: "readwrite" }) === "granted"){
          fileHandle = h;
          fileCount = parseRanking(await readFileText()).length;
        }
      }catch(e){ fileHandle = null; }
      renderFilePanel();
    }
  }
  if (window.matchMedia("(pointer: fine)").matches) $("nameInput").focus({ preventScroll: true });
})();

<script>
const frames = {};

    f.title = title;
    f.srcdoc = document.getElementById("src-" + key).textContent.replace(/<\\\/script/g, "<" + "/script");

}

}

        '<ul class="ms-rows">' + s.rows.map(function(r){ return '<li class="' + (r[2] ? "" : "no") + '"><span>' + r[0] + "</span><b>" + r[1] + "</b></li>"; }).join("") + "</ul>" +
        '<div class="ms-total">합계 <b>' + s.c + "</b> / " + s.t + "문제 · 100점 환산 <b>" + s.score + "점</b></div>" +
        '<div class="ms-act"><button class="ms-btn ms-send" type="button" data-area="' + area + '"' + (left && s.done ? "" : " disabled") + ">📤 선생님께 점수 보내기</button>" +
        '<span class="ms-left">' + (left ? "남은 횟수 " + left + "번" : "3번 모두 보냈음") + "</span></div>" +
        '<p class="ms-msg">' + esc(MSG[area] || (s.done ? "" : "퀴즈를 끝까지 풀면 보낼 수 있음.")) + "</p></section>";
    }).join("");
  }

  function send(area, panel){
    var st = student();
    if (!st){ openGate(); return; }
    var s = summary(key(st), area), A = AREAS[area], msg = panel.querySelector(".ms-msg"), btn = panel.querySelector(".ms-send");
    var left = LIMIT - sentCount(key(st), area);
    var url = window.SCORE_URL;
    if (!url){ msg.textContent = "⚠️ 점수 받을 주소가 아직 설정되지 않음. 선생님께 알려 주기."; return; }
    if (left <= 0 || !s.done) return;
    var miss = s.rows.filter(function(r){ return !r[2]; }).length;
    var q = label(st) + " " + st.name + "\n" + A.label + " 점수 " + s.score + "점 (" + s.c + "/" + s.t + ")을 보낼까?" +
            (miss ? "\n아직 안 푼 퀴즈 " + miss + "개는 0점으로 들어감." : "") + "\n보내면 남은 횟수가 " + (left - 1) + "번이 됨.";
    if (!window.confirm(q)) return;
    btn.disabled = true;
    msg.textContent = "보내는 중…";
    function say(text){ MSG[area] = text; msg.textContent = text; }
    fetch(url, { method: "POST", body: JSON.stringify({ id: st.id, grade: st.grade, cls: st.cls, num: st.num, name: st.name, area: A.label, score: s.score, correct: s.c, total: s.t, detail: s.detail }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var t = new Date(), hm = t.getHours() + ":" + String(t.getMinutes()).padStart(2, "0");
        if (d && d.ok){ setSent(key(st), area, d.count); say("✅ 보냄 (" + hm + ") · 3번 중 " + d.count + "번째"); }
        else if (d && d.error === "limit"){ setSent(key(st), area, LIMIT); say("이미 3번 모두 보냈음."); }
        else { say("⚠️ 보내지 못함: " + ((d && d.error) || "알 수 없는 오류")); }
        renderPanels();
      })
      .catch(function(){ say("⚠️ 보내지 못함. 인터넷 연결을 확인하고 다시 눌러 보기."); btn.disabled = false; });
  }

  function render(){ renderWho(); renderPanels(); }

  window.MirimScore = {
    init: function(o){
      cfg = o;
      var root = document.documentElement.style;
      root.setProperty("--ms-accent", o.accent || "#5d4dbe");
      root.setProperty("--ms-deep", o.deep || "#4a3c9e");
      render();
      window.addEventListener("message", function(e){ if (e.data && e.data.mirimScore) render(); });
      window.addEventListener("storage", function(){ if (!editing) render(); });
      var bb = document.getElementById("backBtn");
      if (bb) bb.addEventListener("click", render);
      // 학번을 넣기 전에는 퀴즈를 시작하지 않아요
      if (o.guard){
        document.addEventListener("click", function(e){
          if (!e.target.closest(o.guard) || student()) return;
          e.preventDefault(); e.stopImmediatePropagation();
          renderWho();
          var err = document.querySelector(".ms-who .ms-err");
          if (err) err.textContent = "먼저 학년·반, 번호, 이름을 입력해야 시작할 수 있음.";
          focusWho();
        }, true);
      }
    },
    onResult: function(){ renderPanels(); },
    openGate: openGate
  };
})();
MirimScore.init({"areas": ["python"], "accent": "#d6557d", "deep": "#bd426e", "whoAfter": "#menu header.top", "panelAfter": "#menu .list"});
</script>
</body>
