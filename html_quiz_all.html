        url('https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Bold.woff2') format('woff2'),url('https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Bold.woff') format('woff')}
</style>
<style>
  /* calm-palette */ /* contrast-v2 */
  :root{
    --font:'KoPubWorld Dotum','KoPubWorld돋움체','KoPub돋움체','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --ink:#33303c; --ink-soft:#686472; --line:#efeaf3;
    --pink:#d6557d; --pink-deep:#bd426e; --yellow:#d3b981; --lav:#bfb4e4;
    --good:#397256; --good-bg:#eaf3ee; --bad:#b85768; --bad-bg:#faeef1; --code-bg:#2d2d39;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--font);
    color:var(--ink);background-color:#eff4fa;
    background-image:linear-gradient(160deg,#eff4fa 0%,#eaeff8 50%,#e9f3f8 100%);
    background-size:100% 100%;background-attachment:fixed;
    display:flex;justify-content:center;align-items:flex-start;padding:28px 16px 48px;line-height:1.4;letter-spacing:-0.01em;
  }
  .app{width:100%;max-width:680px}
  .hidden{display:none !important}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:0 4px}
  .mascot{flex:none;font-size:2.3rem;width:62px;height:62px;border-radius:20px;background:#ffffff;display:grid;place-items:center;border:2.2px solid #bcb7c4;box-shadow:none;animation:bob 2.6s ease-in-out infinite}
  h1{font-family:var(--font);font-weight:700;font-size:1.75rem;line-height:1.25}
  h1 .accent{color:var(--pink-deep)}
  .top p{color:var(--ink-soft);font-size:.95rem}
  .card{background:#ffffff;border-radius:28px;padding:28px;border:none;box-shadow:0 8px 0 #ddd7e6,0 20px 40px rgba(105,92,121,.12)}
  .card.enter{animation:pop .35s ease}
  .btn{font-family:var(--font);font-weight:700;font-size:1.15rem;border:none;border-radius:999px;padding:13px 28px;cursor:pointer;background:var(--pink);color:#ffffff;box-shadow:0 5px 0 var(--pink-deep);transition:transform .08s,box-shadow .08s,filter .15s}
  .btn:hover{filter:brightness(1.04)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pink-deep)}
  .btn.sub{background:#6e5dd7;box-shadow:0 5px 0 #5d4dbe}
  .btn.sub:active{box-shadow:0 2px 0 #5d4dbe}
  .btn:focus-visible,.choice:focus-visible,.hint-btn:focus-visible{outline:3px solid var(--lav);outline-offset:3px}

  /* 시작 */
  #start{text-align:center}
  .hero{font-size:4.4rem;display:inline-block;animation:bob 2.6s ease-in-out infinite}
  #start h2{font-family:var(--font);font-weight:700;font-size:1.6rem;margin-top:6px}
  .intro{color:var(--ink-soft);margin:6px 0 18px;word-break:keep-all}
  .stage-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin:0 auto 22px;text-align:left}
  .stage-list li{background:#f7f2e6;border:none;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}
  .stage-list .sn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--font);font-weight:700;background:#f8eaf0}
  .stage-list small{display:block;color:var(--ink-soft);font-size:.92rem;line-height:1.2}
  .stage-list b{font-family:var(--font);font-weight:700}

  /* 진행 */
  .status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .progress-text{font-family:var(--font);font-weight:700;font-size:1.15rem;color:var(--ink-soft)}
  .progress-text b{font-weight:800;color:var(--pink-deep);font-size:1.4rem}
  .score-badge{font-family:var(--font);font-weight:500;font-size:.82rem;color:var(--ink-soft);background:#ffffff;border:1px solid #ddd7e6;border-radius:999px;padding:2px 10px;white-space:nowrap}
  .score-badge b,.score-badge #score{font-weight:700;color:var(--ink)}
  .score-badge .sb-star{color:#efb72d;margin-right:2px}
  .score-badge.bump{animation:bump .45s ease}
  .bar{height:12px;border-radius:999px;background:#f2eef7;overflow:hidden;margin-bottom:18px}
  .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:999px;transition:width .4s ease}
  .tag{display:inline-block;font-family:var(--font);font-weight:700;font-size:.9rem;padding:3px 12px;border-radius:999px}
  .question{font-family:var(--font);font-weight:700;font-size:1.32rem;line-height:1.5;margin:10px 0 4px;word-break:keep-all}
  .question .qn{color:var(--pink-deep);margin-right:4px}
  code{font-family:'Nanum Gothic Coding',Consolas,monospace;font-size:.95em;background:#f6f4fa;color:#5a4f7e;padding:1px 6px;border-radius:6px}
  pre.code{position:relative;background:var(--code-bg);color:#f5f3fc;border-radius:18px;padding:38px 18px 16px;margin:14px 0 4px;font-family:'Nanum Gothic Coding',Consolas,monospace;font-size:1.02rem;line-height:1.7;overflow-x:auto}
  pre.code::before{content:"";position:absolute;top:14px;left:18px;width:10px;height:10px;border-radius:50%;background:#d6557d;box-shadow:16px 0 0 #d3b981,32px 0 0 #a4cdc0}
  pre.code::after{content:"python";position:absolute;top:8px;right:16px;font-size:.78rem;color:#a5a4b8}
  .t-kw{color:#e6b7cd;font-weight:700}.t-str{color:#e1d2a8}.t-num{color:#b7dbe6}.t-fn{color:#c0dcb4}.t-com{color:#9796aa;font-style:italic}

  /* 힌트 버튼 */
  .hint-row{display:flex;justify-content:flex-end;margin:12px 0 10px}
  .hint-btn{font-family:var(--font);font-weight:700;font-size:1rem;background:#f6f3e5;color:#635223;border:2px solid #ddd7e6;border-radius:999px;padding:6px 16px;cursor:pointer;box-shadow:0 3px 0 #ddd7e6}
  .hint-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #ddd7e6}
  .hint-btn:disabled{opacity:.5;cursor:default}
  .hint-box{background:#faf7ef;border:2px solid #ddd7e6;border-radius:16px;padding:10px 14px;margin-bottom:12px;word-break:keep-all;animation:pop .3s ease}
  .hint-box b{font-family:var(--font);font-weight:700;color:#725d28}

  /* 보기 */
  .choices{display:grid;gap:12px}
  .choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fdfcf9;border:2.5px solid #ddd7e6;border-radius:18px;padding:13px 14px;font:inherit;font-size:1.08rem;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #ddd7e6;transition:transform .12s,box-shadow .12s,border-color .12s,background .2s,opacity .2s}
  .choice:hover:not(:disabled){border-color:#c9c2d5;transform:translateY(-2px);box-shadow:0 6px 0 #c9c2d5}
  .choice:disabled{cursor:default}
  .choice .num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font);font-weight:700;font-size:1.05rem}
  .choice:nth-child(1) .num{background:#ddd7e6}.choice:nth-child(2) .num{background:#ddd7e6}.choice:nth-child(3) .num{background:#ddd7e6}
  .choice .label{flex:1;min-width:0;word-break:keep-all}
  .choice .mark{flex:none;font-size:1.3rem;font-weight:700;width:22px;text-align:center}
  .choice.correct{background:var(--good-bg);border-color:#ddd7e6;box-shadow:0 4px 0 #ddd7e6}
  .choice.correct .num{background:var(--good);color:#ffffff}.choice.correct .mark{color:var(--good)}
  .choice.wrong{background:var(--bad-bg);border-color:#ddd7e6;box-shadow:0 4px 0 #ddd7e6}
  .choice.wrong .num{background:var(--bad);color:#ffffff}.choice.wrong .mark{color:var(--bad)}
  .choice.shake{animation:shake .4s ease}
  .choice.dim{opacity:.5}

  .feedback{margin-top:18px;border-radius:18px;padding:14px 18px;border:2.5px solid;font-size:1.02rem;word-break:keep-all;animation:pop .3s ease}
  .feedback.good{background:var(--good-bg);border-color:#ddd7e6;color:#1f3b2d}
  .feedback.bad{background:var(--bad-bg);border-color:#ddd7e6;color:#592f36}
  .fb-title{font-family:var(--font);font-weight:700;font-size:1.25rem;margin-bottom:4px}
  .fb-sub{font-size:.92rem;opacity:.85;margin-bottom:6px}
  .explain{background:#ffffff;border-radius:14px;padding:10px 14px;margin-top:8px;color:var(--ink);border:2px solid #ddd7e6}
  .explain b{font-family:var(--font);font-weight:700;color:var(--good)}
  .actions{display:flex;justify-content:flex-end;margin-top:18px}

  /* 결과 */
  #result{text-align:center}
  .trophy{font-size:4.4rem;display:inline-block;animation:bob 2.6s ease-in-out infinite}
  #result h2{font-family:var(--font);font-weight:700;font-size:1.6rem}
  .final-score{font-family:var(--font);font-weight:700;font-size:4rem;line-height:1.1;color:var(--pink-deep);margin:8px 0 2px}
  .final-score small{font-size:1.5rem;color:var(--ink-soft)}
  .final-msg{font-size:1.1rem;margin:6px 0 18px;word-break:keep-all}
  .stage-result{list-style:none;display:grid;gap:8px;max-width:460px;margin:0 auto 22px;text-align:left}
  .stage-result li{display:flex;align-items:center;gap:10px;background:#fbfafd;border:2px solid #ddd7e6;border-radius:14px;padding:9px 14px}
  .stage-result .nm{flex:1}
  .stage-result .meter{width:90px;height:10px;border-radius:999px;background:#f2eef7;overflow:hidden}
  .stage-result .meter span{display:block;height:100%;background:var(--good)}
  .stage-result .ct{font-family:var(--font);font-weight:700;width:44px;text-align:right}
  .wrong-list{font-size:.92rem;color:var(--ink-soft);margin:-8px 0 20px;word-break:keep-all}
  .result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  footer{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-top:22px}

  .particle{position:fixed;pointer-events:none;font-size:20px;z-index:50;animation:fly .9s ease-out forwards;color:#efb72d;font-family:var(--font)}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot));opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
  @media (max-width:560px){
    body{padding:18px 16px 36px}
    .card{padding:20px 16px;border-radius:22px}
    h1{font-size:1.4rem}
    .mascot{width:52px;height:52px;font-size:1.9rem;border-radius:16px}
    .question{font-size:1.16rem}
    pre.code{font-size:.92rem;padding:36px 14px 14px}
    .stage-list{grid-template-columns:1fr}
    .final-score{font-size:3.3rem}
  }

  /* ---------- 좌측 정렬 ---------- */
  #start,#result,footer{text-align:left}
  .stage-list,.rules,.name-form,.file-panel,.stage-result,.ranking,.review{margin-left:0;margin-right:0;max-width:none}
  .name-form label{padding-left:0}
  .review,.result-actions{justify-content:flex-start}
  .final-score,.final-msg,.final-time,.wrong-list{text-align:left}

  /* ---------- HTML 퀴즈: 블루 톤 버튼 ---------- */
  .btn:not(.sub):not(.ghost){background:#3a7fc3;box-shadow:0 5px 0 #ddd7e6}
  .btn:not(.sub):not(.ghost):active{box-shadow:0 2px 0 #ddd7e6}
  .btn.small:not(.sub):not(.plain){box-shadow:0 3px 0 #ddd7e6}
  /* 힌트 항상 보이기 */
  .hint-row{display:none}
  .hint-box{margin-top:12px}
  /* 행간: 문제 112%, 힌트 130% (KoPub 기준) */
  .question{line-height:1.12 !important}
  .hint-box,.hint-box p,.hint-always{line-height:1.3 !important}
  /* ---------- 난이도 표시 (문제 맨 아래, 노란 별만) ---------- */
  .diff-row{display:flex;align-items:center;gap:8px;margin-top:22px;padding-top:12px;border-top:1px solid #ddd7e6;font-size:.85rem;color:var(--ink-soft)}
  .diff-row:empty{display:none}
  .diff-row .stars{font-size:1.15rem;letter-spacing:2px;color:#efb72d;line-height:1}
  .diff-row .stars .off{color:#cac3cf}
  .diff-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.88rem;color:var(--ink-soft);margin:0 0 18px}
  .diff-legend .it{display:inline-flex;align-items:center;gap:4px}
  .diff-legend .st{color:#efb72d;letter-spacing:1px}
  .credit{display:block;margin-top:6px;font-weight:700;color:var(--ink);letter-spacing:.01em}
  /* PC에서 진행 표시·단계 배지·알아두기 제목 키우기 */
  @media (min-width:561px){
    .progress-text{font-size:1.25rem}
    .progress-text b{font-size:1.55rem}
    .tag{font-size:1rem;padding:4px 14px}
    .concept .ct{font-size:1.02rem;margin-bottom:4px}
  }
  .globe{width:1em;height:1em;display:block}
  /* 단계 번호: 분류 표시라서 버튼처럼 보이지 않게, 밝은 원 + 짙은 로마 숫자 */
  .stage-list .sn{width:38px;height:38px;background:#fffdf9;border:none;box-shadow:none;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:.9rem;letter-spacing:-.03em;line-height:1}
  .stage-list .sn[data-n="4"]{font-size:.74rem}
  .stage-list .sn[data-n="5"]{font-size:.62rem}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mascot" aria-hidden="true"><svg class="globe" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="#4f88c9"/><g fill="none" stroke="#ffffff" stroke-width="3"><ellipse cx="32" cy="32" rx="11" ry="27"/><path d="M5 32H59M8.5 19H55.5M8.5 45H55.5M32 5V59"/></g></svg></div>
    <div>
      <h1>HTML <span class="accent">첫걸음</span> 퀴즈</h1>
      <p>HTML이 뭔지부터 문서 구조까지, 20문제로 차근차근!</p>
    </div>
  </header>

  <!-- 시작 -->
  <section id="start" class="card">
    <div class="hero" aria-hidden="true"><svg class="globe" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="#4f88c9"/><g fill="none" stroke="#ffffff" stroke-width="3"><ellipse cx="32" cy="32" rx="11" ry="27"/><path d="M5 32H59M8.5 19H55.5M8.5 45H55.5M32 5V59"/></g></svg></div>
    <h2>HTML, 처음이어도 괜찮음!</h2>
    <p class="intro">문제마다 <b>💡 힌트</b>가 함께 보임.<br>틀려도 힌트를 보고 다시 고를 수 있음.</p>
    <ul class="stage-list" id="stageList"></ul>
    <div class="diff-legend"><span>난이도</span><span class="it"><span class="st">★</span>쉬움</span><span class="it"><span class="st">★★</span>보통</span><span class="it"><span class="st">★★★</span>어려움</span></div>
    <button class="btn" id="startBtn" type="button">시작하기 ▶</button>
  </section>

  <!-- 문제 -->
  <section id="quiz" class="card hidden">
    <div class="status">
      <div class="progress-text"><b id="qNum">1</b> / <span id="qTotal">20</span> 번째 문제</div>
      <div class="score-badge" id="scoreBadge"><span class="sb-star">★</span><span id="score">0</span>개 정답</div>
    </div>
    <div class="bar"><span id="bar"></span></div>
    <span class="tag" id="qStage"></span>
    <h2 class="question" id="qText"></h2>
    <pre class="code hidden" id="qCode"></pre>
    <div class="hint-row"><button class="hint-btn" id="hintBtn" type="button">💡 힌트 보기</button></div>
    <div class="hint-box hidden" id="hintBox"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback hidden" id="feedback" aria-live="polite"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn" type="button">다음 문제 ▶</button></div>
    <div class="diff-row" id="qDiff"></div>
  </section>

  <!-- 결과 -->
  <section id="result" class="card hidden">
    <div class="trophy" id="resultEmoji" aria-hidden="true">🏆</div>
    <h2 id="resultTitle">퀴즈 끝! 수고 많았음</h2>
    <div class="final-score"><span id="finalScore">0</span><small> / <span id="finalTotal">20</span>개</small></div>
    <p class="final-msg" id="finalMsg"></p>
    <ul class="stage-result" id="stageResult"></ul>
    <p class="wrong-list" id="wrongList"></p>
    <div class="result-actions">
      <button class="btn" id="retryWrongBtn" type="button">❗ 틀린 문제만 다시 풀기</button>
      <button class="btn sub" id="retryAllBtn" type="button">🔄 처음부터 다시 풀기</button>
    </div>
  </section>

  <footer>처음 시작하는 HTML · 20문제 · 3지 선다형<span class="credit">by Make a long term memory</span></footer>
</div>

<script>
/* 단계 정보 */
const STAGES = [
  { name: "HTML이란?",        color: ["#f8eaf0", "#94536d"] },
  { name: "태그의 기본",       color: ["#ede4cd", "#635223"] },
  { name: "글자와 목록",       color: ["#e8f3ee", "#2f5946"] },
  { name: "링크와 이미지",     color: ["#ecf3f9", "#415e75"] },
  { name: "문서의 구조",       color: ["#f2eef9", "#66599c"] }
];

/* 문제 30개
   s: 단계 번호(0부터), c: 보기 3개, a: 정답 위치(0부터)
   `백틱` 안의 글자는 코드 모양으로 보여요 */
const Q = [
  // 1단계
  { s:0, q:"HTML을 '프로그래밍 언어'가 아니라 <b>'마크업 언어'</b>라고 부르는 이유는?", c:["계산이나 반복 없이, 내용에 '제목·문단' 같은 표시(태그)를 붙이는 언어라서","Mark라는 사람이 처음 만든 언어라서","웹 브라우저에서만 쓸 수 있는 언어라서"], a:0,
    h:"Markup은 원고에 '여기는 제목, 여기는 굵게'처럼 표시를 해 두는 일이에요. HTML로는 덧셈이나 반복을 할 수 없어요.", e:"HTML은 내용에 태그로 표시를 붙여서 '이건 제목, 이건 문단'이라고 알려 주는 <b>마크업 언어</b>예요. 계산·반복 같은 동작은 자바스크립트나 파이썬 같은 프로그래밍 언어가 맡아요." },
  { s:0, q:"웹사이트의 <b>첫 화면</b>으로 쓰는 HTML 파일의 이름으로 가장 알맞은 것은?", c:["`index.html`","`first.html`","`start.html`"], a:0,
    h:"주소 끝에 파일 이름을 쓰지 않아도 웹 서버가 자동으로 먼저 열어 주는 약속된 이름이 있어요. 'index'는 '목차'라는 뜻이에요.", e:"웹 서버는 주소에 파일 이름이 없으면 `index.html`을 먼저 찾아 열어요. 그래서 GitHub Pages에서도 `index.html`로 올리면 짧은 주소만으로 첫 화면이 열려요." },
  { s:0, q:"HTML 파일을 <b>메모장</b>으로 열면 무엇이 보일까요?", c:["`<h1>`, `<p>` 같은 태그가 섞인 코드 글자","브라우저에서 본 것처럼 꾸며진 화면","아무것도 보이지 않는다"], a:0,
    h:"HTML 파일은 글자로만 이루어진 텍스트 파일이에요. 코드를 읽어서 화면으로 그려 주는 것은 브라우저가 하는 일이에요.", e:"메모장은 파일 속 글자를 그대로 보여 줘서 태그가 섞인 코드가 보여요. 같은 파일을 브라우저로 열어야 제목, 문단, 그림이 있는 화면으로 바뀌어요. 디자인은 브라우저 화면에서, 수정은 코드에서 해요." },
  { s:0, q:"웹페이지를 만드는 HTML, CSS, 자바스크립트 중 HTML이 맡는 일은?", c:["내용과 구조(뼈대)","색과 디자인(옷)","움직임과 동작(행동)"], a:0,
    h:"집을 지을 때로 비유하면 HTML은 '뼈대'예요.", e:"HTML은 뼈대(내용·구조), CSS는 꾸미기(색·디자인), 자바스크립트는 동작을 맡아요." },
  // 2단계
  { s:1, q:"HTML 태그를 감싸는 기호는?", c:["`< >` (꺾쇠)","`( )` (소괄호)","`{ }` (중괄호)"], a:0,
    h:"`<p>`, `<h1>`처럼 생겼어요.", e:"태그는 꺾쇠 `< >`로 감싸요. 예: `<p>`, `<h1>`" },
  { s:1, q:"문단 태그 `<p>`의 닫는 태그로 올바른 것은?", c:["`</p>`","`<\\p>`","`<p>`"], a:0,
    h:"닫는 태그는 이름 앞에 슬래시(/)를 붙여요.", e:"`</p>`처럼 슬래시(/)를 붙이면 닫는 태그예요. 역슬래시(\\)가 아니에요." },
  { s:1, q:"`<h1>`부터 `<h6>`까지의 제목 태그 중 가장 높은 단계(가장 중요한) 제목은?", c:["`<h1>`","`<h6>`","`<h3>`"], a:0,
    h:"1등이 가장 높은 단계예요.", e:"숫자가 작을수록 중요한 제목이에요. `<h1>`이 가장 높은 단계라 기본 모양도 가장 커요. 글자 크기는 CSS로 정하니까, 크기가 아니라 내용의 중요도에 맞춰 골라요." },
  { s:1, q:"글의 한 문단(paragraph)을 나타내는 태그는?", c:["`<p>`","`<t>`","`<para>`"], a:0,
    h:"paragraph의 첫 글자예요.", e:"`<p>`로 문단을 감싸면 문단마다 위아래로 간격이 생겨요." },
  { s:1, q:"닫는 태그가 <b>없는</b> 태그는?", c:["`<br>`","`<p>`","`<h1>`"], a:0,
    h:"감쌀 내용이 없는 태그는 닫는 태그가 필요 없어요. 줄만 바꾸는 태그를 떠올려 보세요.", e:"`<br>`(줄바꿈), `<img>`(이미지), `<hr>`(가로줄)처럼 감쌀 내용이 없는 태그는 닫는 태그가 없어요." },
  // 3단계
  { s:2, q:"글자를 <b>굵게 강조</b>하는 태그는?", c:["`<strong>`","`<em>`","`<small>`"], a:0,
    h:"'강한'이라는 뜻의 영어 단어예요.", e:"`<strong>`은 굵게 강조, `<em>`은 기울여 강조, `<small>`은 작은 글씨예요." },
  { s:2, q:"점(•)이 찍히는 <b>순서 없는</b> 목록 태그는?", c:["`<ul>`","`<ol>`","`<li>`"], a:0,
    h:"unordered list(순서 없는 목록)의 줄임말이에요.", e:"`<ul>`은 점 목록, `<ol>`은 번호 목록, `<li>`는 목록 안의 항목 하나예요." },
  { s:2, q:"1, 2, 3 번호가 붙는 <b>순서 있는</b> 목록 태그는?", c:["`<ol>`","`<ul>`","`<nl>`"], a:0,
    h:"ordered list(순서 있는 목록)의 줄임말이에요.", e:"`<ol>`로 감싸면 항목 앞에 1, 2, 3 번호가 자동으로 붙어요." },
  { s:2, q:"목록 안의 항목 하나를 감싸는 태그는?", c:["`<li>`","`<lt>`","`<it>`"], a:0,
    h:"list item(목록 항목)의 줄임말이에요.", e:"`<ul>`이나 `<ol>` 안에서 항목마다 `<li>`로 감싸요." },
  { s:2, q:"화면에 가로줄을 긋는 태그는?", c:["`<hr>`","`<br>`","`<line>`"], a:0,
    h:"horizontal rule(가로 선)의 줄임말이에요.", e:"`<hr>`은 가로줄, `<br>`은 줄바꿈이에요. 둘 다 닫는 태그가 없어요." },
  // 4단계
  { s:3, q:"다른 페이지로 이동하는 링크를 만드는 태그는?", c:["`<a>`","`<link>`","`<go>`"], a:0,
    h:"알파벳 한 글자짜리 태그예요. anchor(닻)의 첫 글자예요.", e:"`<a>` 태그로 링크를 만들어요. `<link>`는 CSS 파일을 연결할 때 쓰는 다른 태그예요." },
  { s:3, q:"링크(`<a>`)가 이동할 주소를 쓰는 속성은?", c:["`href`","`src`","`url`"], a:0,
    h:"hypertext reference(하이퍼텍스트 참조)의 줄임말이에요.", e:"`<a href=\"주소\">`처럼 `href`에 이동할 주소를 써요." },
  { s:3, q:"그림을 넣는 태그는?", c:["`<img>`","`<image>`","`<pic>`"], a:0,
    h:"image를 세 글자로 줄였어요.", e:"`<img src=\"cat.jpg\">`처럼 써요. 닫는 태그가 없어요." },
  { s:3, q:"`<img>` 태그의 `alt` 속성은 무엇을 쓸까요?", c:["그림이 안 보일 때 대신 보여 줄 설명","그림의 크기","그림 테두리의 색"], a:0,
    h:"alternative(대신하는 것)의 줄임말이에요.", e:"`alt`에 그림 설명을 써 두면 그림이 안 보일 때나 화면 낭독기를 쓰는 사람에게 설명이 전달돼요. 모두가 쓰기 편한 웹(웹 접근성)을 위해 꼭 챙겨야 해요." },
  // 5단계
  { s:4, q:"화면에 보이는 내용(제목, 글, 그림)이 들어가는 곳은?", c:["`<body>`","`<head>`","`<title>`"], a:0,
    h:"'몸'이라는 뜻이에요. 눈에 보이는 부분이에요.", e:"`<body>` 안의 내용이 화면에 보여요. `<head>`에는 탭 제목 같은 보이지 않는 정보를 넣어요." },
  { s:4, q:"브라우저 탭에 보이는 페이지 제목을 정하는 태그는?", c:["`<title>`","`<h1>`","`<body>`"], a:0,
    h:"'제목'을 뜻하는 영어 단어예요. `<head>` 안에 넣어요.", e:"`<title>`은 탭 제목, `<h1>`은 화면 안의 큰 제목이에요. 둘은 서로 달라요." }
];

/* 문제별 난이도 (1: ★ 쉬움, 2: ★★ 보통, 3: ★★★ 어려움) — 문제 순서와 같아요 */
const DIFF = [2, 2, 2, 2, 1, 2, 1, 1, 3, 1, 2, 2, 1, 2, 2, 2, 1, 2, 2, 2];
const DIFF_LABEL = ["", "쉬움", "보통", "어려움"];
function setDiff(d){
  const el = document.getElementById("qDiff");
  if (!el) return;
  if (!d){ el.innerHTML = ""; return; }
  el.innerHTML = `<span class="dl">난이도</span><span class="stars" aria-hidden="true">${"★".repeat(d)}<span class="off">${"☆".repeat(3 - d)}</span></span>`;
  el.setAttribute("aria-label", `난이도 별 ${d}개 (${DIFF_LABEL[d]})`);
}

/* 도우미 */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 문제 글 속 <u> 밑줄만 허용하고 나머지는 안전하게 표시
const fmt = s => esc(s).replace(/&lt;(\/?)(u|b)&gt;/g,"<$1$2>").replace(/`([^`]+)`/g,"<code>$1</code>");
function highlight(code){
  const re = /("[^"\n]*"|'[^'\n]*')|(#.*$)|\b(if|elif|else|for|in|and|or|not|True|False)\b|\b(print|input|int|range|str)\b|\b(\d+)\b/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(code))){
    out += esc(code.slice(last, m.index));
    if (m[1]) out += `<span class="t-str">${esc(m[1])}</span>`;
    else if (m[2]) out += `<span class="t-com">${esc(m[2])}</span>`;
    else if (m[3]) out += `<span class="t-kw">${m[3]}</span>`;
    else if (m[4]) out += `<span class="t-fn">${m[4]}</span>`;
    else if (m[5]) out += `<span class="t-num">${m[5]}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function burst(x, y, n = 12){
  if (reduceMotion) return;
  const em = ["★","✦","★","✧","★"];
  for (let i = 0; i < n; i++){
    const s = document.createElement("span");
    s.className = "particle"; s.textContent = em[i % em.length];
    const ang = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(ang) * d + "px");
    s.style.setProperty("--dy", Math.sin(ang) * d - 30 + "px");
    s.style.setProperty("--rot", (Math.random() * 240 - 120) + "deg");
    document.body.appendChild(s); setTimeout(() => s.remove(), 1000);
  }
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function restartAnim(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* 시작 화면의 단계 목록 */
const ROMAN = ["I.","II.","III.","IV.","V.","VI.","VII.","VIII.","IX.","X."];
$("stageList").innerHTML = STAGES.map((st, i) => {
  const n = Q.filter(q => q.s === i).length;
  const first = Q.findIndex(q => q.s === i) + 1;
  return `<li><span class="sn" data-n="${ROMAN[i].length}" style="color:${st.color[1]}">${ROMAN[i]}</span>` +
         `<div><b>${st.name}</b><small>${first}~${first + n - 1}번 · ${n}문제</small></div></li>`;
}).join("");

/* 상태 */
let order = [];      // 이번에 풀 문제 번호들
let pos = 0;         // order 안에서의 위치
let correct = 0;
let tries = 0;
let locked = false;
let firstTry = {};   // 문제번호 → 첫 시도에 맞혔는지

function showScreen(id){
  ["start","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function startRound(list){
  order = list; pos = 0; correct = 0; firstTry = {};
  $("score").textContent = 0;
  $("qTotal").textContent = order.length;
  showScreen("quiz");
  render();
}

function render(){
  const qi = order[pos], q = Q[qi], st = STAGES[q.s];
  tries = 0; locked = false;
  $("qNum").textContent = pos + 1;
  $("bar").style.width = (pos / order.length * 100) + "%";
  const tag = $("qStage");
  tag.textContent = `${q.s + 1}단계 · ${st.name}`;
  tag.style.background = st.color[0]; tag.style.color = st.color[1];
  setDiff(DIFF[qi]);
  $("qText").innerHTML = `<span class="qn">${qi + 1}.</span>${fmt(q.q)}`;
  if (q.code){ $("qCode").innerHTML = highlight(q.code); $("qCode").classList.remove("hidden"); }
  else $("qCode").classList.add("hidden");

  $("hintBtn").disabled = false;
  $("hintBox").classList.remove("hidden");
  $("hintBox").innerHTML = `<b>💡 힌트</b><br>${fmt(q.h)}`;

  const box = $("choices"); box.innerHTML = "";
  shuffle(q.c.map((_, i) => i)).forEach((ci, k) => {
    const t = q.c[ci];
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice";
    b.innerHTML = `<span class="num">${"①②③"[k]}</span><span class="label">${fmt(t)}</span><span class="mark" aria-hidden="true"></span>`;
    b.addEventListener("click", () => choose(b, ci));
    box.appendChild(b);
  });

  $("feedback").className = "feedback hidden"; $("feedback").innerHTML = "";
  const next = $("nextBtn");
  next.classList.add("hidden");
  next.textContent = pos === order.length - 1 ? "결과 보기 🏁" : "다음 문제 ▶";
  restartAnim($("quiz"), "enter");
}

function showHint(){
  $("hintBox").classList.remove("hidden");
  $("hintBtn").disabled = true;
}

function choose(btn, ci){
  if (locked || btn.disabled) return;
  const qi = order[pos], q = Q[qi], fb = $("feedback");
  tries++;
  if (ci === q.a){
    locked = true;
    btn.classList.add("correct"); btn.querySelector(".mark").textContent = "✔";
    document.querySelectorAll(".choice").forEach(b => {
      b.disabled = true;
      if (b !== btn && !b.classList.contains("wrong")) b.classList.add("dim");
    });
    let title, sub = "";
    if (tries === 1){
      firstTry[qi] = true; correct++;
      $("score").textContent = correct; restartAnim($("scoreBadge"), "bump");
      title = "🎉 정답!";
    } else {
      title = "👍 정답! 힌트를 보고 찾아냄";
      sub = `<div class="fb-sub">한 번에 맞히지 못한 문제는 '틀린 문제'로 기록됨. 나중에 다시 풀어 보기!</div>`;
    }
    fb.className = "feedback good";
    fb.innerHTML = `<div class="fb-title">${title}</div>${sub}<div class="explain"><b>✏️ 해설</b><br>${fmt(q.e)}</div>`;
    const r = btn.getBoundingClientRect(); burst(r.left + 30, r.top + r.height / 2);
    $("bar").style.width = ((pos + 1) / order.length * 100) + "%";
    const next = $("nextBtn"); next.classList.remove("hidden");
    next.focus({ preventScroll: true });
    next.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  } else {
    if (tries === 1) firstTry[qi] = false;
    btn.classList.add("wrong"); btn.disabled = true; btn.querySelector(".mark").textContent = "✖";
    restartAnim(btn, "shake");
    showHint();
    fb.className = "feedback bad";
    fb.innerHTML = `<div class="fb-title">😢 아쉬움, 오답!</div>위의 <b>💡 힌트</b>를 다시 읽고 다른 보기를 골라 보기.`;
    restartAnim(fb, "feedback");
    $("hintBox").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  }
}

function next(){
  if (pos < order.length - 1){ pos++; render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }
  else showResult();
}

let lastWrong = [];
function showResult(){
  const total = order.length;
  $("finalScore").textContent = correct;
  $("finalTotal").textContent = total;
  const rate = correct / total;
  let emoji, msg;
  if (rate === 1){ emoji = "🏆"; msg = "모두 한 번에 맞힘! HTML 첫걸음 완벽 통과! 🌐✨"; }
  else if (rate >= 0.8){ emoji = "🥳"; msg = "아주 잘했음! 틀린 문제만 한 번 더 보면 완벽함."; }
  else if (rate >= 0.5){ emoji = "🌱"; msg = "좋음! 힌트와 해설을 떠올리며 틀린 문제를 다시 풀어 보기."; }
  else { emoji = "💪"; msg = "처음엔 누구나 어려움. 틀린 문제를 다시 풀면 금방 익숙해짐!"; }
  $("resultEmoji").textContent = emoji;
  $("finalMsg").textContent = msg;
  $("resultTitle").textContent = total === Q.length ? "퀴즈 끝! 수고 많았음" : "다시 풀기 끝! 수고 많았음";

  // 단계별 결과
  $("stageResult").innerHTML = STAGES.map((st, i) => {
    const ids = order.filter(qi => Q[qi].s === i);
    if (!ids.length) return "";
    const ok = ids.filter(qi => firstTry[qi]).length;
    return `<li><span class="nm">${i + 1}단계 · ${st.name}</span>` +
           `<span class="meter"><span style="width:${ok / ids.length * 100}%"></span></span>` +
           `<span class="ct">${ok}/${ids.length}</span></li>`;
  }).join("");

  lastWrong = order.filter(qi => !firstTry[qi]);
  $("wrongList").textContent = lastWrong.length
    ? `다시 볼 문제: ${lastWrong.map(qi => qi + 1 + "번").join(", ")}`
    : "틀린 문제 없음! 🎉";
  $("retryWrongBtn").classList.toggle("hidden", !lastWrong.length);

  showScreen("result");
  if (rate === 1) setTimeout(() => burst(window.innerWidth / 2, window.innerHeight / 3, 24), 400);
}

/* 이벤트 */
$("startBtn").addEventListener("click", () => startRound(Q.map((_, i) => i)));
$("retryAllBtn").addEventListener("click", () => startRound(Q.map((_, i) => i)));
$("retryWrongBtn").addEventListener("click", () => startRound(lastWrong.slice()));
$("hintBtn").addEventListener("click", showHint);
$("nextBtn").addEventListener("click", next);
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  if (["1","2","3"].includes(e.key)){
    const b = document.querySelectorAll(".choice")[Number(e.key) - 1];
    if (b && !b.disabled) b.click();
  } else if (e.key === "h" || e.key === "H"){ if (!$("hintBtn").disabled) showHint(); }
});
<\/script>
</body>
</html>
</script>
<script type="text/plain" id="src-layout"><!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS 레이아웃 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* KoPubWorld 돋움체 (문화체육관광부·한국출판인회의, 무료 서체) — 컴퓨터에 설치돼 있으면 그것을, 없으면 CDN에서 받아 써요 */
  @font-face{font-family:'KoPubWorld Dotum';font-style:normal;font-weight:400;font-display:swap;ascent-override:88%;descent-override:24%;line-gap-override:0%;
    src:local('KoPubWorldDotum Medium'),local('KoPubWorldDotumMedium'),local('KoPubWorld돋움체 Medium'),
        url('https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Medium.woff2') format('woff2'),url('https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Medium.woff') format('woff')}
  @font-face{font-family:'KoPubWorld Dotum';font-style:normal;font-weight:700;font-display:swap;ascent-override:88%;descent-override:24%;line-gap-override:0%;
    src:local('KoPubWorldDotum Bold'),local('KoPubWorldDotumBold'),local('KoPubWorld돋움체 Bold'),
        url('https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Bold.woff2') format('woff2'),url('https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Bold.woff') format('woff')}
</style>
<style>
  /* calm-palette */ /* contrast-v2 */
  :root{
    --font:'KoPubWorld Dotum','KoPubWorld돋움체','KoPub돋움체','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --mono:'Nanum Gothic Coding',Consolas,'D2Coding',monospace;
    --ink:#33303c; --ink-soft:#686472; --line:#efeaf3;
    --pink:#d6557d; --pink-deep:#bd426e; --yellow:#d3b981; --lav:#bfb4e4;
    --good:#397256; --good-bg:#eaf3ee; --bad:#b85768; --bad-bg:#faeef1; --code-bg:#2d2d39;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:var(--font);color:var(--ink);background-color:#eff4fa;
    background-image:linear-gradient(160deg,#eff4fa 0%,#eaeff8 50%,#e9f3f8 100%);
    background-size:100% 100%;background-attachment:fixed;
    display:flex;justify-content:center;align-items:flex-start;padding:28px 16px 48px;
    line-height:1.4;letter-spacing:-0.01em;
  }
  .app{width:100%;max-width:680px}
  .hidden{display:none !important}
  b,strong{font-weight:700}

  .top{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:0 4px}
  .mascot{flex:none;font-size:2.3rem;width:62px;height:62px;border-radius:20px;background:#ffffff;display:grid;place-items:center;border:2.2px solid #bcb7c4;box-shadow:none;animation:bob 2.6s ease-in-out infinite}
  h1{font-weight:800;font-size:1.7rem;line-height:1.25}
  h1 .accent{color:var(--pink-deep)}
  .top p{color:var(--ink-soft);font-size:.95rem}

  .card{background:#ffffff;border-radius:28px;padding:28px;border:none;box-shadow:0 8px 0 #ddd7e6,0 20px 40px rgba(105,92,121,.12)}
  .card.enter{animation:pop .35s ease}

  .btn{font-family:var(--font);font-weight:700;font-size:1.08rem;border:none;border-radius:999px;padding:12px 26px;cursor:pointer;background:#3a7fc3;color:#ffffff;box-shadow:0 5px 0 #3a608a;transition:transform .08s,box-shadow .08s,filter .15s}
  .btn:hover{filter:brightness(1.04)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3a608a}
  .btn.sub{background:#6e5dd7;box-shadow:0 5px 0 #5d4dbe}
  .btn.sub:active{box-shadow:0 2px 0 #5d4dbe}
  .btn:focus-visible{outline:3px solid var(--lav);outline-offset:3px}

  /* 시작 */
  .hero{font-size:4rem;display:inline-block;animation:bob 2.6s ease-in-out infinite}
  #start h2{font-weight:800;font-size:1.5rem;margin:4px 0 6px}
  .intro{color:var(--ink-soft);margin-bottom:18px;word-break:keep-all}
  .how{list-style:none;display:grid;gap:10px;margin-bottom:12px}
  .how li{background:#f7f2e6;border:none;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;word-break:keep-all}
  .how li span{flex:none;font-size:1.2rem}
  .base-note{font-size:.85rem;color:var(--ink-soft);margin:0 2px 18px;word-break:keep-all}
  .stage-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
  .stage-list li{background:#f7f2e6;border:none;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}
  .stage-list .sn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700}
  .stage-list small{display:block;color:var(--ink-soft);font-size:.92rem;line-height:1.2}
  .stage-list b{font-weight:700}

  /* 진행 */
  .status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .progress-text{font-weight:700;font-size:1.1rem;color:var(--ink-soft)}
  .progress-text b{color:var(--pink-deep);font-size:1.35rem;font-weight:800}
  .score-badge{font-family:var(--font);font-weight:500;font-size:.82rem;color:var(--ink-soft);background:#ffffff;border:1px solid #ddd7e6;border-radius:999px;padding:2px 10px;white-space:nowrap}
  .score-badge #score{font-weight:700;color:var(--ink)}
  .score-badge .sb-star{color:#efb72d;margin-right:2px}
  .score-badge.bump{animation:bump .45s ease}
  .bar{height:12px;border-radius:999px;background:#f2eef7;overflow:hidden;margin-bottom:18px}
  .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:999px;transition:width .4s ease}

  .tag{display:inline-block;font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:999px}
  .concept{margin:12px 0 14px;background:#f9fbfc;border:2px solid #ddd7e6;border-radius:16px;padding:10px 14px;font-size:.98rem;word-break:keep-all}
  .concept .ct{font-weight:700;color:#415e75;font-size:.9rem;display:block;margin-bottom:2px}
  .concept .fig{display:block;margin-top:8px;padding-top:8px;border-top:1px solid #ddd7e6;font-size:.92rem;color:#5b4a94}
  .question{font-weight:700;font-size:1.25rem;word-break:keep-all}
  .question .qn{color:var(--pink-deep);margin-right:4px}
  code{font-family:var(--mono);font-size:.95em;background:#f6f4fa;color:#5a4f7e;padding:1px 6px;border-radius:6px}

  pre.code{position:relative;background:var(--code-bg);color:#f5f3fc;border-radius:18px;padding:38px 18px 16px;margin:14px 0 4px;font-family:var(--mono);font-size:1rem;line-height:1.75;overflow-x:auto;white-space:pre}
  pre.code::before{content:"";position:absolute;top:14px;left:18px;width:10px;height:10px;border-radius:50%;background:#d6557d;box-shadow:16px 0 0 #d3b981,32px 0 0 #a4cdc0}
  pre.code::after{content:"html · css";position:absolute;top:8px;right:16px;font-size:.78rem;color:#a5a4b8}
  .t-tag{color:#e6b7cd;font-weight:700}.t-attr{color:#c0dcb4}.t-str{color:#e1d2a8}.t-num{color:#b7dbe6}
  .t-sel{color:#e6b7cd;font-weight:700}.t-prop{color:#c0dcb4}.t-kw{color:#c7bbf4;font-weight:700}
  .blank{
    font-family:var(--mono);font-size:1rem;font-weight:700;color:var(--ink);
    background:#f1ebd6;border:2.5px solid #ddd7e6;border-radius:10px;
    display:inline-block;min-width:3.2em;text-align:center;padding:0 10px;margin:0 2px;vertical-align:middle;line-height:1.6;
    transition:border-color .15s, background .2s;
  }
  .blank.ok{background:var(--good-bg);border-color:#ddd7e6;color:#1f3b2d}
  .blank.no{background:var(--bad-bg);border-color:#ddd7e6;color:#592f36}
  .blank.shake{animation:shake .4s ease}
  .blank.empty{color:#6f6036}

  /* 화면 미리보기: 목표 화면 · 내 화면 */
  .pv-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 4px}
  .pv{min-width:0;background:#f9f8fa;border:2px solid #ddd7e6;border-radius:14px;padding:8px;transition:border-color .2s,background .2s}
  .pv .ol{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;font-size:.82rem;font-weight:700;color:var(--ink-soft);margin:0 2px 6px}
  .pv .ol .st{font-weight:500}
  .pv .ol code{font-size:.9em;padding:0 4px}
  .pv-body{background:#ffffff;border:1px solid #ddd7e6;border-radius:10px;padding:8px;overflow:auto;min-height:56px}
  .pv.target{background:#f1f6fb;border-color:#ddd7e6}
  .pv.target .ol{color:#3a608a}
  .pv.mine.bad{background:var(--bad-bg);border-color:#ddd7e6}
  .pv.mine.bad .ol{color:var(--bad)}
  .pv.mine.good{background:var(--good-bg);border-color:#ddd7e6}
  .pv.mine.good .ol{color:var(--good)}
  .pv-note{font-size:.85rem;color:var(--ink-soft);margin:4px 2px 0;word-break:keep-all}
  .pv-note:empty{display:none}

  /* 보기 */
  .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .choices.one{grid-template-columns:1fr}
  .choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fdfcf9;border:2.5px solid #ddd7e6;border-radius:18px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #ddd7e6;min-height:58px;transition:transform .12s,box-shadow .12s,border-color .12s,background .2s,opacity .2s}
  .choice:hover:not(:disabled){border-color:#c9c2d5;transform:translateY(-2px);box-shadow:0 6px 0 #c9c2d5}
  .choice:disabled{cursor:default}
  .choice:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
  .choice .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700}
  .choice:nth-child(1) .num{background:#ddd7e6}.choice:nth-child(2) .num{background:#ddd7e6}.choice:nth-child(3) .num{background:#ddd7e6}
  .choice .word{flex:1;min-width:0;font-family:var(--mono);font-weight:700;font-size:1.08rem;white-space:pre}
  .choices.one .choice .word{white-space:normal;overflow-wrap:anywhere}
  .choice .mark{flex:none;font-weight:700;font-size:1.2rem}
  .choice.correct{background:var(--good-bg);border-color:#ddd7e6;box-shadow:0 4px 0 #ddd7e6}
  .choice.correct .num{background:var(--good);color:#ffffff}.choice.correct .mark{color:var(--good)}
  .choice.wrong{background:var(--bad-bg);border-color:#ddd7e6;box-shadow:0 4px 0 #ddd7e6}
  .choice.wrong .num{background:var(--bad);color:#ffffff}.choice.wrong .mark{color:var(--bad)}
  .choice.dim{opacity:.5}
  .choice.shake{animation:shake .4s ease}
  .keyhint{font-size:.82rem;color:var(--ink-soft);margin-top:10px}

  .hint-box{background:#faf7ef;border:2px solid #ddd7e6;border-radius:16px;padding:10px 14px;margin-top:14px;word-break:keep-all}
  .hint-box b{color:#725d28}
  .hint-box p+p{margin-top:6px}

  .feedback{margin-top:14px;border-radius:18px;padding:14px 18px;border:2.5px solid;word-break:keep-all;animation:pop .3s ease}
  .feedback.good{background:var(--good-bg);border-color:#ddd7e6;color:#1f3b2d}
  .feedback.bad{background:var(--bad-bg);border-color:#ddd7e6;color:#592f36}
  .fb-title{font-weight:800;font-size:1.15rem;margin-bottom:4px}
  .fb-sub{font-size:.95rem}
  .fb-sub+.fb-sub{margin-top:4px;opacity:.85;font-size:.9rem}
  .explain{background:#ffffff;border-radius:14px;padding:10px 14px;margin-top:8px;color:var(--ink);border:2px solid #ddd7e6}
  .explain b{color:var(--good)}
  .actions{display:flex;justify-content:flex-end;margin-top:16px}

  /* 결과 */
  .trophy{font-size:4rem;display:inline-block;animation:bob 2.6s ease-in-out infinite}
  #result h2{font-weight:800;font-size:1.5rem}
  .final-score{font-weight:800;font-size:3.6rem;line-height:1.1;color:var(--pink-deep);margin:8px 0 2px}
  .final-score small{font-size:1.4rem;color:var(--ink-soft);font-weight:700}
  .final-msg{font-size:1.05rem;margin:6px 0 16px;word-break:keep-all}
  .stage-result{list-style:none;display:grid;gap:8px;margin:0 0 20px}
  .stage-result li{display:flex;align-items:center;gap:10px;background:#fbfafd;border:2px solid #ddd7e6;border-radius:14px;padding:9px 14px}
  .stage-result .nm{flex:1}
  .stage-result .meter{width:90px;height:10px;border-radius:999px;background:#f2eef7;overflow:hidden}
  .stage-result .meter span{display:block;height:100%;background:var(--good)}
  .stage-result .ct{font-weight:700;width:44px;text-align:right}
  .wrong-list{font-size:.92rem;color:var(--ink-soft);margin:-8px 0 20px;word-break:keep-all}
  .result-actions{display:flex;gap:12px;flex-wrap:wrap}
  footer{color:var(--ink-soft);font-size:.85rem;margin-top:22px;padding-left:4px}
  .credit{display:block;margin-top:6px;font-weight:700;color:var(--ink);letter-spacing:.01em}

  /* 행간: 본문 140%, 문제 112%, 힌트 130% (KoPub 기준) */
  .question{line-height:1.12 !important}
  .hint-box,.hint-box p{line-height:1.3 !important}

  /* 난이도 표시 (문제 맨 아래, 노란 별만) */
  .diff-row{display:flex;align-items:center;gap:8px;margin-top:22px;padding-top:12px;border-top:1px solid #ddd7e6;font-size:.85rem;color:var(--ink-soft)}
  .diff-row:empty{display:none}
  .diff-row .stars{font-size:1.15rem;letter-spacing:2px;color:#efb72d;line-height:1}
  .diff-row .stars .off{color:#cac3cf}
  .diff-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.88rem;color:var(--ink-soft);margin:0 0 18px}
  .diff-legend .it{display:inline-flex;align-items:center;gap:4px}
  .diff-legend .st{color:#efb72d;letter-spacing:1px}

  .particle{position:fixed;pointer-events:none;font-size:20px;z-index:50;animation:fly .9s ease-out forwards;color:#efb72d;font-family:var(--font)}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--rot));opacity:0}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  @keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.3}to{transform:none;opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
  @media (max-width:560px){
    body{padding:18px 16px 36px}
    .card{padding:20px 16px;border-radius:22px}
    h1{font-size:1.4rem}
    .mascot{width:52px;height:52px;font-size:1.9rem;border-radius:16px}
    .question{font-size:1.1rem}
    pre.code{font-size:.9rem;padding:36px 14px 14px}
    .final-score{font-size:3rem}
    .keyhint{display:none}
    .choices{grid-template-columns:1fr}
    .pv-wrap{grid-template-columns:1fr}
    .stage-list{grid-template-columns:1fr}
  }
  /* 단계 번호: 분류 표시라서 버튼처럼 보이지 않게, 밝은 원 + 짙은 로마 숫자 */
  .stage-list .sn{width:38px;height:38px;background:#fffdf9;border:none;box-shadow:none;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:.9rem;letter-spacing:-.03em;line-height:1}
  .stage-list .sn[data-n="4"]{font-size:.74rem}
  .stage-list .sn[data-n="5"]{font-size:.62rem}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mascot" aria-hidden="true">📐</div>
    <div>
      <h1>CSS <span class="accent">레이아웃</span> 퀴즈</h1>
      <p>디자인 시안을 웹 화면으로! 글자·여백·이미지·배치를 30문제로 익힘.</p>
    </div>
  </header>

  <!-- 시작 -->
  <section id="start" class="card">
    <div class="hero" aria-hidden="true">📐</div>
    <h2>목표 화면과 똑같이 만들어 볼까요?</h2>
    <p class="intro">CSS를 처음 배워도 괜찮음. 문제마다 <b>알아두기</b> 설명과 <b>💡 힌트</b>가 함께 보임. 피그마와 비교하는 설명도 함께 있음.</p>
    <ul class="how">
      <li><span>🎯</span><div><b>목표 화면</b>과 같은 모양이 되도록 코드의 노란 빈칸에 들어갈 낱말을 고르면 됨</div></li>
      <li><span>🖥️</span><div>고른 보기는 <b>내 화면</b>에 바로 적용됨. 틀린 보기를 고르면 화면이 어떻게 달라지는지 볼 수 있음</div></li>
      <li><span>📱</span><div>이미지와 반응형 문제는 <b>휴대폰</b>과 <b>PC</b> 화면을 함께 보여 줌. 두 화면에서 모두 알맞게 보이는지 확인하면 됨</div></li>
      <li><span>🔁</span><div>틀린 보기는 빨갛게 표시되고, 남은 보기 중에서 다시 고를 수 있음</div></li>
    </ul>
    <p class="base-note">미리보기 속 상자의 색과 글꼴은 보기 쉽게 미리 정해 두었음. 문제에서는 코드에 보이는 부분만 생각하면 됨.</p>
    <ul class="stage-list" id="stageList"></ul>
    <div class="diff-legend"><span>난이도</span><span class="it"><span class="st">★</span>쉬움</span><span class="it"><span class="st">★★</span>보통</span><span class="it"><span class="st">★★★</span>어려움</span></div>
    <button class="btn" id="startBtn" type="button">시작하기 ▶</button>
  </section>

  <!-- 문제 -->
  <section id="quiz" class="card hidden">
    <div class="status">
      <div class="progress-text"><b id="qNum">1</b> / <span id="qTotal">30</span> 번째 문제</div>
      <div class="score-badge" id="scoreBadge"><span class="sb-star">★</span><span id="score">0</span>개 정답</div>
    </div>
    <div class="bar"><span id="bar"></span></div>

    <span class="tag" id="qStage"></span>
    <div class="concept"><span class="ct">📘 알아두기 · <span id="qTopic"></span></span><span id="qConcept"></span></div>
    <h2 class="question" id="qText"></h2>
    <pre class="code" id="qCode"></pre>

    <div class="pv-wrap">
      <div class="pv target">
        <div class="ol">🎯 목표 화면</div>
        <div class="pv-body" id="pvTarget" role="img" aria-label="목표 화면 미리보기"></div>
      </div>
      <div class="pv mine" id="pvMineBox">
        <div class="ol">🖥️ 내 화면 <span class="st" id="pvMineState"></span></div>
        <div class="pv-body" id="pvMine" role="img" aria-label="내 코드 결과 미리보기"></div>
      </div>
    </div>
    <p class="pv-note" id="pvNote"></p>

    <div class="choices" id="choices"></div>
    <p class="keyhint">키보드 1·2·3으로도 고를 수 있음</p>

    <div class="hint-box" id="hintBox"></div>
    <div class="feedback hidden" id="feedback" aria-live="polite"></div>
    <div class="actions"><button class="btn hidden" id="nextBtn" type="button">다음 문제 ▶</button></div>
    <div class="diff-row" id="qDiff"></div>
  </section>

  <!-- 결과 -->
  <section id="result" class="card hidden">
    <div class="trophy" id="resultEmoji" aria-hidden="true">🏆</div>
    <h2 id="resultTitle">레이아웃 퀴즈 끝! 수고 많았음</h2>
    <div class="final-score"><span id="finalScore">0</span><small> / <span id="finalTotal">30</span>개</small></div>
    <p class="final-msg" id="finalMsg"></p>
    <ul class="stage-result" id="stageResult"></ul>
    <p class="wrong-list" id="wrongList"></p>
    <div class="result-actions">
      <button class="btn" id="retryWrongBtn" type="button">❗ 틀린 문제만 다시 풀기</button>
      <button class="btn sub" id="retryAllBtn" type="button">🔄 처음부터 다시 풀기</button>
    </div>
  </section>

  <footer>HTML 3단계 · 디자인 도전 · CSS 30문제 · 3지 선다<span class="credit">by Make a long term memory</span></footer>
</div>

<script>
/* =========================================================
   단계 정보
   ========================================================= */
const STAGES = [
  { name: "CSS 규칙",               color: ["#ecf3f9", "#415e75"] },
  { name: "글자 크기와 행간",        color: ["#f3edfb", "#5b4a94"] },
  { name: "상자와 여백",             color: ["#ede4cd", "#635223"] },
  { name: "화면 크기와 이미지",      color: ["#e8f3ee", "#2f5946"] },
  { name: "Flex = 오토 레이아웃",    color: ["#f8eaf0", "#94536d"] },
  { name: "Grid = 레이아웃 그리드",  color: ["#edf0f9", "#4a5793"] },
  { name: "반응형과 완성",           color: ["#e7f1f5", "#2b5a6a"] }
];

/* =========================================================
   미리보기에만 쓰는 기본 모양 (학생에게 보이는 코드에는 없어요)
   - 상자 색, 글꼴처럼 '보기 쉽게' 하는 것만 넣어요
   - 문제에서 묻는 속성(여백, 배치, 이미지 크기 등)은 여기에 넣지 않아요
   ========================================================= */
const BASE = `
.box,.banner,.logo,.content{padding:10px 12px;font-weight:700;color:#274a70}
.banner h2{margin:0 0 4px;font-size:20px}
.banner p{margin:0;font-weight:500}
.card{background:#ffffff}
.card p{margin:0}
.btn{font-weight:700;text-align:center}
.row,.tabs,.cards,.header,.page,.gallery,.layout,.works,header{background:#f3f5f9;border:1px solid #cdd8e4;border-radius:10px;padding:6px}
header{margin-bottom:8px}
footer{margin-top:8px;color:#686472;font-size:12px}
.row>div,.tabs>div,.cards>div,.header>div,.page>div,.gallery>div,.layout>div,.works>div,header>div{background:#d9e6f4;border:1.5px solid #3a7fc3;border-radius:8px;padding:7px 12px;font-weight:700;color:#274a70}
.gallery>.big{background:#f8eaf0;border-color:#bd426e;color:#94536d}
.row>.icon{width:48px;height:48px;padding:0;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#efb72d;background:#fdf7e4;border-color:#d3b981}
.ruler{width:200px;box-sizing:border-box;border-left:2px solid #686472;border-right:2px solid #686472;background:#ebe7f0;color:#55515f;font-size:11px;font-weight:700;padding:1px 6px;margin-bottom:6px}
`;

/* =========================================================
   미리보기용 그림 파일
   - 코드에는 poster.jpg처럼 파일 이름만 보이고, 미리보기에서만 이 그림으로 바꿔 그려요
   - 그림 크기(가로 × 세로 픽셀)가 실제 파일처럼 정해져 있어요
   ========================================================= */
const svgFile = (w, h, body) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${body}</svg>`);
const SVG_FONT = "font-family='Arial,Helvetica,sans-serif' font-weight='700'";

<div class="card">카드 2</div>`,

    h:["간격이 생겨야 할 곳은 카드 테두리의 안쪽일까요, 바깥쪽일까요?","앞 문제에서 테두리 안쪽 여백은 `padding`이었어요. 이번에는 바깥쪽이에요."],
    m:{"padding-bottom":"`padding-bottom`은 카드 '안쪽' 아래 여백이에요. 카드가 길어졌을 뿐 두 카드는 여전히 붙어 있어요.","border-bottom":"`border-bottom: 16px`은 아래 테두리 설정이에요. 선 모양이 빠져서 아래 테두리가 사라졌어요."},
    e:"`margin-bottom`은 테두리 바깥 아래쪽에 투명한 간격을 만들어요. <b>padding은 상자 안, margin은 상자 밖</b>이라고 기억해요." },

  { s:2, topic:"알약 모양 버튼",
    concept:"모서리를 둥글게 깎는 속성은 `border-radius`예요. 값은 모서리를 깎는 원의 반지름이에요. `%`로 쓰면 상자의 가로·세로에 각각 비례해서, 가로로 긴 상자에 `50%`를 주면 타원이 돼요. 반지름을 상자 높이의 절반보다 크게 주면 브라우저가 높이의 절반까지만 깎아서 양 끝이 반원이 돼요.",
    fig:"Corner radius 값과 같아요.",
    q:"양 끝이 반원인 '알약 모양' 버튼을 만들려고 해요. 버튼 높이가 바뀌어도 늘 알약 모양이 되게 하려면 빈칸에 들어갈 값은?",
    code:`<style>
  .btn {
    width: 160px;
    padding: 10px 24px;
    background: #3a7fc3;
    color: #ffffff;
    border-radius: ___;
  }
</style>
<div class="btn">작품 보러 가기</div>`,
    opts:["999px","50%","0"],
    h:["`%`는 가로와 세로에 각각 비례해요. 가로로 긴 버튼에 50%를 주면 어떤 모양이 될까요?","반지름을 버튼 높이의 절반보다 '충분히 크게' 주면 높이가 바뀌어도 양 끝이 반원이에요."],
    m:{"50%":"가로·세로에 각각 비례해서 깎여 타원이 되었어요. 양 끝이 반원이 아니에요.","0":"`0`은 깎지 않는다는 뜻이라 네모 버튼 그대로예요."},
    e:"`border-radius: 999px`처럼 아주 큰 값을 주면 높이의 절반까지만 깎여서 양 끝이 반원인 알약 모양이 돼요. 버튼 크기가 바뀌어도 늘 같은 모양이라 편해요. 이 퀴즈의 버튼들도 이렇게 만들었어요." },

  { s:2, topic:"실제 크기 계산",
    concept:"CSS의 `width`는 기본으로 '내용' 부분만의 너비예요. 그래서 `width: 200px`에 `padding: 20px`과 테두리 2px을 주면 화면에서는 200 + 20 + 20 + 2 + 2 = 244px이 돼요. `box-sizing` 속성으로 width에 어디까지 포함할지 바꿀 수 있어요. 기본값은 `content-box`(내용만)예요.",
    fig:"프레임의 W 값은 패딩까지 포함한 크기예요.",
    q:"회색 자는 200px이에요. 여백과 테두리를 줘도 카드가 자와 똑같이 200px이 되게 하려면 빈칸에 들어갈 값은?",
    code:`<style>
  .card {
    width: 200px;
    padding: 20px;
    border: 2px solid #3a7fc3;
    box-sizing: ___;
  }
</style>
<div class="ruler">200px</div>
<div class="card">200px 카드</div>`,
    opts:["border-box","content-box","padding-box"],
    h:["지금 카드가 자보다 긴 이유는 width가 '내용'만의 너비이기 때문이에요.","보기는 모두 '어디까지를 width에 넣을지'를 뜻해요. 상자의 가장 바깥선인 테두리(border)까지 포함해야 해요."],
    m:{"content-box":"`content-box`는 기본값이라 아무것도 바뀌지 않아요. 여전히 내용만 200px이에요.","padding-box":"`padding-box`는 지금 브라우저에서 쓰지 않는 값이라 무시돼요."},
    e:"`box-sizing: border-box`로 바꾸면 width 안에 여백과 테두리까지 포함돼요. 피그마 시안의 크기를 그대로 옮기기 쉬워서, 실무에서는 CSS 맨 처음에 `* { box-sizing: border-box; }`로 모든 요소에 적용해 두는 경우가 많아요." },

  /* ---------- 4단계 · 화면 크기와 이미지 ---------- */
  { s:3, topic:"본문 최대 너비", both:true,
    concept:"PC 화면은 아주 넓어서 글이 끝까지 길게 늘어지면 읽기 힘들어요. 그래서 본문 상자에 `max-width`(최대 너비)를 정해요. PC에서는 그 이상 넓어지지 않고, 휴대폰처럼 좁은 화면에서는 화면 폭에 맞춰 줄어들어요. `margin: 0 20px`처럼 값을 두 개 쓰면 앞은 위아래, 뒤는 좌우 여백이고, 값에 `auto`를 쓰면 브라우저가 남은 공간을 알아서 채워요.",
    fig:"오토 레이아웃의 최대 너비(Max width)와 같아요.",
    q:"본문 상자가 PC에서는 가운데에 놓이고, 휴대폰에서는 화면 폭에 꽉 차게 하려고 해요. 빈칸에 들어갈 값은?",
    code:`<style>
  .content {
    max-width: 400px;
    margin: 0 ___;
    background: #d9e6f4;
  }
</style>
<div class="content">본문 영역</div>`,
    opts:["auto","center","50%"],
    h:["`center`는 글자 정렬에 쓰는 값이라 margin에는 쓸 수 없어요.","왼쪽과 오른쪽 여백이 남은 공간을 똑같이 나눠 가지면 상자는 어디에 놓일까요?"],
    m:{"center":"`margin`에는 `center`라는 값이 없어서 무시돼요. PC에서 상자가 그대로 왼쪽에 있죠?","50%":"좌우 여백이 각각 부모 폭의 절반이 되어, 본문 상자가 아주 좁아지고 글자가 한 자씩 세로로 쌓였어요."},
    e:"`max-width: 400px`와 `margin: 0 auto`를 함께 쓰면 PC에서는 400px로 가운데에, 휴대폰에서는 화면 폭에 맞춰 꽉 차요. 웹사이트 본문 대부분이 이렇게 만들어져요. 너비를 `width: 400px`로 고정하면 휴대폰에서 화면 밖으로 삐져나와요." },

  { s:3, topic:"이미지가 넘치지 않게", both:true,
    concept:"이미지는 기본으로 원래 크기(가로 픽셀 수)대로 보여요. 그래서 PC에 맞춰 만든 큰 이미지를 휴대폰에서 열면 화면 밖으로 삐져나와요. 이미지 최대 너비를 '부모 상자의 %'로 정하면 화면이 좁을 때 함께 줄어들어요. `height: auto`를 함께 쓰면 세로도 비율에 맞춰 줄어들어요.",
    q:"가로 600px짜리 포스터가 휴대폰 화면 밖으로 삐져나와요. 부모 폭을 넘지 않게 하려면 빈칸에 들어갈 값은?",
    code:`<style>
  img {
    max-width: ___;
    height: auto;
  }
</style>
<img src="poster.jpg" alt="졸업전시 포스터">`,
    opts:["100%","600px","100vw"],
    h:["지금 포스터는 원래 크기 600px 그대로라서 320px 휴대폰보다 커요.","`vw`는 화면 전체 폭에 대한 비율이에요. 화면 가장자리 여백까지 포함한 폭이라 부모 상자보다 넓어요."],
    m:{"600px":"원래 크기와 같아서 아무것도 바뀌지 않았어요. 휴대폰에서 여전히 삐져나와요.","100vw":"`100vw`는 화면 전체 폭이라 가장자리 여백만큼 밖으로 조금 삐져나왔어요. 부모 상자를 기준으로 정해야 해요."},
    e:"`max-width: 100%`는 '부모 폭보다 커지지 마'라는 뜻이에요. 휴대폰에서는 화면에 맞춰 줄어들고, PC에서는 원래 크기 600px을 넘지 않아요. 반응형 웹의 거의 모든 이미지에 넣는 기본 설정이에요." },

  { s:3, topic:"width와 max-width", both:true, start:"width",
    concept:"`width: 100%`와 `max-width: 100%`는 비슷해 보이지만 달라요. `width: 100%`는 늘 부모 폭에 '맞추기'라서 작은 이미지도 억지로 늘어나요. `max-width: 100%`는 부모 폭을 '넘지 않기'라서 원래 크기보다 커지지 않아요. 사진이나 로고를 원래 크기보다 늘리면 흐릿하게 깨져 보여요.",
    q:"가로 360px짜리 로고가 PC 화면에서 원래보다 크게 늘어났어요. 휴대폰에서는 줄어들되, PC에서는 원래 크기를 지키려면 빈칸에 들어갈 속성은?",
    code:`<style>
  img {
    ___: 100%;
    height: auto;
  }
</style>
<img src="logo.png" alt="스튜디오 로고">`,
    opts:["max-width","width","min-width"],
    h:["지금 '내 화면'은 `width: 100%`예요. PC에서 로고가 부모 폭에 맞춰 늘어났죠?","'커지는 것을 막는' 속성이 필요해요. 최대(maximum)와 최소(minimum) 중 어느 쪽일까요?"],
    m:{"width":"`width: 100%`는 늘 부모 폭에 맞춰서 PC에서 로고가 원래보다 크게 늘어나요. 지금 코드 그대로예요.","min-width":"`min-width: 100%`는 '부모 폭보다 작아지지 마'라서 PC에서 늘어나고, 휴대폰에서는 원래 크기 그대로 삐져나왔어요."},
    e:"`max-width: 100%`는 원래 크기보다 커지지 않으면서 좁은 화면에서는 줄어들어요. 로고, 아이콘, 작은 사진은 늘 이렇게 써요. 화면 폭을 꽉 채워야 하는 큰 배너 사진은 처음부터 PC 폭보다 큰 이미지를 준비하고 `width: 100%`를 써요." },

  { s:3, topic:"사진을 칸에 채우기",
    concept:"정사각형 사진을 가로로 긴 칸에 넣으면 사진이 찌그러져요. `object-fit`으로 사진을 칸에 맞추는 방법을 정해요. `fill`(기본값)은 칸에 맞게 늘려서 찌그러뜨리기, `contain`은 사진 전체가 보이게 줄이고 남는 곳은 비우기, `cover`는 비율을 지키며 칸을 꽉 채우고 넘치는 부분은 잘라내기예요.",
    q:"작품 썸네일 칸(높이 120px)에 정사각형 사진을 넣었더니 찌그러졌어요. 비율을 지키면서 빈틈없이 꽉 채우려면 빈칸에 들어갈 값은?",
    code:`<style>
  .thumb {
    width: 100%;
    height: 120px;
    object-fit: ___;
  }
</style>
<img class="thumb" src="photo.jpg" alt="작품 사진">`,
    opts:["cover","contain","fill"],
    h:["'빈틈없이 꽉 채우기'와 '사진 전체 보여 주기'는 함께 할 수 없어요. 꽉 채우면 넘치는 부분은 어떻게 될까요?","`fill`은 기본값이라 지금처럼 찌그러져요."],
    m:{"contain":"사진 전체가 보이도록 줄어들어서 양옆에 빈 공간이 생겼어요. 꽉 채우지 못했어요.","fill":"`fill`은 기본값이라 사진이 그대로 찌그러져 있어요."},
    e:"`object-fit: cover`는 비율을 지키며 칸을 꽉 채우고 넘치는 부분은 잘라내요. 작품 목록, 프로필 사진처럼 같은 크기의 칸에 여러 사진을 넣을 때 꼭 써요. <b>주의!</b> 피그마 이미지 채우기의 'Fill'은 CSS의 `cover`, 'Fit'은 `contain`과 같아요. CSS의 `fill`은 찌그러뜨리기라서 이름이 엇갈려요." },

  { s:3, topic:"비율 고정 aspect-ratio", both:true,
    concept:"썸네일 높이를 `120px`처럼 고정하면 PC에서는 납작하고 휴대폰에서는 길쭉해 보여요. `aspect-ratio`로 가로 : 세로 비율을 정하면 화면 폭이 바뀌어도 그 비율이 그대로 유지돼요. 값은 `가로 / 세로`처럼 슬래시(/)를 써서 적어요.",
    fig:"비율 고정(Constrain proportions)을 켜고 크기를 바꾸는 것과 비슷해요.",
    q:"작품 썸네일을 휴대폰과 PC 모두에서 유튜브 영상처럼 가로 16 : 세로 9 비율로 보이게 하려고 해요. 빈칸에 들어갈 값은?",
    code:`<style>
  .thumb {
    width: 100%;
    aspect-ratio: ___;
    object-fit: cover;
  }
</style>
<img class="thumb" src="photo.jpg" alt="작품 사진">`,
    opts:["16 / 9","16:9","9 / 16"],
    h:["비율 값은 가로를 먼저, 세로를 나중에 써요.","CSS 비율에는 콜론(:)이 아니라 나눗셈처럼 생긴 슬래시(/)를 써요."],
    m:{"16:9":"평소에 쓰는 `16:9` 모양은 CSS에서 잘못된 값이라 무시돼요. 사진이 원래 비율(정사각형) 그대로예요.","9 / 16":"가로와 세로 순서가 바뀌어서 세로로 긴 썸네일이 되었어요. 쇼츠·릴스 같은 세로 영상 비율이에요."},
    e:"`aspect-ratio: 16 / 9`는 폭이 얼마든 높이를 폭의 9/16로 맞춰요. 휴대폰에서는 작게, PC에서는 크게 보이지만 비율은 같아요. 정사각형은 `1 / 1`, 인스타그램 세로 게시물은 `4 / 5`예요." },

  { s:3, topic:"화면별로 다른 이미지", both:true,
    concept:"휴대폰은 세로로 길고 PC는 가로로 넓어서, 같은 배너도 화면에 맞게 따로 디자인하는 경우가 많아요. `<picture>` 태그 안에 `<source>`를 넣고 화면 조건(`media`)과 그때 쓸 이미지 파일을 적으면, 브라우저가 화면에 맞는 이미지를 골라 보여 줘요. 맞는 조건이 없으면 맨 아래 `<img>`의 이미지를 보여 줘요.",
    q:"휴대폰(600px 이하)에서는 세로형 배너를, PC에서는 가로형 배너를 보여 주려고 해요. `<source>`에서 이미지 파일을 알려 주는 빈칸의 속성은?",
    code:`<style>
  img { max-width: 100%; }
</style>
<picture>
  <source media="(max-width: 600px)"
          ___="banner-mobile.jpg">
  <img src="banner-pc.jpg" alt="졸업전시 배너">
</picture>`,
    opts:["srcset","src","href"],
    h:["`<img>`는 파일 하나라서 `src`를 쓰지만, `<source>`는 파일 여러 개(set)를 적을 수 있어서 속성 이름이 조금 달라요.","`href`는 링크(`<a>`)가 이동할 주소예요."],
    m:{"src":"`<source>`에는 `src`를 쓰지 않아서 무시돼요. 휴대폰에서도 PC용 가로 배너가 보이죠?","href":"`href`는 링크의 이동 주소라서 무시돼요. 휴대폰에서도 PC용 가로 배너가 보여요."},
    e:"`<source srcset=\"…\">`의 이미지는 `media` 조건이 맞을 때만 쓰여요. 그래서 휴대폰에서는 세로형, PC에서는 가로형 배너가 보여요. `srcset`에는 `logo.png 1x, logo@2x.png 2x`처럼 해상도별 파일도 적을 수 있어요. 피그마에서 @2x로 내보낸 이미지를 선명한 레티나 화면에 쓸 때 이렇게 해요." },

  /* ---------- 5단계 · Flex = 오토 레이아웃 ---------- */
  { s:4, topic:"가로로 나란히",
    concept:"`<div>`는 기본으로 한 줄을 통째로 차지해서 위에서 아래로 쌓여요. 상자들을 가로로 나란히 놓으려면 `display: flex`를 써요. 이때 나란히 설 상자들 자신이 아니라, 그 상자들을 감싸고 있는 <b>부모</b> 상자에 줘야 해요.",
    fig:"부모 프레임에 오토 레이아웃(Shift + A)을 켜고 방향을 '가로'로 두는 것과 같아요.",
    q:"탭 3개를 가로로 나란히 놓으려고 해요. `display: flex`를 줄 상자를 고르는 빈칸에 들어갈 선택자는?",
    code:`<style>
  ___ { display: flex; }
</style>
<div class="tabs">
  <div class="tab">포스터</div>
  <div class="tab">편집</div>
  <div class="tab">웹</div>
</div>`,
    opts:[".tabs",".tab","#tabs"],
    h:["가로로 줄 서야 하는 것은 탭 3개예요. 그 탭들을 감싸고 있는 상자는 어느 것인가요?","`.tab`에 주면 탭 하나하나의 '안쪽'이 Flex가 돼요. 탭 안에는 글자뿐이라 바뀌는 게 없어요."],
    m:{".tab":"탭 하나하나의 안쪽이 Flex가 되었을 뿐, 탭들은 여전히 위아래로 쌓여 있어요. 부모에 줘야 해요.","#tabs":"`#`은 id를 고르는 기호예요. 이 상자는 class라서 아무것도 바뀌지 않았어요."},
    e:"부모 `.tabs`에 `display: flex`를 주면 자식인 탭들이 가로로 나란히 서요. 이때 부모를 '플렉스 컨테이너', 자식을 '플렉스 아이템'이라고 불러요. 피그마에서도 오토 레이아웃은 부모 프레임에 켜죠." },

  { s:4, topic:"사이 간격 gap",
    concept:"Flex로 나란히 선 상자들 사이를 띄울 때는, 상자마다 margin을 주지 않고 부모에 '틈'이라는 뜻의 속성 하나만 쓰면 돼요. 이 속성은 상자와 상자 <b>사이</b>에만 간격을 만들고, 바깥 테두리 쪽에는 만들지 않아요.",
    fig:"오토 레이아웃의 '아이템 사이 간격(Spacing between items)'과 같아요.",
    q:"탭 사이에 12px씩 틈을 두려고 해요. 빈칸에 들어갈 속성은?",
    code:`<style>
  .tabs {
    display: flex;
    ___: 12px;
  }
</style>
<div class="tabs">
  <div>포스터</div>
  <div>편집</div>
  <div>웹</div>
</div>`,
    opts:["gap","padding","space"],
    h:["간격은 바깥 테두리 쪽이 아니라 탭과 탭 '사이'에만 생겨야 해요.","`padding`은 '안쪽 여백'이에요. 부모에 주면 어디에 여백이 생길까요?"],
    m:{"padding":"부모의 안쪽 여백이 커져서 바깥 테두리 쪽만 넓어졌어요. 탭끼리는 여전히 붙어 있어요.","space":"`space`라는 속성은 없어요. 브라우저가 무시했어요."},
    e:"`gap`은 아이템 사이에만 간격을 만들어요. 피그마의 아이템 간격 값을 그대로 옮기면 돼요. Grid 단계에서도 똑같이 써요." },

  { s:4, topic:"양 끝으로 벌리기",
    concept:"Flex 아이템들을 가로 방향으로 어떻게 놓을지는 `justify-content`로 정해요. `flex-start`는 왼쪽에 모으기, `center`는 가운데에 모으기, `flex-end`는 오른쪽에 모으기, `space-between`은 첫째와 마지막을 양 끝에 붙이고 남은 공간을 사이에 고르게 나누기예요.",
    fig:"아이템 간격을 'Auto'로 두면 양 끝으로 벌어져요.",
    q:"로고는 왼쪽 끝, 메뉴는 오른쪽 끝에 있는 머리글을 만들려고 해요. 빈칸에 들어갈 값은?",
    code:`<style>
  .header {
    display: flex;
    justify-content: ___;
  }
</style>
<div class="header">
  <div>MIRIM</div>
  <div>작품 · 소개</div>
</div>`,
    opts:["space-between","center","flex-end"],
    h:["두 아이템이 한곳에 모이는 게 아니라 서로 반대쪽 끝으로 벌어져야 해요.","`center`는 둘을 가운데로 모으고, `flex-end`는 둘 다 오른쪽으로 보내요."],
    m:{"center":"두 아이템이 가운데에 모였어요. 양 끝으로 벌어지지 않았죠?","flex-end":"두 아이템이 모두 오른쪽 끝으로 몰렸어요."},
    e:"`space-between`은 첫 아이템을 왼쪽 끝, 마지막 아이템을 오른쪽 끝에 붙이고 남은 공간을 사이에 나눠요. 웹사이트 머리글(로고 + 메뉴)에 가장 많이 쓰는 배치예요." },

  { s:4, topic:"세로 가운데 맞추기",
    concept:"Flex에는 두 방향이 있어요. 아이템이 줄 서는 가로 방향을 <b>주축</b>, 그와 직각인 세로 방향을 <b>교차축</b>이라고 해요. `justify-content`는 주축(가로) 정렬, `align-items`는 교차축(세로) 정렬을 맡아요. 둘 다 `center` 값을 쓸 수 있어요.",
    fig:"오토 레이아웃 정렬(Alignment) 칸에서 세로 가운데를 고르는 것과 같아요.",
    q:"키가 큰 아이콘 옆의 글자가 위쪽에 붙어 있어요. 글자를 아이콘의 세로 가운데에 맞추려면 빈칸에 들어갈 속성은?",
    code:`<style>
  .row {
    display: flex;
    gap: 10px;
    ___: center;
  }
</style>
<div class="row">
  <div class="icon">★</div>
  <div>새 작품 올리기</div>
</div>`,
    opts:["align-items","justify-content","text-align"],
    h:["지금 글자를 옮겨야 하는 방향은 가로일까요, 세로일까요?","알아두기에서 세로(교차축) 정렬을 맡는 속성을 찾아요."],
    m:{"justify-content":"`justify-content`는 가로(주축) 정렬이에요. 아이템이 가로 가운데로 모였지만 글자는 여전히 위에 붙어 있어요.","text-align":"`text-align`은 글자를 가로로 정렬하는 속성이라 세로 위치는 그대로예요."},
    e:"`align-items: center`는 아이템들을 교차축(세로) 가운데로 맞춰요. 아이콘 + 글자, 사진 + 이름처럼 높이가 다른 것을 나란히 놓을 때 꼭 필요해요. <b>가로는 justify, 세로는 align</b>으로 짝지어 기억해요." },

  { s:4, topic:"방향 바꾸기",
    concept:"Flex 아이템은 기본으로 가로 방향으로 줄을 서요. `flex-direction` 속성으로 줄 서는 방향을 바꿀 수 있어요. 값에는 `row`(가로줄), `row-reverse`(가로줄 거꾸로), `column`(기둥) 등이 있어요.",
    fig:"오토 레이아웃 방향을 '세로(↓)'로 바꾸는 것과 같아요.",
    q:"작품 카드들을 위에서 아래로 쌓으려고 해요. Flex는 그대로 두고 방향만 바꾸려면 빈칸에 들어갈 값은?",
    code:`<style>
  .cards {
    display: flex;
    gap: 8px;
    flex-direction: ___;
  }
</style>
<div class="cards">
  <div>포스터</div>
  <div>편집</div>
  <div>웹</div>
</div>`,
    opts:["column","row-reverse","vertical"],
    h:["건물의 기둥은 어느 방향으로 서 있나요?","`vertical`(세로)은 뜻은 맞지만 알아두기에 나온 값이 아니에요."],
    m:{"row-reverse":"순서만 거꾸로(웹, 편집, 포스터) 바뀌고 오른쪽으로 붙었을 뿐 여전히 가로줄이에요.","vertical":"'세로'라는 뜻이지만 flex-direction에 쓰는 값이 아니라서 무시돼요."},
    e:"`flex-direction: column`은 아이템을 위에서 아래로 쌓아요. 이때는 주축이 세로가 되어 `justify-content`와 `align-items`가 맡는 방향도 서로 바뀌어요. 마지막 단계의 반응형 문제에서 다시 써요." },

  { s:4, topic:"남은 공간 채우기",
    concept:"Flex 아이템에 `flex` 속성으로 숫자를 쓰면 '남은 공간을 몇 몫 가져갈지'를 정해요. `0`이면 하나도 안 가져가요. 몫을 가진 아이템이 하나뿐이면 숫자와 상관없이 남은 공간을 모두 가져가요.",
    fig:"자식의 크기를 'Fill container'로 바꾸는 것과 같은 역할이에요. 'Hug contents'는 내용 크기만큼이에요.",
    q:"왼쪽 메뉴(80px)를 뺀 나머지 공간을 본문이 모두 채우게 하려고 해요. 빈칸에 들어갈 값은?",
    code:`<style>
  .page { display: flex; gap: 8px; }
  .side { width: 80px; }
  .main { flex: ___; }
</style>
<div class="page">
  <div class="side">메뉴</div>
  <div class="main">본문</div>
</div>`,
    opts:["1","0","fill"],
    h:["알아두기에서 `0`은 '남은 공간을 하나도 안 가져가기'였어요.","CSS의 `flex`에는 낱말이 아니라 몫을 나타내는 숫자를 써요."],
    m:{"0":"`0`은 남은 공간을 하나도 안 가져간다는 뜻이라 본문이 글자 크기만큼만 남았어요.","fill":"피그마의 'Fill'과 뜻은 같지만 CSS에는 없는 값이라 무시돼요."},
    e:"`flex: 1`은 '남은 공간을 1몫 가져가기'예요. 몫을 가진 아이템이 본문 하나뿐이라 남은 공간을 모두 채웠어요. 두 아이템에 `flex: 2`와 `flex: 1`을 주면 남은 공간을 2 : 1로 나눠요. 다음 Grid 단계의 `fr`도 같은 생각이에요." },

  /* ---------- 6단계 · Grid = 레이아웃 그리드 ---------- */
  { s:5, topic:"3칸 격자",
    concept:"Flex가 한 줄 배치라면 <b>Grid(그리드)</b>는 가로·세로 칸이 있는 격자 배치예요. 부모에 `display: grid`를 주고, `grid-template-columns`에 칸(열)의 너비를 왼쪽부터 띄어쓰기로 이어 적어요. `fr`은 남은 공간을 나눈 '몫'이에요. 예를 들어 `1fr 1fr`은 똑같은 너비의 2칸이에요.",
    fig:"레이아웃 그리드(Layout grid)의 Columns와 같아요. 단 사이 간격(Gutter)은 CSS의 `gap`이에요.",
    q:"작품 6개를 똑같은 너비의 3칸으로 배치하려고 해요. 빈칸에 들어갈 값은?",
    code:`<style>
  .gallery {
    display: grid;
    gap: 8px;
    grid-template-columns: ___;
  }
</style>
<div class="gallery">
  <div>포스터</div><div>편집</div>
  <div>웹</div><div>영상</div>
  <div>사진</div><div>패키지</div>
</div>`,
    opts:["1fr 1fr 1fr","1fr, 1fr, 1fr","3fr"],
    h:["알아두기 예시 `1fr 1fr`은 너비를 두 번 적어서 2칸이 되었어요.","칸 너비 사이는 쉼표(,)가 아니라 띄어쓰기로 구분해요."],
    m:{"1fr, 1fr, 1fr":"쉼표(,)를 쓰면 잘못된 값이 되어 무시돼요. 칸 사이는 띄어쓰기로 구분해요.","3fr":"`3fr`은 '3몫을 가진 칸 하나'예요. 칸이 하나뿐이라 작품이 한 줄에 하나씩 쌓였어요."},
    e:"`1fr 1fr 1fr`은 남은 공간을 1 : 1 : 1로 나눈 3칸이에요. 작품이 6개라서 3칸씩 2줄이 자동으로 만들어져요. 포트폴리오 갤러리, 상품 목록에 많이 쓰는 배치예요." },

  { s:5, topic:"2 : 1 비율",
    concept:"`fr` 앞의 숫자는 몫의 크기예요. `1fr 3fr`이면 전체를 4몫으로 나눠 첫째 칸이 1몫, 둘째 칸이 3몫을 가져가요. 화면을 단으로 나누는 그리드 시스템과 같은 원리예요.",
    q:"본문이 사이드바보다 두 배 넓은 2단 배치를 만들려고 해요. 본문이 왼쪽이에요. 빈칸에 들어갈 값은?",
    code:`<style>
  .layout {
    display: grid;
    gap: 8px;
    grid-template-columns: ___;
  }
</style>
<div class="layout">
  <div>본문</div>
  <div>사이드바</div>
</div>`,
    opts:["2fr 1fr","1fr 2fr","2 1"],
    h:["칸은 왼쪽부터 순서대로 적어요. 첫째 칸이 본문이에요.","본문의 몫이 사이드바 몫의 두 배가 되게 숫자를 정하고, 몫을 뜻하는 단위를 꼭 붙여요."],
    m:{"1fr 2fr":"순서가 반대예요. 왼쪽 본문이 좁고 오른쪽 사이드바가 넓어졌어요.","2 1":"숫자만 쓰고 단위를 빼면 잘못된 값이 되어 무시돼요. 몫을 나타내는 `fr`을 붙여야 해요."},
    e:"`2fr 1fr`은 전체를 3몫으로 나눠 본문 2몫, 사이드바 1몫이에요. 블로그나 뉴스 사이트에서 흔히 보는 2단 배치예요." },

  { s:5, topic:"repeat로 줄여 쓰기",
    concept:"같은 너비의 칸을 여러 번 적을 때는 `repeat(횟수, 너비)`로 줄여 쓸 수 있어요. 괄호 안에서는 쉼표로 횟수와 너비를 구분해요. 예를 들어 `repeat(2, 1fr)`은 `1fr 1fr`과 같아요.",
    q:"아이콘 4개를 같은 너비의 4칸에 한 줄로 놓으려고 해요. 빈칸에 들어갈 값은?",
    code:`<style>
  .gallery {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(___, 1fr);
  }
</style>
<div class="gallery">
  <div>★</div>
  <div>◆</div>
  <div>●</div>
  <div>▲</div>
</div>`,
    opts:["4","4fr","25%"],
    h:["`repeat` 괄호 안의 첫째 자리는 '몇 번 반복할지'예요.","너비(`1fr`)는 이미 쉼표 뒤 둘째 자리에 있어요. 첫째 자리에는 단위 없이 횟수만 써요."],
    m:{"4fr":"횟수 자리에 단위를 붙이면 잘못된 값이 되어 무시돼요.","25%":"횟수 자리에는 비율이 아니라 반복할 횟수를 써요. 잘못된 값이라 무시됐어요."},
    e:"`repeat(4, 1fr)`은 `1fr 1fr 1fr 1fr`을 줄인 것이에요. 12단 그리드도 `repeat(12, 1fr)` 한 줄이면 만들 수 있어요." },

  { s:5, topic:"두 칸 차지하기",
    concept:"Grid 아이템은 기본으로 한 칸씩 차지해요. 아이템의 자리와 크기는 `grid-column`으로 바꿔요. 값에 숫자만 쓰면 '몇 번째 칸에 놓을지'이고, '가로질러 걸치다'라는 뜻의 `span`과 숫자를 함께 쓰면 '몇 칸에 걸칠지'예요.",
    q:"3칸 갤러리에서 대표작만 2칸 너비로 크게 보여 주려고 해요. 빈칸에 들어갈 값은?",
    code:`<style>
  .gallery {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(3, 1fr);
  }
  .big { grid-column: ___; }
</style>
<div class="gallery">
  <div class="big">대표작</div>
  <div>편집</div><div>웹</div>
  <div>영상</div><div>사진</div>
</div>`,
    opts:["span 2","2","2fr"],
    h:["우리는 대표작의 자리를 옮기려는 게 아니라 넓게 걸치려고 해요.","`fr`은 칸 너비를 정할 때 쓰는 단위라 grid-column에는 쓰지 않아요."],
    m:{"2":"`2`만 쓰면 '2번째 칸에 놓기'라서 대표작이 둘째 칸으로 옮겨졌어요. 너비는 그대로예요.","2fr":"`fr`은 grid-column에 쓰는 값이 아니라서 무시돼요."},
    e:"`grid-column: span 2`는 그 아이템이 2칸에 걸치게 해요. 나머지 작품은 빈자리를 따라 자동으로 채워져요. 잡지처럼 큰 사진과 작은 사진을 섞는 레이아웃에 써요." },

  /* ---------- 7단계 · 반응형과 완성 ---------- */
  { s:6, topic:"다음 줄로 넘기기", both:true,
    concept:"Flex 아이템은 기본으로 한 줄에만 서려고 해서, 화면이 좁아지면 아이템이 찌그러져요. Flex에는 '자리가 모자라면 다음 줄로 넘길지'를 정하는 `flex-wrap` 속성이 있어요. 값 `nowrap`(기본값)은 한 줄 고집하기, `wrap`은 다음 줄로 넘기기예요.",
    fig:"오토 레이아웃의 줄 바꿈(Wrap) 옵션과 같아요.",
    q:"PC에서는 카드 4개가 한 줄로 서고, 휴대폰에서는 자리가 모자라면 다음 줄로 넘어가게 하려고 해요. 빈칸에 들어갈 값은?",
    code:`<style>
  .cards {
    display: flex;
    gap: 8px;
    flex-wrap: ___;
  }
  .cards div { width: 110px; }
</style>
<div class="cards">
  <div>포스터</div>
  <div>편집</div>
  <div>웹</div>
  <div>영상</div>
</div>`,
    opts:["wrap","nowrap","column"],
