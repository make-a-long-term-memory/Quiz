<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>분수 덧셈 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4c2; --bg2:#d6f5ff; --ink:#2b2b44;
  --blue:#4dabf7; --blue-d:#228be6;
  --orange:#ffa94d; --orange-d:#f08c00;
  --purple:#9775fa; --purple-d:#7048e8;
  --pink:#ff6b9d; --pink-d:#e64980;
  --green:#51cf66; --green-d:#2f9e44;
  --red:#ff6b6b; --red-d:#e03131;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden;
}
#app{max-width:1000px;margin:0 auto;min-height:100vh;padding:16px;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}

/* 분수 표시 */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .06em}
.frac .num{padding:0 .2em .05em;border-bottom:.07em solid currentColor;min-width:1.1em;text-align:center}
.frac .den{padding:.05em .2em 0;min-width:1.1em;text-align:center}
.mixed{display:inline-flex;align-items:center}
.whole{font-weight:700;margin:0 .06em}
.mixed .whole{margin-right:.1em}

/* 시작 화면 */
#start{align-items:center;justify-content:center;text-align:center;gap:18px}
.logo{font-size:clamp(80px,16vw,140px);line-height:1;animation:bob 2s ease-in-out infinite}
h1{margin:0;font-size:clamp(40px,8vw,72px);color:var(--pink-d);text-shadow:3px 3px 0 #fff}
.sub{font-size:clamp(22px,3.6vw,32px);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{background:#fff;border-radius:999px;padding:10px 22px;font-size:clamp(18px,2.8vw,24px);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.big-btn{
  font-size:clamp(30px,5vw,44px);padding:20px 56px;border-radius:999px;color:#fff;
  background:var(--pink);box-shadow:0 8px 0 var(--pink-d);transition:transform .08s, box-shadow .08s;
}
.big-btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--pink-d)}
.big-btn.green{background:var(--green);box-shadow:0 8px 0 var(--green-d)}
.big-btn.green:active{box-shadow:0 2px 0 var(--green-d)}
.best{font-size:clamp(18px,2.8vw,24px);min-height:1.4em}

/* 퀴즈 화면 */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pill{background:#fff;border-radius:999px;padding:10px 22px;font-size:clamp(20px,3vw,28px);box-shadow:0 4px 0 rgba(0,0,0,.08);white-space:nowrap;position:relative}
.bar-wrap{flex:1;height:22px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--pink));border-radius:999px;transition:width .4s}
.icon-btn{width:56px;height:56px;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.pop{position:absolute;right:10px;top:-6px;color:var(--green-d);font-size:30px;pointer-events:none;animation:pop .9s ease-out forwards}

.card{background:#fff;border-radius:32px;padding:clamp(10px,2vh,28px) clamp(14px,3vw,28px);box-shadow:0 8px 0 rgba(0,0,0,.08);text-align:center}
.level{display:inline-block;background:#fff3bf;border-radius:999px;padding:6px 18px;font-size:clamp(16px,2.6vw,22px);margin-bottom:6px}
#eq{font-size:clamp(40px,min(10vw,12.5vh),96px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.15em;padding:6px 0}
.op{margin:0 .12em;color:var(--purple-d)}
.op.q{color:var(--pink)}

#grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.opt{
  position:relative;min-height:clamp(88px,14vh,150px);border-radius:28px;color:#fff;
  font-size:clamp(34px,min(8vw,8vh),70px);display:flex;align-items:center;justify-content:center;
  background:var(--c);box-shadow:0 8px 0 var(--cd);transition:transform .08s, box-shadow .08s, opacity .2s;
  text-shadow:0 2px 0 rgba(0,0,0,.15);
}
.opt:nth-child(1){--c:var(--blue);--cd:var(--blue-d)}
.opt:nth-child(2){--c:var(--orange);--cd:var(--orange-d)}
.opt:nth-child(3){--c:var(--purple);--cd:var(--purple-d)}
.opt:nth-child(4){--c:var(--pink);--cd:var(--pink-d)}
.opt:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--cd)}
.opt .tag{position:absolute;left:14px;top:8px;font-size:clamp(16px,2.4vw,22px);background:rgba(255,255,255,.35);border-radius:999px;width:1.9em;height:1.9em;display:flex;align-items:center;justify-content:center;text-shadow:none}
.opt:disabled{cursor:default}
.opt.correct{--c:var(--green);--cd:var(--green-d);animation:jump .5s}
.opt.wrong{--c:var(--red);--cd:var(--red-d);animation:shake .4s}
.opt.dim{opacity:.45}
.opt.correct::after{content:"✔";position:absolute;right:16px;top:8px;font-size:30px}
.opt.wrong::after{content:"✖";position:absolute;right:16px;top:8px;font-size:30px}

#feedback{display:none;border-radius:28px;padding:clamp(14px,3vw,24px);text-align:center;margin-bottom:12px}
#feedback.show{display:block;animation:slide .3s}
#feedback.ok{background:#d3f9d8}
#feedback.no{background:#ffe3e3}
#fbTitle{font-size:clamp(28px,5vw,42px);margin:0 0 6px}
.explain{text-align:left;background:#fff;border-radius:20px;padding:12px 20px;margin:12px auto;font-size:clamp(20px,3vw,28px);line-height:1.9}
.explain ol{margin:0;padding-left:1.4em}
.explain li{margin:6px 0}
.explain .frac{font-size:1.1em}

/* 결과 화면 */
#result{align-items:center;justify-content:center;text-align:center;gap:14px}
.stars{font-size:clamp(60px,12vw,110px);letter-spacing:.1em}
.score-big{font-size:clamp(60px,13vw,120px);color:var(--pink-d);text-shadow:3px 3px 0 #fff;line-height:1}
.msg{font-size:clamp(26px,4.4vw,40px);margin:0}
.confetti{position:fixed;top:-60px;font-size:34px;pointer-events:none;animation:fall linear forwards;z-index:50}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{opacity:0;transform:translateY(-50px) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes jump{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}

@media (max-width:560px){
  #grid{gap:10px}
  .top{flex-wrap:wrap}
  .bar-wrap{order:3;flex-basis:100%}
}
</style>
</head>
<body>
<div id="app">

  <!-- 시작 화면 -->
  <section id="start" class="screen active">
    <div class="logo">🍕</div>
    <h1>분수 덧셈 퀴즈</h1>
    <p class="sub">분수 덧셈 10문제에 도전해 보세요!<br>정답을 맞히면 <b>+10점</b>!</p>
    <div class="chips">
      <span class="chip">🌱 1~3번 분모가 같아요</span>
      <span class="chip">🌿 4~7번 통분하기</span>
      <span class="chip">🌳 8~10번 대분수</span>
    </div>
    <button id="startBtn" class="big-btn">시작하기 ▶</button>
    <div id="best" class="best"></div>
  </section>

  <!-- 퀴즈 화면 -->
  <section id="quiz" class="screen">
    <div class="top">
      <div class="pill" id="qnum">1 / 10</div>
      <div class="bar-wrap"><div id="bar"></div></div>
      <div class="pill" id="scorePill">⭐ <span id="score">0</span>점</div>
      <button id="soundBtn" class="icon-btn" aria-label="소리 켜기/끄기">🔊</button>
    </div>

    <div class="card">
      <div class="level" id="level"></div>
      <div id="eq"></div>
    </div>

    <div id="grid"></div>

    <div id="feedback">
      <h2 id="fbTitle"></h2>
      <div id="fbBody"></div>
      <button id="nextBtn" class="big-btn green">다음 문제 ▶</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="screen">
    <div class="stars" id="stars"></div>
    <div class="score-big"><span id="finalScore">0</span>점</div>
    <p class="msg" id="finalMsg"></p>
    <p class="sub" id="finalCount"></p>
    <div class="best" id="finalBest"></div>
    <button id="retryBtn" class="big-btn">다시 도전! 🔄</button>
  </section>

</div>

<script>
// ==LOGIC-START==
const TOTAL = 10, POINT = 10;
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const lcm = (a, b) => a / gcd(a, b) * b;
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const reduce = (n, d) => { const g = gcd(n, d); return { n: n / g, d: d / g }; };

const frac = (n, d) => `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`;
const mixed = (w, n, d) => w > 0
  ? `<span class="mixed"><span class="whole">${w}</span>${frac(n, d)}</span>`
  : frac(n, d);
// 가분수/진분수(기약분수)를 화면용으로: 자연수, 대분수, 진분수
function showImproper(n, d){
  if (d === 1) return `<span class="whole">${n}</span>`;
  const w = Math.floor(n / d), r = n % d;
  return w > 0 ? mixed(w, r, d) : frac(r, d);
}
function readable(n, d){
  if (d === 1) return String(n);
  const w = Math.floor(n / d), r = n % d;
  return (w > 0 ? w + '과 ' : '') + d + '분의 ' + r;
}

function makeQuestion(i){
  const D1 = [2, 3, 4, 5, 6, 8, 10, 12], D2 = [2, 3, 4, 5, 6, 8];
  let w1 = 0, w2 = 0, d1, d2, n1, n2;
  if (i < 3){            // 분모가 같은 진분수
    do {
      d1 = d2 = rnd(4, 10); n1 = rnd(1, d1 - 1); n2 = rnd(1, d1 - 1);
    } while (i === 0 && n1 + n2 >= d1);
  } else if (i < 7){     // 분모가 다른 진분수 (통분)
    do { d1 = pick(D1); d2 = pick(D1); } while (d1 === d2 || lcm(d1, d2) > 30);
    n1 = rnd(1, d1 - 1); n2 = rnd(1, d2 - 1);
  } else {               // 대분수 + 대분수
    w1 = rnd(1, 3); w2 = rnd(1, 3);
    do { d1 = pick(D2); d2 = Math.random() < 0.35 ? d1 : pick(D2); } while (lcm(d1, d2) > 30);
    n1 = rnd(1, d1 - 1); n2 = rnd(1, d2 - 1);
  }
  const L = lcm(d1, d2);
  const N = (w1 * d1 + n1) * (L / d1) + (w2 * d2 + n2) * (L / d2);
  const ans = reduce(N, L);
  const key = f => f.n + '/' + f.d;
  const used = new Set([key(ans)]);

  // 자주 하는 실수: 분모끼리도 더하기
  const wd = d1 + d2;
  const wrongAdd = reduce((w1 + w2) * wd + n1 + n2, wd);
  const raw = shuffle([[N + 1, L], [N - 1, L], [N + 2, L], [N - 2, L], [N + L, L], [N - L, L], [N + 3, L], [N - 3, L]]
    .filter(([n]) => n > 0).map(([n, d]) => reduce(n, d)));
  const cands = Math.random() < 0.8 ? [wrongAdd, ...raw] : [...raw, wrongAdd];
  const distract = [];
  for (const c of cands){
    if (distract.length >= 3) break;
    if (c.n <= 0 || used.has(key(c))) continue;
    used.add(key(c)); distract.push(c);
  }
  for (let k = 4; distract.length < 3; k++){
    const c = reduce(N + k, L);
    if (!used.has(key(c))) { used.add(key(c)); distract.push(c); }
  }
  const options = shuffle([{ ...ans, correct: true }, ...distract.map(c => ({ ...c, correct: false }))]);
  return { w1, n1, d1, w2, n2, d2, ans, options };
}

function explain(q){
  const L = lcm(q.d1, q.d2), a = q.n1 * L / q.d1, b = q.n2 * L / q.d2;
  const W = q.w1 + q.w2, sn = a + b;
  const steps = [];
  if (q.d1 !== q.d2){
    steps.push(`분모 ${q.d1}과(와) ${q.d2}의 공배수 ${L}(으)로 통분해요.<br>` +
      `${mixed(q.w1, q.n1, q.d1)} → ${mixed(q.w1, a, L)} , ${mixed(q.w2, q.n2, q.d2)} → ${mixed(q.w2, b, L)}`);
  }
  const hasWhole = W > 0;
  steps.push(`${hasWhole ? '자연수끼리, ' : ''}분모는 그대로 두고 분자끼리 더해요.<br>` +
    `${mixed(q.w1, a, L)} + ${mixed(q.w2, b, L)} = ${mixed(W, sn, L)}`);
  const carry = Math.floor(sn / L), r = sn % L, g = r > 0 ? gcd(r, L) : 1;
  if (carry > 0 || g > 1){
    const msg = [];
    if (carry > 0) msg.push('분수 부분이 1보다 크면 자연수로 올려요');
    if (g > 1) msg.push(`${g}(으)로 약분해요`);
    steps.push(`${msg.join(' · ')}.<br>${mixed(W, sn, L)} = ${showImproper(q.ans.n, q.ans.d)}`);
  }
  return '<ol>' + steps.map(s => `<li>${s}</li>`).join('') + '</ol>';
}
// ==LOGIC-END==

// ---------- 화면 ----------
const $ = id => document.getElementById(id);
const screens = ['start', 'quiz', 'result'];
function show(name){ screens.forEach(s => $(s).classList.toggle('active', s === name)); window.scrollTo(0, 0); }

let idx = 0, score = 0, correctCount = 0, q = null, locked = false;

// 소리
let audioCtx = null, soundOn = true;
function tones(freqs, type){
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    freqs.forEach((f, k) => {
      const t0 = audioCtx.currentTime + k * 0.13;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 0.25);
    });
  } catch (e) {}
}
const sndOk = () => tones([523, 659, 784, 1047], 'sine');
const sndNo = () => tones([330, 247], 'triangle');
const sndEnd = () => tones([523, 659, 784, 659, 784, 1047], 'sine');

function loadBest(){ try { return parseInt(localStorage.getItem('fracQuizBest'), 10) || 0; } catch (e) { return 0; } }
function saveBest(v){ try { localStorage.setItem('fracQuizBest', String(v)); } catch (e) {} }
function showBestOnStart(){
  const b = loadBest();
  $('best').textContent = b > 0 ? `🏅 내 최고 점수: ${b}점` : '';
}

function renderQuestion(){
  q = makeQuestion(idx); locked = false;
  $('qnum').textContent = `${idx + 1} / ${TOTAL}`;
  $('bar').style.width = (idx / TOTAL * 100) + '%';
  $('score').textContent = score;
  $('level').textContent = idx < 3 ? '🌱 분모가 같은 덧셈' : idx < 7 ? '🌿 통분이 필요해요' : '🌳 대분수의 덧셈';
  $('eq').innerHTML = `${mixed(q.w1, q.n1, q.d1)}<span class="op">+</span>${mixed(q.w2, q.n2, q.d2)}<span class="op">=</span><span class="op q">?</span>`;
  $('grid').innerHTML = q.options.map((o, k) =>
    `<button class="opt" data-k="${k}" aria-label="${readable(o.n, o.d)}"><span class="tag">${k + 1}</span>${showImproper(o.n, o.d)}</button>`
  ).join('');
  const fb = $('feedback'); fb.className = ''; $('fbBody').innerHTML = '';
  $('nextBtn').textContent = idx === TOTAL - 1 ? '결과 보기 🏆' : '다음 문제 ▶';
}

function answer(k){
  if (locked) return;
  locked = true;
  const chosen = q.options[k];
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach((b, j) => {
    b.disabled = true;
    if (q.options[j].correct) b.classList.add('correct');
    else if (j === k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const fb = $('feedback');
  if (chosen.correct){
    score += POINT; correctCount++;
    $('score').textContent = score;
    const pop = document.createElement('span');
    pop.className = 'pop'; pop.textContent = '+' + POINT;
    $('scorePill').appendChild(pop);
    setTimeout(() => pop.remove(), 1000);
    $('fbTitle').textContent = pick(['🎉 정답이에요! +10점', '👏 잘했어요! +10점', '🌟 멋져요! +10점', '💯 대단해요! +10점']);
    $('fbBody').innerHTML = '';
    fb.className = 'show ok';
    sndOk();
  } else {
    $('fbTitle').innerHTML = `😢 아쉬워요! 정답은 ${showImproper(q.ans.n, q.ans.d)} 이에요`;
    $('fbBody').innerHTML = `<div class="explain"><b>💡 이렇게 풀어요</b>${explain(q)}</div>`;
    fb.className = 'show no';
    sndNo();
  }
  $('bar').style.width = ((idx + 1) / TOTAL * 100) + '%';
  setTimeout(() => fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
}

function next(){
  if (!locked) return;
  if (idx === TOTAL - 1){ finish(); return; }
  idx++; renderQuestion(); window.scrollTo(0, 0);
}

function finish(){
  const prevBest = loadBest();
  const isNew = score > prevBest;
  if (isNew) saveBest(score);
  $('finalScore').textContent = score;
  $('stars').textContent = score >= 90 ? '⭐⭐⭐' : score >= 60 ? '⭐⭐☆' : score >= 30 ? '⭐☆☆' : '☆☆☆';
  $('finalMsg').textContent = score === 100 ? '완벽해요! 분수 박사님이에요! 🏆'
    : score >= 80 ? '아주 잘했어요! 🎉'
    : score >= 60 ? '잘했어요! 조금만 더 연습해 봐요 😊'
    : '괜찮아요! 다시 도전하면 더 잘할 수 있어요 💪';
  $('finalCount').textContent = `10문제 중 ${correctCount}문제를 맞혔어요`;
  $('finalBest').textContent = isNew && score > 0 ? '🎊 최고 점수를 새로 만들었어요!' : `🏅 내 최고 점수: ${Math.max(prevBest, score)}점`;
  show('result');
  sndEnd();
  if (score >= 60) confetti();
}

function confetti(){
  const e = ['🎉', '⭐', '🎈', '🍀', '✨', '🍕'];
  for (let i = 0; i < 36; i++){
    const s = document.createElement('span');
    s.className = 'confetti'; s.textContent = pick(e);
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
    s.style.animationDelay = (Math.random() * 1.2) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 6500);
  }
}

function startGame(){
  idx = 0; score = 0; correctCount = 0;
  show('quiz'); renderQuestion();
}

$('startBtn').addEventListener('click', () => { tones([660], 'sine'); startGame(); });
$('retryBtn').addEventListener('click', startGame);
$('nextBtn').addEventListener('click', next);
$('grid').addEventListener('click', e => {
  const b = e.target.closest('.opt');
  if (b) answer(parseInt(b.dataset.k, 10));
});
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
});
document.addEventListener('keydown', e => {
  if (!$('quiz').classList.contains('active')) return;
  if (e.key >= '1' && e.key <= '4') answer(parseInt(e.key, 10) - 1);
  else if (e.key === 'Enter') next();
});

showBestOnStart();
</script>
